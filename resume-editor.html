  function shareFile(name, mime, content) {
    var f; try { f = new File([content], name, { type: mime }); } catch (e) { f = null; }
    if (f && navigator.canShare && navigator.canShare({ files: [f] })) {
      navigator.share({ files: [f], title: name }).catch(function () {});
    } else { download(name, mime, content); say("Sharing not available - downloaded instead", true); alert("Sharing is not available here, so I tried a normal download. If nothing downloads, open this page in Chrome."); }
  }
  $("bSave").onclick = function () {
    download("resume-editor.html", "text/html", sourceHtml());
    say("Saved copy downloaded - find resume-editor.html in your Downloads", true);
  };
  $("bShareWord").onclick = function () { shareFile(wordName(), "application/msword", wordHtml()); };
  $("bShareHtml").onclick = function () { shareFile("resume-editor.html", "text/html", sourceHtml()); };
  $("bCopy").onclick = function () {
    var txt = JSON.stringify(D);
    function manual() {
      var ov = document.createElement("div");
      ov.style.cssText = "position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px";
      ov.innerHTML = '<div style="background:#fff;border-radius:10px;padding:12px;width:100%;max-width:520px;font-family:Calibri,Arial,sans-serif"><b>Select all and copy</b><textarea readonly style="width:100%;height:220px;margin:8px 0;font:12px monospace"></textarea><button class="abtn" style="width:100%">Close</button></div>';
      ov.querySelector("textarea").value = txt;
      ov.querySelector("button").onclick = function () { ov.remove(); };
      document.body.appendChild(ov); var ta = ov.querySelector("textarea"); ta.focus(); ta.select();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { say("Data copied", true); alert("Copied. Paste it into the chat."); }, manual);
    else manual();
  };
  $("bBackup").onclick = function () { download("resume-data.json", "application/json", JSON.stringify(D, null, 2)); };
  $("bRestore").onclick = function () { $("fileIn").click(); };
  $("fileIn").onchange = function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var txt = String(r.result), p;
        try { p = JSON.parse(txt); }
        catch (e1) {
          var el = new DOMParser().parseFromString(txt, "text/html").getElementById("saved-data");
          p = el ? JSON.parse(el.textContent) : null;
        }
        if (!p || !p.name || !p.jobs) throw 0;
        D = Object.assign(clone(SEED), p); if (!D.hidden) D.hidden = {};
        changed(); setMode(document.body.className); say("Loaded your saved resume ✓", true);
      } catch (x) { alert("That file has no saved resume data. Use a file made by the 💾 Save button or Backup."); }
    };
    r.readAsText(f); e.target.value = "";
  };
  $("bReset").onclick = function () {
    if (!confirm("Reset to the original resume? Your edits on this device will be lost.")) return;
    D = clone(SEED); try { localStorage.removeItem(KEY); } catch (e) {}
    setMode(document.body.className); say("Reset done");
  };

  /* ================= start ================= */
  buildTabs();
  setMode("view");
})();
</script>
