<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Script Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: an IDE. Ribbon on top, toolbox left, drag-and-drop workspace centre, live code right or bottom. Phones get one pane at a time with a bottom tab bar. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --sunken:#e7ecf3; --ink:#16202e; --muted:#5b6778; --line:#d3dae5;
  --accent:#2c6aa8; --accent-ink:#ffffff; --sun:#f0bf2c; --danger:#b8352e; --ok:#2e7d52;
  --bar:#142238; --bar-ink:#eef3fa; --ribbon:#f8fafd; --work:#e9eef5; --dot:#c4cedc;
  --code-bg:#0f1826; --code-bar:#0a111c; --code-ink:#e4eaf4; --code-muted:#8493a8; --code-str:#f3cf63; --code-key:#7fb7ee; --code-num:#f09a7c;
  --c-basics:#3b7dd8; --c-logic:#cf8a1c; --c-files:#3a9460; --c-text:#8562c6; --c-tables:#1c949a; --c-web:#d45d4b; --c-auto:#66768c;
  --c-data:#0e8f9c; --c-ui_win:#b83c8e; --c-ui_in:#a64bc9; --c-ui_act:#e0457b; --c-ui_out:#7a56d6;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0b1119; --surface:#151e2c; --sunken:#0e1520; --ink:#e7ecf4; --muted:#9aa6b8; --line:#2a3547;
    --accent:#6dabe8; --accent-ink:#0b1119; --danger:#ef7d76; --ok:#6cc596;
    --bar:#070b12; --ribbon:#111926; --work:#0d141e; --dot:#243044; --code-bg:#090e16; --code-bar:#05080d;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b1119; --surface:#151e2c; --sunken:#0e1520; --ink:#e7ecf4; --muted:#9aa6b8; --line:#2a3547;
  --accent:#6dabe8; --accent-ink:#0b1119; --danger:#ef7d76; --ok:#6cc596;
  --bar:#070b12; --ribbon:#111926; --work:#0d141e; --dot:#243044; --code-bg:#090e16; --code-bar:#05080d;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{margin:0;font-size:16px;font-family:var(--display)}
p{margin:0}
a{color:var(--accent)}
[hidden]{display:none!important}
.ic{width:20px;height:20px;flex:none}
i.ic{display:inline-grid;place-items:center;font-style:normal;font-size:12px;font-weight:600}
i.ic::before{content:attr(data-fb)}
.app{height:100%;display:flex;flex-direction:column;min-height:0}

/* menu bar + ribbon */
.menubar{flex:none;display:flex;align-items:flex-end;gap:6px;background:var(--bar);color:var(--bar-ink);padding:6px 8px 0 10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:15px;padding:0 12px 9px 0;white-space:nowrap}
.logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent) 50%,var(--sun) 50%)}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.tab{flex:none;background:transparent;border:0;color:var(--bar-ink);opacity:.8;padding:8px 14px;border-radius:8px 8px 0 0;font-weight:500;cursor:pointer;min-height:38px}
.tab:hover{opacity:1}
.tab[aria-selected="true"]{background:var(--ribbon);color:var(--ink);opacity:1}
.rt{flex:none;background:transparent;border:0;color:var(--bar-ink);width:38px;height:38px;cursor:pointer;border-radius:6px}
.rt[aria-expanded="false"] .ic{transform:rotate(180deg)}
.ribbon{flex:none;background:var(--ribbon);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:6px 6px}
.ribbon.closed{display:none}
.grp{flex:none;display:flex;flex-direction:column;padding:0 8px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0}
.items{display:flex;gap:2px}
.gname{font-size:11px;color:var(--muted);text-align:center;margin-top:3px}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:60px;min-height:58px;padding:6px;border:1px solid transparent;border-radius:8px;background:transparent;cursor:pointer;font-size:12px;color:var(--ink);text-decoration:none}
.rb .ic{width:22px;height:22px;color:var(--accent)}
.rb:hover{background:var(--sunken)}
.rb[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:var(--accent)}
.rb[disabled]{opacity:.4;cursor:default}
.rb.primary{background:var(--accent);color:var(--accent-ink)}
.rb.primary .ic{color:var(--accent-ink)}

/* panes */
.main{flex:1;min-height:0}
.pane{min-width:0;min-height:0}
.tool{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column}
.tool-head{padding:8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sunken);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 6px;cursor:pointer;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;min-height:38px;color:var(--muted)}
.seg button .ic{width:16px;height:16px}
.seg button small{font-weight:500;font-size:11px;opacity:.8}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg button[data-side="front"][aria-selected="true"] .ic{color:var(--c-ui_win)}
.seg button[data-side="back"][aria-selected="true"] .ic{color:var(--c-basics)}
.head-row{display:flex;align-items:center;gap:6px}
.head-row .search{flex:1}
#drawerX{display:none}
.tag{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--cat);border:1px solid var(--cat);border-radius:4px;padding:0 5px;line-height:1.5}
.rail,.scrim{display:none}
.search{position:relative}
.search .ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
input[type=search],input[type=text],input[type=number],select,textarea{width:100%;background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:36px}
.search input{padding-left:32px}
textarea{resize:vertical;min-height:84px}
.tool-body{flex:1;overflow-y:auto;padding:2px 8px 14px}
.none{color:var(--muted);padding:16px 4px}
.cat .ch{display:flex;align-items:center;gap:8px;width:100%;padding:10px 4px;background:none;border:0;border-bottom:1px solid var(--line);font-weight:600;cursor:pointer;text-align:left}
.cat .dot{width:10px;height:10px;border-radius:3px;background:var(--cat)}
.cat .n{margin-left:auto;color:var(--muted);font-weight:400;font-size:12px}
.cat .ch .ic{width:16px;height:16px;color:var(--muted)}
.cat.closed .ch .ic{transform:rotate(-90deg)}
.cat.closed .grid{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;padding:8px 0 10px}
.comp{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 3px 7px;min-height:68px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:grab;font-size:11.5px;line-height:1.2;text-align:center;user-select:none;-webkit-user-select:none}
.comp .ic{width:22px;height:22px;color:var(--cat)}
.comp:hover{border-color:var(--cat);box-shadow:0 1px 6px color-mix(in srgb,var(--cat) 25%,transparent)}

.work{position:relative;display:flex;flex-direction:column;background-color:var(--work);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:18px 18px}
.work.over{outline:2px dashed var(--accent);outline-offset:-6px}
.work-scroll{flex:1;overflow:auto;padding:18px 14px 60px;display:flex;flex-direction:column;align-items:center}
.flow{width:100%;max-width:780px;display:flex;flex-direction:column;gap:14px}
.steps{display:flex;flex-direction:column;gap:14px}
.term{position:relative;align-self:flex-start;background:var(--ink);color:var(--surface);border-radius:999px;padding:3px 14px;font-size:12px;font-weight:600}
.term.start::after,.step::after{content:"";position:absolute;left:28px;top:100%;height:14px;width:2px;background:var(--muted);opacity:.5}
.empty{margin:auto;max-width:360px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted);border:2px dashed var(--line);border-radius:14px;padding:30px 22px;background:var(--surface)}
.empty .ic{width:36px;height:36px;color:var(--accent)}
.empty b{color:var(--ink);font-size:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:38px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.step{position:relative;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cat);border-radius:10px;margin-left:calc(var(--depth,0)*20px)}
.step.sel{border-color:var(--cat);box-shadow:0 0 0 2px color-mix(in srgb,var(--cat) 30%,transparent)}
.step.bad{border-color:var(--danger)}
.step.flash{animation:flash 1s ease-out}
@keyframes flash{from{box-shadow:0 0 0 4px var(--sun)}to{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.step.flash{animation:none}}
.sh{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 2px;min-height:46px}
.grip{flex:none;width:28px;height:36px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab}
.grip .ic{width:16px;height:16px}
.tile{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--cat) 16%,transparent);color:var(--cat)}
.tile .ic{width:17px;height:17px}
.ttl{font-weight:600;white-space:nowrap}
.sum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:13px}
.tools{display:flex;opacity:0}
.step:hover .tools,.step.sel .tools,.step:focus-within .tools{opacity:1}
@media (hover:none){.tools{opacity:1}}
.icon{border:0;background:transparent;width:32px;height:32px;border-radius:6px;cursor:pointer;color:var(--muted);display:grid;place-items:center;flex:none}
.icon .ic{width:16px;height:16px}
.icon:hover{background:var(--sunken);color:var(--ink)}
.icon[disabled]{opacity:.3;cursor:default}
.icon.del:hover{color:var(--danger)}
.step.col .fold .ic{transform:rotate(-90deg)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;padding:0 12px 12px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:11.5px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{min-height:34px;padding:5px 9px}
.field textarea{min-height:64px}
.warn{margin:0 12px 10px;padding:5px 9px;font-size:13px;color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent);border-radius:6px}
.warn:empty{display:none}
.hint{margin:0 12px 10px;font-size:12.5px;color:var(--muted)}
.ins{display:none;flex-wrap:wrap;gap:6px;align-items:center;padding:0 12px 10px;font-size:12px;color:var(--muted)}
.step:focus-within .ins:not(:empty){display:flex}
.vchip{border:1px solid var(--line);background:var(--sunken);border-radius:999px;padding:2px 10px;font-family:var(--mono);font-size:12px;cursor:pointer;min-height:28px}
.vchip:hover{border-color:var(--accent);color:var(--accent)}
.step.col .fields,.step.col .ins,.step.col .warn,.step.col .hint{display:none}
.dropline{height:4px;border-radius:2px;background:var(--sun);margin:-8px 0}
.ghost{position:fixed;z-index:80;pointer-events:none;padding:8px 12px;border-radius:8px;background:var(--ink);color:var(--surface);font-weight:600;font-size:13px;transform:translate(10px,10px);max-width:220px}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}

/* code pane */
.code{position:relative;display:flex;flex-direction:column;background:var(--code-bg);color:var(--code-ink)}
.split{position:absolute;z-index:5;background:transparent}
.ed-bar{flex:none;display:flex;align-items:flex-end;gap:4px;background:var(--code-bar);padding:0 8px;min-height:42px;color:#c7d0de}
.ftab{display:flex;gap:8px;align-items:center;padding:7px 12px;background:var(--code-bg);border-radius:6px 6px 0 0;font:12.5px var(--mono)}
.ftab i{width:8px;height:8px;border-radius:50%;background:var(--code-key)}
.sp{flex:1}
.ed-bar .icon{color:#c7d0de;align-self:center}
.ed-bar .icon:hover{background:rgba(255,255,255,.1);color:#fff}
.ed-bar .icon .ic{width:18px;height:18px}
.editor{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:auto minmax(max-content,1fr);align-content:start;font:13px/1.65 var(--mono);tab-size:4}
.gut,.src{margin:0;padding:12px 0;font:inherit;white-space:pre}
.gut{position:sticky;left:0;background:var(--code-bg);color:var(--code-muted);text-align:right;user-select:none;-webkit-user-select:none;border-right:1px solid rgba(255,255,255,.07)}
.gut span{display:block;padding:0 10px}
.src span.l{display:block;padding:0 16px;width:max-content;min-width:100%}
.src span.l.hl{background:rgba(240,191,44,.13);box-shadow:inset 3px 0 0 var(--sun)}
.src .c{color:var(--code-muted)} .src .s{color:var(--code-str)} .src .k{color:var(--code-key)} .src .n{color:var(--code-num)}

.status{flex:none;display:flex;align-items:center;gap:14px;background:var(--bar);color:var(--bar-ink);padding:0 10px;min-height:28px;font-size:12px}
.sb{background:none;border:0;color:inherit;display:flex;align-items:center;gap:6px;cursor:pointer;padding:3px 6px;border-radius:4px}
.sb:hover{background:rgba(255,255,255,.12)}
.sb .ic{width:14px;height:14px}
.sb.bad{color:#ffb3ad}
.pill{border:1px solid currentColor;border-radius:999px;padding:0 8px;opacity:.9}
.bnav{display:none}

/* dialogs and toast */
.ov{position:fixed;inset:0;z-index:70;background:rgba(8,14,24,.55);display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 4px 18px}
.dlg-b{padding:8px 18px 18px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.eg{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:6px 12px;min-height:34px;cursor:pointer;font-size:13px;text-align:left}
.eg:hover{border-color:var(--accent);color:var(--accent)}
.status-msg{font-size:13px;color:var(--muted);min-height:1.3em}
.status-msg.warn2{color:var(--danger)}
.help{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.help li{display:flex;gap:12px;align-items:flex-start}
.help .ic{color:var(--accent);margin-top:2px}
.help code,.kbd{font-family:var(--mono);font-size:12.5px;background:var(--sunken);border:1px solid var(--line);border-radius:5px;padding:1px 6px;overflow-wrap:anywhere}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li{display:flex;gap:8px;align-items:flex-start;color:var(--danger)}
.plist button{border:0;background:var(--sunken);border-radius:6px;padding:3px 9px;cursor:pointer;font-weight:600;color:var(--ink);flex:none}
.ok-msg{color:var(--ok);display:flex;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;font-weight:500;z-index:90;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

/* wide: three panes */
@media (min-width:900px){
  .main{display:grid;grid-template-columns:var(--tw,264px) minmax(0,1fr) var(--cw,420px);grid-template-rows:minmax(0,1fr);grid-template-areas:"tool work code"}
  .app[data-code="bottom"] .main{grid-template-columns:var(--tw,264px) minmax(0,1fr);grid-template-rows:minmax(0,1fr) var(--ch,280px);grid-template-areas:"tool work" "tool code"}
  .app[data-code="hidden"] .main{grid-template-columns:var(--tw,264px) minmax(0,1fr);grid-template-areas:"tool work"}
  .app[data-code="hidden"] .code{display:none}
  .app[data-tool="off"] .main{--tw:0px}
  .app[data-tool="off"] .tool{display:none}
  .tool{grid-area:tool}.work{grid-area:work}.code{grid-area:code}
  .app[data-code="right"] .split{left:-4px;top:0;bottom:0;width:8px;cursor:col-resize}
  .app[data-code="bottom"] .split{left:0;right:0;top:-4px;height:8px;cursor:row-resize}
}
/* narrow: one pane at a time */
@media (max-width:899px){
  .main{position:relative}
  .pane{position:absolute;inset:0}
  .work,.code{left:48px}
  .app[data-view="work"] .code,.app[data-view="code"] .work{display:none}
  .rail{display:flex;position:absolute;left:0;top:0;bottom:0;width:48px;z-index:12;flex-direction:column;align-items:center;gap:6px;padding:8px 0;background:var(--surface);border-right:1px solid var(--line)}
  .rail button{width:40px;min-height:52px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;cursor:pointer;padding:4px 0}
  .rail button .ic{width:20px;height:20px}
  .rail button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:var(--accent);color:var(--ink)}
  .rail .rf .ic{color:var(--c-ui_win)} .rail .rb2 .ic{color:var(--c-basics)}
  .rail .rt2{margin-bottom:6px}
  .tool{inset:auto;top:0;bottom:0;left:48px;width:min(290px,calc(100% - 120px));z-index:11;transform:translateX(calc(-100% - 48px));transition:transform .2s ease;box-shadow:6px 0 24px rgba(0,0,0,.25)}
  .app[data-drawer="open"] .tool{transform:none}
  .scrim{position:absolute;left:48px;top:0;right:0;bottom:0;z-index:10;background:rgba(8,14,24,.45)}
  .app[data-drawer="open"] .scrim{display:block}
  #drawerX{display:grid}
  .status,.split{display:none}
  .bnav{display:flex;flex:none;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .bnav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;min-height:54px;background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer}
  .bnav button[aria-selected="true"]{color:var(--accent);font-weight:600}
  .badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;font-style:normal;min-width:18px;padding:0 5px;text-align:center}
  .badge.bad{background:var(--danger);color:#fff}
  .badge:empty{display:none}
  .toast{bottom:70px}
  @media (prefers-reduced-motion:reduce){.tool{transition:none}}
  .sum{display:none}
  .ttl{flex:1}
  .sh{flex-wrap:wrap}
  .step:not(.sel) .tools{display:none}
  .step.sel .tools{opacity:1;order:5;margin-left:auto;width:100%;justify-content:flex-end;border-top:1px solid var(--line)}
  .step.sel .fold{order:4}
}
@media (max-width:520px){.brand b{display:none}}

button.ftab{border:0;color:inherit;cursor:pointer;font-family:var(--mono)}
.ftab.off{background:transparent;opacity:.65}.ftab.off:hover{opacity:1}
.runb{align-self:center;display:flex;gap:6px;align-items:center;border:0;border-radius:7px;padding:6px 12px;font:600 13px var(--sans,inherit);background:#1f9d55;color:#fff;cursor:pointer;margin-right:4px}
.runb:hover{background:#188a49}.runb:disabled{opacity:.6;cursor:wait}.runb .ic{width:16px;height:16px}
.outp{flex:1;min-height:0;overflow:auto;background:var(--code-bg);color:#e6edf7;display:none;flex-direction:column;gap:10px;padding:10px 12px;font:13px/1.55 var(--mono)}
#codePane[data-pane="out"] .editor{display:none}#codePane[data-pane="out"] .outp{display:flex}
.otools{display:flex;flex-wrap:wrap;gap:6px}
.ob{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:#e6edf7;border-radius:7px;padding:5px 10px;font:12.5px var(--sans,inherit);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.ob:hover{background:rgba(255,255,255,.16)}.ob .ic{width:15px;height:15px}
.olog{white-space:pre-wrap;word-break:break-word;margin:0;min-height:48px;background:rgba(0,0,0,.25);border-radius:8px;padding:8px 10px;font:12.5px/1.55 var(--mono)}
.olog .e{color:#ff9b9b}.olog .i{color:#8fb4ff}.olog .g{color:#7fe3a5}
.oans{width:100%;min-height:54px;border-radius:8px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.25);color:#e6edf7;font:12.5px var(--mono);padding:6px 8px;box-sizing:border-box}
.olab{font:600 11.5px var(--sans,inherit);text-transform:uppercase;letter-spacing:.05em;color:#9fb0c6}
.ofiles{display:flex;flex-direction:column;gap:4px}
.ofile{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border-radius:7px;padding:4px 8px}
.ofile span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ofile small{opacity:.6}
.app{background:#f4f5f8;color:#1c2330;border-radius:10px;overflow:hidden;font:14px var(--sans,system-ui);border:1px solid rgba(255,255,255,.2)}
.app-t{background:#dfe3ea;padding:6px 10px;font-weight:600;font-size:13px}
.app-tabs{display:flex;gap:2px;background:#e9ecf1;padding:6px 8px 0}
.app-tabs button{border:0;background:#d7dce5;padding:6px 14px;border-radius:7px 7px 0 0;cursor:pointer;font:inherit;color:#33405a}
.app-tabs button.on{background:#fff;font-weight:600}
.app-pg{background:#fff;padding:10px 14px 14px;display:none;flex-direction:column;gap:6px}.app-pg.on{display:flex}
.app-pg.solo{display:flex}.app-pg input[type=text],.app-pg select{border:1px solid #b9c1cf;border-radius:6px;padding:6px 8px;font:inherit;width:100%;box-sizing:border-box}
.app-pg label{font-size:13px;color:#33405a}.app-pg .al{font:700 16px var(--sans,system-ui);margin-top:6px}
.app-pg .ab{align-self:center;background:#2f6fed;color:#fff;border:0;border-radius:7px;padding:7px 18px;font:600 14px inherit;cursor:pointer;margin-top:6px}
.app-pg pre.abox{margin:6px 0 0;background:#fff;border:1px solid #b9c1cf;border-radius:6px;padding:6px 8px;min-height:90px;white-space:pre-wrap;font:12.5px var(--mono);color:#1c2330}
.app-note{font-size:12px;color:#6a7690}
.tdt{width:100%;border-collapse:collapse;font-size:12.5px}.tdt th,.tdt td{border-bottom:1px solid var(--line,#d9dde5);padding:4px 8px;text-align:left;white-space:nowrap}
.tdw{overflow:auto;max-height:230px;border:1px solid var(--line,#d9dde5);border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px solid var(--line,#d9dde5);background:var(--surface);color:inherit;border-radius:999px;padding:3px 10px;font:12.5px inherit;cursor:pointer}
.chips button:hover{background:var(--hover,#eef1f6)}
.tdf{display:flex;flex-direction:column;gap:4px;font-size:13px}.tdf textarea,.tdf input{font:13px var(--mono);padding:6px 8px;border:1px solid var(--line,#b9c1cf);border-radius:7px;background:var(--surface);color:inherit;box-sizing:border-box;width:100%}
.tdrow{display:flex;gap:10px}.tdrow>*{flex:1}
</style>
</head>
<body>
<div class="app" id="app" data-view="work" data-code="right" data-tool="on">
  <header class="menubar">
    <div class="brand"><span class="logo"></span><b>Script Builder</b></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Menu"></nav>
    <button class="rt" id="rt" type="button" aria-expanded="true" aria-label="Show or hide the ribbon"><i class="ic" data-lucide="chevron-up" data-fb="^"></i></button>
  </header>
  <div class="ribbon" id="ribbon" role="toolbar" aria-label="Commands"></div>

  <div class="main" id="main">
    <nav class="rail" id="rail" aria-label="Toolbox menu">
      <button class="rt2" type="button" data-rail="toggle" aria-pressed="false" aria-label="Open or close the toolbox"><i class="ic" data-lucide="panel-left" data-fb="☰"></i></button>
      <button class="rf" type="button" data-rail="front" aria-pressed="false" aria-label="Front end components"><i class="ic" data-lucide="layout-template" data-fb="UI"></i>Front</button>
      <button class="rb2" type="button" data-rail="back" aria-pressed="false" aria-label="Back end components"><i class="ic" data-lucide="server" data-fb="&lt;/&gt;"></i>Back</button>
    </nav>
    <div class="scrim" id="scrim"></div>
    <aside class="tool pane" id="tool" aria-label="Toolbox">
      <div class="tool-head">
        <div class="seg" id="seg" role="tablist" aria-label="Component group">
          <button type="button" role="tab" data-side="front" aria-selected="false"><i class="ic" data-lucide="layout-template" data-fb="UI"></i>Front end</button>
          <button type="button" role="tab" data-side="back" aria-selected="true"><i class="ic" data-lucide="server" data-fb="&lt;/&gt;"></i>Back end</button>
        </div>
        <div class="head-row">
          <div class="search"><i class="ic" data-lucide="search" data-fb="?"></i><input id="q" type="search" placeholder="Search components" aria-label="Search components" autocomplete="off"></div>
          <button class="icon" id="drawerX" type="button" aria-label="Close toolbox"><i class="ic" data-lucide="chevron-left" data-fb="&lt;"></i></button>
        </div>
      </div>
      <div class="tool-body" id="toolBody"></div>
    </aside>

    <main class="work pane" id="work" aria-label="Workspace">
      <div class="work-scroll" id="workScroll">
        <div class="empty" id="empty">
          <i class="ic" data-lucide="mouse-pointer-click" data-fb="+"></i>
          <b>Drag components here</b>
          <div class="row" style="justify-content:center">
            <button class="btn primary" type="button" data-r="ask"><i class="ic" data-lucide="sparkles" data-fb="*"></i>Ask in English</button>
            <button class="btn" type="button" data-r="recipes"><i class="ic" data-lucide="book-open" data-fb="R"></i>Recipes</button>
          </div>
        </div>
        <div class="flow" id="flow" hidden>
          <div class="term start">Start</div>
          <div class="steps" id="steps"></div>
          <div class="term">End</div>
        </div>
      </div>
    </main>

    <section class="code pane" id="codePane" aria-label="Generated code">
      <div class="split" id="split"></div>
      <div class="ed-bar">
        <button class="ftab" type="button" data-pane="code"><i></i>my_script.py</button><button class="ftab off" type="button" data-pane="out"><i></i>Output</button>
        <span class="sp"></span>
        <button class="runb" type="button" id="runb" data-r="run" title="Run this script"><i class="ic" data-lucide="play" data-fb="&#9654;"></i>Run</button>
        <button class="icon" type="button" data-r="copy" title="Copy code" aria-label="Copy code"><i class="ic" data-lucide="copy" data-fb="C"></i></button>
        <button class="icon" type="button" data-r="save" title="Save" aria-label="Save script"><i class="ic" data-lucide="download" data-fb="S"></i></button>
      </div>
      <div class="outp" id="outp"></div>
      <div class="editor" id="editor"><pre class="gut" id="gut" aria-hidden="true"></pre><pre class="src" id="src" tabindex="0" aria-label="Python code"></pre></div>
    </section>
  </div>

  <footer class="status" id="status">
    <button class="sb" id="stProb" type="button"></button>
    <span id="stSteps"></span>
    <span class="sp"></span>
    <span class="pill" id="stDry" hidden>Preview on</span>
    <span>Python 3</span>
  </footer>

  <nav class="bnav" aria-label="Panels">
    <button type="button" data-v="work" aria-selected="true"><i class="ic" data-lucide="list-ordered" data-fb="≡"></i><span>Steps</span><em class="badge" id="bnW"></em></button>
    <button type="button" data-v="code" aria-selected="false"><i class="ic" data-lucide="code" data-fb="&lt;/&gt;"></i><span>Code</span><em class="badge" id="bnC"></em></button>
  </nav>
</div>

<div class="ov" id="ov" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">
    <div class="dlg-h"><h2 id="dlgT"></h2><button class="icon" id="dlgX" type="button" aria-label="Close"><i class="ic" data-lucide="x" data-fb="x"></i></button></div>
    <div class="dlg-b" id="dlgB"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
//<core>
const CATS = [["ui_win","Window","app-window","front"],["ui_in","Inputs","text-cursor-input","front"],["ui_act","Actions","mouse-pointer-click","front"],["ui_out","Output","monitor","front"],
  ["basics","Basics","box","back"],["logic","Logic","git-branch","back"],["files","Files","folder","back"],["text","Text","type","back"],["tables","Sheets","table","back"],["data","Data","database","back"],["web","Web","globe","back"],["auto","System","settings","back"]];
const CATSIDE = Object.fromEntries(CATS.map(c => [c[0], c[3]]));

const hasVar = v => /\{[^{}]+\}/.test(v);
const S = v => { v = String(v ?? ""); return (hasVar(v) ? "f" : "") + JSON.stringify(v); };
const N = (v, d) => { v = String(v ?? "").trim().replace(/[^A-Za-z0-9_]+/g, "_").replace(/^_+|_+$/g, ""); if (!v) v = d || "value"; if (/^\d/.test(v)) v = "_" + v; return v; };
const one = v => { const m = String(v ?? "").trim().match(/^\{([^{}]+)\}$/); return m ? m[1].trim() : null; };
const V = v => { v = String(v ?? "").trim(); if (/^-?\d+(\.\d+)?$/.test(v)) return v; const o = one(v); return o || S(v); };
const E = v => String(v ?? "").trim() || "None";
const NUM = (v, d = 0) => { const n = parseFloat(v); return isFinite(n) ? String(n) : String(d); };
const INT = (v, d = 0) => { const n = parseInt(v); return isFinite(n) ? String(n) : String(d); };
const P = v => { const o = one(v); return o ? `Path(${o})` : `Path(${S(v)})`; };
const STR = v => { const o = one(v); return o ? `str(${o})` : S(v); };
const isXl = v => /\.xls[xm]?$/i.test(String(v).trim());
const PATH = "from pathlib import Path";
const pd = c => { c.imp.add("import pandas as pd"); c.pip.add("pandas"); };
const F = (key, label, def, extra) => Object.assign({ key, label, def }, extra || {});

const BLOCKS = {
  say: { cat: "basics", label: "Show message", fields: [F("text", "Message", "Hello!", { wide: 1 })],
    gen: p => [`print(${S(p.text)})`] },
  ask: { cat: "basics", label: "Ask a question", fields: [F("q", "Question", "What is your name?"), F("name", "Remember as", "name"), F("type", "Answer is", "text", { opts: ["text", "number"] })],
    gen: p => [`${N(p.name, "answer")} = ${p.type === "number" ? "float(" : ""}input(${S(String(p.q).trim() + " ")})${p.type === "number" ? ")" : ""}`] },
  setvar: { cat: "basics", label: "Remember value", fields: [F("name", "Name", "city"), F("value", "Value", "Pune")],
    gen: p => [`${N(p.name)} = ${V(p.value)}`] },
  calc: { cat: "basics", label: "Calculate", fields: [F("name", "Save as", "total"), F("expr", "Calculation", "price * quantity")], hint: "Use + - * / and names you remembered earlier.",
    gen: p => [`${N(p.name, "result")} = ${E(p.expr)}`] },
  random: { cat: "basics", label: "Random number", fields: [F("name", "Save as", "number"), F("min", "From", "1", { num: 1 }), F("max", "To", "100", { num: 1 })],
    gen: (p, c) => { c.imp.add("import random"); return [`${N(p.name, "number")} = random.randint(${INT(p.min, 1)}, ${INT(p.max, 100)})`]; } },
  wait: { cat: "basics", label: "Wait", fields: [F("sec", "Seconds", "2", { num: 1 })],
    gen: (p, c) => { c.imp.add("import time"); return [`time.sleep(${NUM(p.sec, 1)})`]; } },
  note: { cat: "basics", label: "Note", fields: [F("text", "Note", "Remember to check the folder name", { wide: 1 })],
    gen: p => String(p.text).split("\n").map(l => "# " + l) },

  repeat: { cat: "logic", label: "Repeat", open: 1, fields: [F("n", "How many times", "5", { num: 1 })], hint: "Steps below repeat until the End block. {count} is the round number.",
    gen: p => [`for count in range(1, ${Math.max(0, parseInt(p.n) || 0) + 1}):`] },
  if: { cat: "logic", label: "If", open: 1, fields: [F("left", "Check", "age"), F("op", "Is", "greater than", { opts: ["equal to", "not equal to", "greater than", "less than", "containing", "starting with", "ending with"] }), F("right", "This", "17")], hint: "Steps below run only when the check passes, until Otherwise or End.",
    gen: p => { const L = E(p.left), R = V(p.right); const m = { "equal to": `${L} == ${R}`, "not equal to": `${L} != ${R}`, "greater than": `${L} > ${R}`, "less than": `${L} < ${R}`, "containing": `str(${R}) in str(${L})`, "starting with": `str(${L}).startswith(str(${R}))`, "ending with": `str(${L}).endswith(str(${R}))` }; return [`if ${m[p.op] || m["equal to"]}:`]; } },
  else: { cat: "logic", label: "Otherwise", kind: "else", fields: [], gen: () => ["else:"] },
  end: { cat: "logic", label: "End", kind: "end", fields: [], gen: () => [] },
  stop: { cat: "logic", label: "Stop", fields: [], gen: () => [`raise SystemExit("Stopped.")`] },

  foreach_file: { cat: "files", label: "For each file", open: 1, fields: [F("folder", "Folder", "C:/Users/me/Documents/Reports"), F("pattern", "Which files", "*.pdf")], hint: "Use *.* for every file. Inside this group, {file} is the current file.",
    gen: (p, c) => { c.imp.add(PATH); return [`for file in sorted(Path(${S(p.folder)}).glob(${S(p.pattern || "*")})):`, `    if not file.is_file():`, `        continue`]; } },
  list_files: { cat: "files", label: "List files", fields: [F("folder", "Folder", "C:/Users/me/Downloads")],
    gen: (p, c) => { c.imp.add(PATH); return [`for item in sorted(Path(${S(p.folder)}).iterdir()):`, `    print(item.name)`]; } },
  rename_file: { cat: "files", label: "Rename file", fields: [F("file", "File", "{file}"), F("mode", "How", "replace text", { opts: ["replace text", "add to start", "add to end"] }), F("a", "Text", "IMG_"), F("b", "Replace with", "Holiday_")], hint: "Replace with is only used by replace text.",
    gen: (p, c) => { c.imp.add(PATH); c.dry = true; const nn = p.mode === "add to start" ? `${STR(p.a)} + old.name` : p.mode === "add to end" ? `old.stem + ${STR(p.a)} + old.suffix` : `old.name.replace(${STR(p.a)}, ${STR(p.b)})`; return [`old = ${P(p.file)}`, `new_name = ${nn}`, `if DRY_RUN:`, `    print("Would rename", old.name, "to", new_name)`, `else:`, `    old.rename(old.with_name(new_name))`, `    print("Renamed", old.name, "to", new_name)`]; } },
  copy_file: { cat: "files", label: "Copy file", fields: [F("file", "File", "{file}"), F("dest", "To folder", "C:/Users/me/Backup")],
    gen: (p, c) => { c.imp.add(PATH); c.imp.add("import shutil"); c.dry = true; return [`if DRY_RUN:`, `    print("Would copy", ${P(p.file)}.name, "to", ${S(p.dest)})`, `else:`, `    Path(${S(p.dest)}).mkdir(parents=True, exist_ok=True)`, `    shutil.copy2(${P(p.file)}, ${S(p.dest)})`]; } },
  move_file: { cat: "files", label: "Move file", fields: [F("file", "File", "{file}"), F("dest", "To folder", "C:/Users/me/Archive")],
    gen: (p, c) => { c.imp.add(PATH); c.imp.add("import shutil"); c.dry = true; return [`if DRY_RUN:`, `    print("Would move", ${P(p.file)}.name, "to", ${S(p.dest)})`, `else:`, `    Path(${S(p.dest)}).mkdir(parents=True, exist_ok=True)`, `    shutil.move(str(${P(p.file)}), ${S(p.dest)})`]; } },
  delete_file: { cat: "files", label: "Delete file", fields: [F("file", "File", "{file}")], hint: "Deleted files do not go to the recycle bin. Keep Preview on until the output looks right.",
    gen: (p, c) => { c.imp.add(PATH); c.dry = true; return [`if DRY_RUN:`, `    print("Would delete", ${P(p.file)}.name)`, `else:`, `    ${P(p.file)}.unlink(missing_ok=True)`]; } },
  make_folder: { cat: "files", label: "New folder", fields: [F("folder", "Folder", "C:/Users/me/Documents/New Folder")],
    gen: (p, c) => { c.imp.add(PATH); return [`Path(${S(p.folder)}).mkdir(parents=True, exist_ok=True)`]; } },
  sort_by_type: { cat: "files", label: "Tidy folder", fields: [F("folder", "Folder", "C:/Users/me/Downloads")], hint: "Makes one subfolder per type (pdf, jpg, xlsx) and moves files in.",
    gen: (p, c) => { c.imp.add(PATH); c.imp.add("import shutil"); c.dry = true; return [`folder = Path(${S(p.folder)})`, `for item in list(folder.iterdir()):`, `    if item.is_file():`, `        kind = item.suffix.lower().lstrip(".") or "other"`, `        if DRY_RUN:`, `            print("Would move", item.name, "to", kind)`, `        else:`, `            (folder / kind).mkdir(exist_ok=True)`, `            shutil.move(str(item), str(folder / kind / item.name))`, `            print("Moved", item.name, "to", kind)`]; } },
  zipdir: { cat: "files", label: "Zip folder", fields: [F("folder", "Folder", "C:/Users/me/Documents/Work"), F("path", "Zip file", "work_backup.zip")],
    gen: (p, c) => { c.imp.add("import shutil"); return [`shutil.make_archive(${S(String(p.path).replace(/\.zip$/i, ""))}, "zip", ${S(p.folder)})`, `print("Created", ${S(p.path)})`]; } },

  read_text: { cat: "text", label: "Read text", fields: [F("path", "File", "notes.txt"), F("name", "Remember as", "text")],
    gen: (p, c) => { c.imp.add(PATH); return [`${N(p.name, "text")} = ${P(p.path)}.read_text(encoding="utf-8")`]; } },
  write_text: { cat: "text", label: "Write text", fields: [F("path", "File", "output.txt"), F("mode", "If the file exists", "replace it", { opts: ["replace it", "add to the end"] }), F("content", "Text to write", "{text}", { wide: 1 })],
    gen: (p, c) => { c.imp.add(PATH); return p.mode === "add to the end" ? [`with open(${P(p.path)}, "a", encoding="utf-8") as out:`, `    out.write(${STR(p.content)} + "\\n")`] : [`${P(p.path)}.write_text(${STR(p.content)}, encoding="utf-8")`]; } },
  replace_text: { cat: "text", label: "Find & replace", fields: [F("name", "In", "text"), F("a", "Find", "colour"), F("b", "Replace with", "color")],
    gen: p => [`${N(p.name, "text")} = str(${N(p.name, "text")}).replace(${STR(p.a)}, ${STR(p.b)})`] },
  change_case: { cat: "text", label: "Change case", fields: [F("name", "In", "text"), F("mode", "Make it", "UPPER CASE", { opts: ["UPPER CASE", "lower case", "Title Case"] })],
    gen: p => { const n = N(p.name, "text"), f = { "UPPER CASE": "upper", "lower case": "lower", "Title Case": "title" }[p.mode] || "upper"; return [`${n} = str(${n}).${f}()`]; } },
  trim_text: { cat: "text", label: "Trim spaces", fields: [F("name", "In", "text")],
    gen: p => { const n = N(p.name, "text"); return [`${n} = " ".join(str(${n}).split())`]; } },
  count_words: { cat: "text", label: "Count words", fields: [F("name", "In", "text")],
    gen: p => [`word_count = len(str(${N(p.name, "text")}).split())`, `print("Words:", word_count)`] },
  find_lines: { cat: "text", label: "Keep lines", fields: [F("name", "In", "text"), F("word", "Containing", "error")],
    gen: p => { const n = N(p.name, "text"); return [`${n} = "\\n".join(line for line in str(${n}).splitlines() if ${STR(p.word)}.lower() in line.lower())`]; } },

  load_table: { cat: "tables", label: "Open sheet", fields: [F("path", "File", "sales.xlsx")], hint: "The sheet is remembered as data. Sheet components below all work on it.",
    gen: (p, c) => { pd(c); const o = one(p.path); if (o) { c.pip.add("openpyxl"); return [`data = pd.read_excel(${o}) if str(${o}).lower().endswith((".xlsx", ".xls")) else pd.read_csv(${o})`]; } if (isXl(p.path)) c.pip.add("openpyxl"); return [`data = pd.${isXl(p.path) ? "read_excel" : "read_csv"}(${S(p.path)})`]; } },
  merge_tables: { cat: "tables", label: "Combine files", fields: [F("folder", "Folder", "C:/Users/me/Documents/Monthly"), F("kind", "File type", "csv", { opts: ["csv", "xlsx"] })], hint: "Stacks every file into one sheet. They should share the same columns.",
    gen: (p, c) => { pd(c); c.imp.add(PATH); const x = p.kind === "xlsx"; if (x) c.pip.add("openpyxl"); return [`files = sorted(Path(${S(p.folder)}).glob("*.${x ? "xlsx" : "csv"}"))`, `data = pd.concat([pd.${x ? "read_excel" : "read_csv"}(f) for f in files], ignore_index=True)`, `print("Combined", len(files), "files into", len(data), "rows")`]; } },
  filter_rows: { cat: "tables", label: "Filter rows", fields: [F("col", "Column", "Amount"), F("op", "Is", "greater than", { opts: ["equal to", "not equal to", "greater than", "less than", "containing"] }), F("val", "Value", "1000")],

function TESTGEN(spec, rows, seed) {
  let a = (parseInt(seed) || 42) >>> 0; const rnd = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  const g = {

  };

}

  if (mm) { const k = mm[1].split(".")[0]; hint = NOT_IN_BROWSER[k] ? `\nThe browser cannot do ${NOT_IN_BROWSER[k]}. Run this script on your computer instead (Copy or Save).` : `\nThe package "${k}" is not available in the browser. Run on your computer, or try another component.`; }
  else if (/FileNotFoundError|No such file/.test(last)) hint = "\nThe file or folder is not in the browser's file area. Use Upload or Sample files, then run again.";
  else if (/OSError|ConnectionError|NetworkError|urlopen|Failed to fetch/.test(last)) hint = "\nThe browser blocks most network and database connections. Run on your computer for those.";
  else if (/EOFError/.test(last)) hint = "\nThe script asked a question. Type the answers (one per line) in the Answers box, then run again.";
  return last + hint;
}

    p.globals.set("_jsbox", (n, t) => { const e = document.querySelector(`.app [data-box="${n}"]`); if (e) e.textContent += t; });
    p.globals.set("_jsclear", n => { const e = document.querySelector(`.app [data-box="${n}"]`); if (e) e.textContent = ""; });
    p.globals.set("_jspage", id => gotoPage(id)); p.globals.set("_jspop", (t, m) => { logAdd(t + ": " + m, "g"); toast(t + ": " + m); });
    document.querySelectorAll(".app [data-box]").forEach(e => { e.textContent = ""; });
    await preparePy(p, code); await p.runPythonAsync(pre + "\n" + code); logAdd("Done.", "g");
  } catch (e) { logAdd(friendly(e.message || e), "e"); }
  finally { runBusy = false; refreshFiles(); }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-btn]"); if (b) { clickButton(+b.dataset.btn); return; }
  const t = e.target.closest("[data-pg]"); if (t) { appPage = +t.dataset.pg; document.querySelectorAll(".app-pg").forEach((x, j) => x.classList.toggle("on", j === appPage)); document.querySelectorAll(".app-tabs button").forEach((x, j) => x.classList.toggle("on", j === appPage)); return; }
  const d = e.target.closest("[data-dlf]"); if (d) { const f = listFiles()[+d.dataset.dlf]; if (f) { const name = f[0].split("/").pop(); const data = py.FS.readFile(f[0]); saveAny(name, /\.(txt|csv|json|md|py)$/i.test(name) ? new TextDecoder().decode(data) : data); } }
});

/* ----- the Output pane ----- */
function renderOut() {
  const needsAns = /\binput\(|getpass\(/.test(lastCode || "");
  $("outp").innerHTML = `<div class="otools"><button class="ob" type="button" data-o="run">${ic("play", "R")}Run</button><button class="ob" type="button" data-o="up">${ic("upload", "U")}Upload files</button><button class="ob" type="button" data-o="sample">${ic("flask-conical", "S")}Sample files</button><button class="ob" type="button" data-o="clear">${ic("eraser", "C")}Clear</button><input id="oup" type="file" multiple hidden></div>`
    + (lastGen && lastGen.ui ? `<div class="olab">App preview</div><div id="oapp">${appHtml()}</div>` : "")
    + (needsAns ? `<div class="olab">Answers (one per line, for questions and passwords)</div><textarea class="oans" id="oans" placeholder="Type answers here before running"></textarea>` : "")
    + `<div class="olab">Output</div><pre class="olog" id="olog">${logHtml}</pre><div class="olab">Files in the browser</div><div class="ofiles" id="ofiles">${filesHtml()}</div>`;
  paintIcons();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-o]"); if (!b) return; const k = b.dataset.o;
  if (k === "run") { if (lastGen && lastGen.ui) { logHtml = ""; renderOut(); } else runScript(); }
  else if (k === "up") $("oup").click(); else if (k === "sample") makeSamples(); else if (k === "clear") { logHtml = ""; $("olog").innerHTML = ""; }
});
document.addEventListener("change", async e => {
  if (e.target.id !== "oup") return; const p = await needPy(); if (!p) return;
  for (const f of e.target.files) p.FS.writeFile(HOME + "/" + f.name, new Uint8Array(await f.arrayBuffer()));
  logAdd(e.target.files.length + " file(s) added to the browser file area.", "g"); refreshFiles(); e.target.value = "";
});
$("oans") && 0;

/* ----- test data dialog ----- */
const csvOf = (cols, rows) => [cols.join(","), ...rows.map(r => cols.map(c => { const v = String(r[c]); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; }).join(","))].join("\n");
function openTD() {
  openDlg("Test data generator", `<div class="tdf"><label for="tdc">Columns (type a list, or tap a type below)</label><textarea id="tdc" rows="2">id, name, email, city, amount, date</textarea></div>
  <div class="chips" id="tdchips">${Object.entries(TD_TYPES).map(([k, v]) => `<button type="button" data-ty="${esc(k)}" title="${esc(v)}">${esc(k)}</button>`).join("")}</div>
  <div class="tdrow"><div class="tdf"><label for="tdr">Rows</label><input id="tdr" type="number" min="1" max="5000" value="20"></div><div class="tdf"><label for="tds">Seed</label><input id="tds" type="number" value="42"></div></div>
  <div class="tdw" id="tdp"></div>
  <div class="chips"><button type="button" data-td="csv">${ic("download", "")} Download CSV</button><button type="button" data-td="json">Download JSON</button><button type="button" data-td="add">Add to my script</button></div>`);
  const upd = () => { const g = TESTGEN($("tdc").value, $("tdr").value, $("tds").value); $("tdp").innerHTML = g.cols.length ? `<table class="tdt"><tr>${g.cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr>${g.rows.slice(0, 8).map(r => `<tr>${g.cols.map(c => `<td>${esc(r[c])}</td>`).join("")}</tr>`).join("")}</table>` : `<p class="app-note" style="padding:8px">Pick at least one known type.</p>`; return g; };
  upd(); $("dlgB").oninput = upd;
  $("dlgB").onclick = e => {
    const ty = e.target.closest("[data-ty]"); if (ty) { const t = $("tdc"); t.value = (t.value.trim() ? t.value.trim().replace(/,$/, "") + ", " : "") + ty.dataset.ty; upd(); return; }
    const a = e.target.closest("[data-td]"); if (!a) return; const g = upd();
    if (a.dataset.td === "csv") saveAny("test_data.csv", csvOf(g.cols, g.rows), "text/csv");
    else if (a.dataset.td === "json") saveAny("test_data.json", JSON.stringify(g.rows, null, 1), "application/json");
    else { snap(); const s = mk(B("test_data", { cols: $("tdc").value, rows: $("tdr").value, seed: $("tds").value })); const si = steps.findIndex(x => x.id === sel); steps.splice(si >= 0 ? si + 1 : steps.length, 0, s); sel = s.id; renderSteps(s.id); closeDlg(); toast("Test data step added."); }
  };
}
Object.assign(ACTIONS, { run: runScript, td: openTD });
$("runb").querySelector("i") && paintIcons();
</script>
</body>
</html>
