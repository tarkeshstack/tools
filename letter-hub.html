<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letter Hub – Ready-made letters, edit in Word</title>
<style>
:root{--navy:#1b2559;--navy2:#141c44;--gold:#e0a93b;--bg:#f2f4fb;--card:#fff;--ink:#1f2433;--mut:#6b7280;--pri:#2338b7;--line:#e1e5f2;--hl:#fff3bf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:14px}
.logo{width:50px;height:50px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-size:26px;flex:none;background:#fff1}
header h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:27px;letter-spacing:.2px}
header p{margin:2px 0 0;opacity:.85;font-size:14px}
.layout{display:flex;min-height:calc(100vh - 80px)}
.rail{width:84px;flex:none;background:#fff;border-right:1px solid var(--line);padding:8px 4px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;align-self:flex-start;max-height:100vh;overflow:auto}
.rail button{border:0;background:none;border-radius:14px;padding:10px 2px;cursor:pointer;color:var(--ink);font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.rail button span{font-size:30px;line-height:1}
.rail button.on{background:var(--navy);color:#fff}
.rail button:hover:not(.on){background:#eef1fb}
main{flex:1;min-width:0;padding:18px 14px 30px}
h2.lead{font-size:21px;font-weight:500;margin:4px 2px 12px;line-height:1.35}
h2.lead b{color:var(--pri);text-decoration:underline}
.leadrow{display:flex;align-items:center;gap:6px}
.leadrow h2.lead{flex:1;min-width:0}
.searchwrap{display:none}
.searchwrap.open{display:flex;margin-bottom:10px}
#sbtn{width:32px;height:32px;border-radius:50%;border:0;background:transparent;font-size:17px;cursor:pointer;flex:none;opacity:.6;padding:0}
#sbtn:hover{opacity:1;background:#0001}
#search{display:none;flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:#fff}
.searchwrap.open #search{display:block}
#homeBtn{position:fixed;right:14px;bottom:78px;width:50px;height:50px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:24px;box-shadow:0 3px 12px #0005;cursor:pointer;z-index:30;display:none}
#homeBtn.show{display:block}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 14px 14px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:block;min-height:128px}
.card:hover{border-color:var(--pri);box-shadow:0 4px 14px #2338b722}
.card .ic{font-size:34px;line-height:1.1;display:block;margin-bottom:6px}
.card b{display:block;color:var(--pri);font-size:16.5px;line-height:1.25;margin-bottom:3px}
.card small{color:var(--mut);font-size:13.5px;line-height:1.3;display:block}
.empty{color:var(--mut);padding:20px 4px}
/* editor */
#editView{display:none}
.back{border:0;background:none;color:var(--pri);font-weight:700;font-size:15px;cursor:pointer;padding:4px 2px;margin-bottom:6px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.panel h3{margin:0 0 8px;font-size:15px;color:var(--navy)}
.panel h3 span{font-weight:400;color:var(--mut);font-size:12.5px}
#fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
#fields label{font-size:12px;color:var(--mut);display:block}
#fields input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin-top:2px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bar button,.bar select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;font-size:14px}
.bar .sep{width:1px;height:24px;background:var(--line);margin:0 3px}
.act{background:var(--navy)!important;color:#fff;border-color:var(--navy)!important;font-weight:700}
.act2{background:var(--gold)!important;border-color:var(--gold)!important;color:#241a00;font-weight:700}
.hint{font-size:12.5px;color:var(--mut);margin:8px 2px 0}
.wrap{overflow:hidden}
#paper{background:#fff;max-width:820px;width:100%;margin:0 auto;padding:36px 40px;box-shadow:0 2px 14px #0003;border-radius:6px;font-family:"Times New Roman",Georgia,serif;font-size:17px;line-height:1.6;outline:none;color:#000}
#paper.editing{outline:3px solid var(--gold)}
.fi{color:#0b2a8a;background:var(--hl);border-bottom:2px solid var(--gold);border-radius:4px 4px 0 0;padding:0 4px;outline:none;min-width:2ch;-webkit-user-select:text;user-select:text}
.fi:focus{background:#ffe680;border-bottom-color:var(--pri)}
.fi:empty::before{content:attr(data-ph);color:#8a6d00;opacity:.85}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:4px 10px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-4px 0 8px}
.titlerow h3{margin:0;font-size:16px;color:var(--navy);line-height:1.25}
.tbtns{display:flex;gap:6px;flex:none}
.editbtn{flex:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
#paper p{margin:0 0 .75em}
#paper .addr,#paper .addr p{margin:0}
@media (max-width:600px){
 #paper{padding:20px 16px;font-size:16px}
 .rail{width:72px}.rail button span{font-size:26px}.rail button{font-size:11.5px}
 h2.lead{font-size:3.2vw;white-space:nowrap;margin:4px 0 10px}
 header p{font-size:3.3vw;white-space:nowrap}
 header h1{font-size:6vw}
 .card{padding:10px 9px 12px;min-height:112px;border-radius:15px}.card .ic{font-size:28px}.card b{font-size:14px;overflow-wrap:anywhere}.card small{font-size:11.5px}}
.actionbar{position:sticky;bottom:0;display:flex;gap:6px;padding:8px 4px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 25%);margin-top:6px;z-index:5}
.actionbar button{flex:1;min-width:0;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;padding:6px 2px;font-size:11.5px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.actionbar button i{font-style:normal;font-size:18px;line-height:1.1}
.actionbar button:active{background:var(--navy);color:#fff}
#pvModal{position:fixed;inset:0;background:#0007;z-index:50;display:none;align-items:flex-end;justify-content:center}
#pvModal.open{display:flex}
.pvSheet{background:#fff;width:100%;max-width:760px;max-height:88vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.pvHead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--navy)}
.pvHead button{border:0;background:none;font-size:20px;cursor:pointer}
#pvBody{overflow:auto;padding:16px 18px;font-family:"Times New Roman",Georgia,serif;font-size:16px;line-height:1.55;background:#fffef9}
#pvBody p{margin:0 0 .7em}
.pf{background:var(--hl);border-bottom:2px solid var(--gold);padding:0 3px;border-radius:3px}
.pvFoot{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.pvFoot button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px;cursor:pointer}
.pvFoot .use{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
@media print{
 #pvModal{display:none!important}
 #homeBtn{display:none!important}
 .actionbar{display:none!important}
 @page{size:A4;margin:0}
 header,.rail,.panel,.back,#gridView{display:none!important}
 body,main{background:#fff;padding:0;margin:0}
 #editView{display:block!important}
 .wrap{overflow:visible;height:auto!important}
 #paper{box-shadow:none;margin:0;max-width:none;min-height:0;padding:20mm 22mm;font-size:12pt!important;line-height:1.5}
 .fi{background:none!important;border:0!important;padding:0!important}
 .fi:empty::before{color:#000}
}
</style>
</head>
<body>
<header>
  <div class="logo">✉️</div>
  <div><h1>Letter Hub</h1><p>Pick a letter, fill in, open in Word.</p></div>
</header>
<div class="layout">
  <nav class="rail" id="rail"></nav>
  <main>
    <section id="gridView">
      <div class="leadrow"><h2 class="lead">Select a pre-filled letter to use and customise.</h2><button id="sbtn" onpointerdown="event.preventDefault()" onclick="toggleSearch()" aria-label="Search">🔍</button></div>
      <div class="searchwrap" id="sw"><input id="search" placeholder="Search letters (leave, loan, rent…)" oninput="renderGrid()" onblur="if(!this.value)$('#sw').classList.remove('open')"></div>
      
      <div class="grid" id="grid"></div>
    </section>

    <section id="editView">
      <div class="toprow"><button class="back" onclick="showGrid()">← All letters</button><span class="seg" title="Letter format"><button data-f="email" onclick="setFmt('email')">✉️ Email</button><button data-f="letter" onclick="setFmt('letter')">📄 Letter</button></span></div>
      <div class="titlerow"><h3 id="letterTitle"></h3><span class="tbtns"><button class="editbtn" onclick="showPreview()">👁 Preview</button><button class="editbtn" onclick="toggleEdit(this)">✏️ Edit all text</button></span></div>
      <div class="wrap" id="wrap"><div id="paper" spellcheck="true"></div></div>
      <div class="actionbar"><button onclick="copyText()"><i>📋</i>Copy</button><button onclick="shareLetter()"><i>📤</i>Share</button><button onclick="sendWA()"><i>💬</i>WhatsApp</button><button onclick="sendMail()"><i>✉️</i>Email</button><button onclick="sendTeams()"><i>👥</i>Teams</button></div>
    </section>
  </main>
<div id="pvModal" onclick="if(event.target===this)closePreview()"><div class="pvSheet"><div class="pvHead"><b id="pvTitle"></b><button onclick="closePreview()" aria-label="Close">✕</button></div><div id="pvBody"></div><div class="pvFoot"><button onclick="closePreview()">← Keep editing</button><button onclick="closePreview();window.print()">🖨 PDF</button><button class="use" onclick="closePreview();downloadDocx()">📄 Word</button></div></div></div>
<button id="homeBtn" onclick="goHome()" aria-label="Home">🏠</button>
</div>

<script>
const $=s=>document.querySelector(s);
const paper=$('#paper');
const today=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
let values={};
try{values=JSON.parse(localStorage.getItem('lh_vals')||'{}')}catch(e){}
values['Date']=today;

/* ---------- letter builders ---------- */
const S=`<div class="addr"><p>{{Your Name}}<br>{{Your Address}}<br>{{Your Phone}} | {{Your Email}}</p></div><p>Date: {{Date}}</p>`;
const SS=`${S}`;
function L(to,subject,paras,close='Yours sincerely'){
  const body=paras.map(p=>p.startsWith('<')?p:`<p>${p}</p>`).join('');
  const ec=/^Yours /.test(close)?'Regards':close;
  const em=`⟦E⟧<p>To: {{Recipient Email}}</p><p><b>Subject: ${subject}</b></p><p>Dear {{Recipient Name}},</p>${body}<p>${ec},<br>{{Your Name}}<br>{{Your Phone}}</p>⟦/E⟧`;
  const lt=`⟦L⟧<p>${to.startsWith('To ')?to:'To,<br>'+to+'<br>Email: {{Recipient Email}}'}</p><p><b>Subject: ${subject}</b></p><p>Dear {{Recipient Name}},</p>${body}<p>${close},<br><br>{{Your Name}}<br>{{Your Address}}<br>{{Your Phone}} | {{Your Email}}<br>Date: {{Date}}</p>⟦/L⟧`;
  return em+lt;
}
const BOSS=`{{Manager Name}}<br>{{Designation}}<br>{{Company Name}}<br>{{Company Address}}`;
const BANK=`The Manager<br>{{Bank Name}}<br>{{Branch Name & Address}}`;
const LORD=`{{Landlord Name}}<br>{{Property Address}}`;
const SCH=`The Principal<br>{{School Name}}<br>{{School Address}}`;
const GEN=`{{Recipient Name}}<br>{{Recipient Organisation}}<br>{{Recipient Address}}`;
const CO=`The Customer Care Manager<br>{{Company Name}}<br>{{Company Address}}`;

const T=[
/* WORK */
{c:'Work',t:'Leave Request (Office)',b:L(BOSS,'Application for leave from {{From Date}} to {{To Date}}',[
 'I am writing to request leave from <b>{{From Date}}</b> to <b>{{To Date}}</b> ({{Number of Days}} days) due to {{Reason}}.',
 'I will complete my pending tasks before leaving and have briefed {{Colleague Name}} to handle urgent matters in my absence. I will also be reachable by phone for any emergency.',
 'I kindly request you to approve my leave. Thank you for your understanding.'])},
{c:'Work',t:'Sick Leave Application',b:L(BOSS,'Sick leave application',[
 'I am unwell and have been advised rest by my doctor. I am therefore unable to attend work from <b>{{From Date}}</b> to <b>{{To Date}}</b>.',
 'I have attached the medical certificate for your reference. I will resume duties on {{Return Date}} and will catch up on any pending work.',
 'Kindly grant me sick leave for the above period.'])},
{c:'Work',t:'Resignation Letter',b:L(BOSS,'Resignation from the post of {{Your Designation}}',[
 'Please accept this letter as formal notice of my resignation from the position of <b>{{Your Designation}}</b> at {{Company Name}}. My last working day will be <b>{{Last Working Day}}</b>, in line with my notice period.',
 'I am grateful for the opportunities and support I received during my time here. I will ensure a smooth handover of my responsibilities and assist in training my replacement.',
 'Kindly accept my resignation and process my final settlement and relieving documents.'])},
{c:'Work',t:'Notice Period Waiver Request',b:L(BOSS,'Request for early release from notice period',[
 'Further to my resignation dated {{Resignation Date}}, I request you to kindly relieve me on <b>{{Requested Last Day}}</b> instead of completing the full notice period, due to {{Reason}}.',
 'I will complete all handover activities and remain available for knowledge transfer. I am also willing to forgo the notice-pay shortfall if required.',
 'I would be grateful for your consideration.'])},
{c:'Work',t:'Salary Increment Request',b:L(BOSS,'Request for salary review',[
 'I have been working with {{Company Name}} as {{Your Designation}} for {{Years}} years. During this time I have taken on added responsibilities, including {{Key Achievements}}.',
 'Considering my contribution and current market standards, I request you to kindly review my compensation. I would appreciate an opportunity to discuss this at your convenience.',
 'Thank you for your time and consideration.'])},
{c:'Work',t:'Promotion Request',b:L(BOSS,'Request for promotion',[
 'I am writing to express my interest in being considered for the position of <b>{{Desired Position}}</b>. Over the past {{Years}} years I have consistently met targets and led {{Key Achievements}}.',
 'I believe I am ready for greater responsibility and would welcome the chance to discuss my career growth with you.',
 'Thank you for considering my request.'])},
{c:'Work',t:'Work From Home Request',b:L(BOSS,'Request to work from home',[
 'I request permission to work from home from <b>{{From Date}}</b> to <b>{{To Date}}</b> because {{Reason}}.',
 'I will remain available on phone, email and chat during working hours, attend all meetings online and ensure my deliverables are met on time.',
 'Kindly approve my request.'])},
{c:'Work',t:'Experience / Relieving Letter Request',b:L('The HR Manager<br>{{Company Name}}<br>{{Company Address}}','Request for experience and relieving letter',[
 'I worked at {{Company Name}} as <b>{{Your Designation}}</b> from {{Joining Date}} to {{Last Working Day}} (Employee ID: {{Employee ID}}).',
 'I kindly request you to issue my experience certificate and relieving letter at the earliest as I need them for my new employment.',
 'Thank you for your cooperation.'])},
{c:'Work',t:'Reference / Recommendation Request',b:L('{{Recipient Name}}<br>{{Recipient Organisation}}','Request for a letter of recommendation',[
 'I hope you are well. I am applying for {{Position / Course}} at {{Organisation Applied To}} and would be honoured if you could write a recommendation letter for me.',
 'Having worked/studied under your guidance for {{Duration}}, I believe you can speak about my skills and work ethic. I can share my CV and key points to help you. The deadline is {{Deadline}}.',
 'Thank you very much for your time and support.'])},
{c:'Work',t:'Job Application Cover Letter',b:L('{{Hiring Manager}}<br>{{Company Name}}<br>{{Company Address}}','Application for the post of {{Job Title}}',[
 'I am writing to apply for the position of <b>{{Job Title}}</b> advertised on {{Where You Saw The Ad}}. With {{Years}} years of experience in {{Your Field}}, I am confident I can contribute to your team.',
 'In my previous role at {{Previous Company}}, I {{Key Achievement}}. I am skilled in {{Key Skills}} and eager to bring this experience to {{Company Name}}.',
 'I have enclosed my resume and would welcome an interview. Thank you for your time.'],'Yours faithfully')},
{c:'Work',t:'Job Offer Acceptance',b:L(BOSS,'Acceptance of job offer',[
 'Thank you for offering me the position of <b>{{Job Title}}</b> at {{Company Name}}. I am pleased to accept the offer on the terms mentioned in your letter dated {{Offer Date}}.',
 'I will join on <b>{{Joining Date}}</b>. Please let me know if any documents are required before then.',
 'I look forward to contributing to the team.'])},
{c:'Work',t:'Job Offer Decline',b:L(BOSS,'Declining the job offer',[
 'Thank you for offering me the position of {{Job Title}} at {{Company Name}}. After careful thought, I have decided to decline the offer as {{Reason}}.',
 'I truly appreciate the time you and your team spent with me and hope our paths cross again.'])},
{c:'Work',t:'Transfer Request',b:L(BOSS,'Request for transfer to {{New Location}}',[
 'I request to be transferred from {{Current Location}} to <b>{{New Location}}</b> because {{Reason}}.',
 'I am willing to relocate at the earliest and will ensure a smooth handover. I would be grateful for your kind consideration.'])},
{c:'Work',t:'Warning / Explanation Reply',b:L(BOSS,'Reply to your notice dated {{Notice Date}}',[
 'This is in response to your notice regarding {{Issue}}. I wish to state that {{Your Explanation}}.',
 'I sincerely regret any inconvenience caused and assure you that I will take steps to avoid a recurrence. I request you to kindly consider my explanation.'])},
{c:'Work',t:'Late Arrival / Permission Request',b:L(BOSS,'Permission to come late / leave early on {{Date of Request}}',[
 'I request permission to {{come late / leave early}} on <b>{{Date of Request}}</b> at around {{Time}} due to {{Reason}}.',
 'I will make up the time and complete all tasks for the day. Thank you.'])},
{c:'Work',t:'Maternity / Paternity Leave',b:L(BOSS,'Application for maternity / paternity leave',[
 'I wish to inform you that my expected date of delivery / childbirth is <b>{{Expected Date}}</b>. I request leave from <b>{{From Date}}</b> to <b>{{To Date}}</b> as per company policy.',
 'I will hand over my work to {{Colleague Name}} before leaving. Please let me know if any medical documents are needed.'])},

/* MONEY */
{c:'Money & Bank',t:'Loan Request (Bank)',b:L(BANK,'Application for a {{Loan Type}} loan of {{Loan Amount}}',[
 'I am writing to apply for a <b>{{Loan Type}} loan of {{Loan Amount}}</b> for {{Purpose}}, repayable over {{Tenure}} years.',
 'I am employed as {{Your Designation}} at {{Company Name}} with a monthly income of {{Monthly Income}}. I maintain account no. {{Account Number}} with your branch. I have enclosed my ID, address proof, income proof and bank statements.',
 'I request you to kindly process my application and let me know of any further requirements.'],'Yours faithfully')},
{c:'Money & Bank',t:'Loan Request (Employer / Salary Advance)',b:L(BOSS,'Request for salary advance / loan of {{Loan Amount}}',[
 'I request an advance / loan of <b>{{Loan Amount}}</b> due to {{Reason}}. I propose to repay it in {{Number of Instalments}} monthly instalments deducted from my salary starting {{Start Month}}.',
 'I have been with the company for {{Years}} years and have no outstanding dues. I would be grateful for your kind consideration.'])},
{c:'Money & Bank',t:'Personal Loan Request (Friend / Family)',b:L('{{Recipient Name}}','Request for a loan of {{Loan Amount}}',[
 'I hope you are doing well. I am facing a financial difficulty due to {{Reason}} and would be very grateful if you could lend me <b>{{Loan Amount}}</b>.',
 'I promise to repay the full amount by <b>{{Repayment Date}}</b>{{Repayment Details}}. I truly value our relationship and would not ask if it were not important.',
 'Thank you for considering this.'])},
{c:'Money & Bank',t:'Loan Repayment Extension',b:L(BANK,'Request for extension / restructuring of loan account {{Loan Account Number}}',[
 'I have a {{Loan Type}} loan with your bank (A/c {{Loan Account Number}}). Due to {{Reason}}, I am unable to pay the instalment due on {{Due Date}}.',
 'I request you to kindly grant an extension of {{Extension Period}} / restructure the repayment schedule. I assure you of regular payments thereafter.'],'Yours faithfully')},
{c:'Money & Bank',t:'Close Bank Account',b:L(BANK,'Request to close account no. {{Account Number}}',[
 'I request you to close my {{Account Type}} account no. <b>{{Account Number}}</b> held at your branch, with effect from {{Closure Date}}.',
 'Please transfer the remaining balance to my account no. {{Transfer Account}} at {{Transfer Bank}} and issue a closure confirmation. I am returning my cheque book and debit card.'],'Yours faithfully')},
{c:'Money & Bank',t:'Lost ATM / Debit Card – Block & Reissue',b:L(BANK,'Lost debit card – request to block and reissue',[
 'I have lost my debit/ATM card linked to account no. <b>{{Account Number}}</b> on {{Date Lost}}. Please block the card immediately to prevent misuse.',
 'Kindly issue a replacement card to my registered address. I have also filed a complaint with {{Police Station / Reference}}.'],'Yours faithfully')},
{c:'Money & Bank',t:'Bank Statement / Certificate Request',b:L(BANK,'Request for statement of account',[
 'I request a statement of my account no. <b>{{Account Number}}</b> for the period <b>{{From Date}}</b> to <b>{{To Date}}</b>, required for {{Purpose}}.',
 'Please issue it duly stamped and signed. Thank you.'],'Yours faithfully')},
{c:'Money & Bank',t:'Change Address / Mobile in Bank',b:L(BANK,'Request to update contact details in account {{Account Number}}',[
 'Please update my records for account no. <b>{{Account Number}}</b> as follows: new address – {{New Address}}; mobile – {{New Mobile}}; email – {{New Email}}.',
 'I have enclosed self-attested proof of the new details.'],'Yours faithfully')},
{c:'Money & Bank',t:'Payment Reminder (Overdue)',b:L(GEN,'Reminder: payment of {{Amount}} overdue',[
 'This is a friendly reminder that invoice/amount <b>{{Amount}}</b> (Ref: {{Invoice Number}}) dated {{Invoice Date}} was due on {{Due Date}} and remains unpaid.',
 'Kindly arrange payment within {{Days}} days. If already paid, please ignore this and share the payment details so we can reconcile.'])},
{c:'Money & Bank',t:'Refund Request',b:L(CO,'Request for refund of {{Amount}} – Order/Ref {{Order Number}}',[
 'I purchased {{Product / Service}} on {{Purchase Date}} for {{Amount}} (Order {{Order Number}}). Unfortunately {{Reason For Refund}}.',
 'I request a full refund to my original payment method within {{Days}} days. Copies of the receipt are attached.'],'Yours faithfully')},
{c:'Money & Bank',t:'Insurance Claim',b:L('The Claims Department<br>{{Insurance Company}}<br>{{Company Address}}','Claim under policy no. {{Policy Number}}',[
 'I am the policy holder of policy no. <b>{{Policy Number}}</b>. On {{Incident Date}}, {{Incident Description}}.',
 'I request you to process my claim of {{Claim Amount}}. I have enclosed the required documents (claim form, bills, report). Please advise if anything else is needed.'],'Yours faithfully')},

/* BUSINESS */
{c:'Business',t:'Promotional / Sales Letter',b:L('{{Recipient Name}}<br>{{Recipient Address}}','Special offer from {{Company Name}}',[
 'We are delighted to introduce <b>{{Product / Service}}</b> – designed to help you {{Key Benefit}}.',
 'Highlights: {{Feature 1}}, {{Feature 2}} and {{Feature 3}}. For a limited time, enjoy <b>{{Offer}}</b> – valid until {{Offer End Date}}.',
 'To get started, contact us on {{Your Phone}} or visit {{Website}}. We look forward to serving you.'],'Warm regards')},
{c:'Business',t:'Business Introduction Letter',b:L('{{Recipient Name}}<br>{{Recipient Organisation}}','Introducing {{Company Name}}',[
 'I am writing to introduce <b>{{Company Name}}</b>, a {{Business Type}} company providing {{Products / Services}} since {{Year}}.',

function letterText(){return collectParas(cleanClone()).map(p=>p.runs.map(r=>r.br?'\n':r.t).join('')).join('\n\n')}
function letterSubject(){const m=letterText().match(/^Subject:\s*(.+)$/m);return m?m[1].trim():T[current].t}

async function shareLetter(){
  const text=letterText();
  try{
    const f=new File([buildDocx()],fileName(),{type:MIME});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:letterSubject(),text});return}
    if(navigator.share){await navigator.share({title:letterSubject(),text});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  copyText();
}

function sendTeams(){
  const t=letterText();
  try{navigator.clipboard&&navigator.clipboard.writeText(t)}catch(e){}
  window.open('https://teams.microsoft.com/share?msgText='+encodeURIComponent(t)+'&href='+encodeURIComponent('https://teams.microsoft.com'),'_blank');

function copyText(){
  const t=collectParas(cleanClone()).map(p=>p.runs.map(r=>r.br?'\n':r.t).join('')).join('\n\n');
  const done=()=>alert('Letter copied!');
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(done).catch(()=>{
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();done();
  });
}

/* ---------- real .docx writer (no libraries) ---------- */
const MIME='application/vnd.openxmlformats-officedocument.wordprocessingml.document';
const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zip(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  files.forEach(([name,str])=>{
    const nb=enc.encode(name),d=enc.encode(str),crc=crc32(d);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,d.length,true);lh.setUint32(22,d.length,true);lh.setUint16(26,nb.length,true);
    parts.push(new Uint8Array(lh.buffer),nb,d);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,d.length,true);ch.setUint32(24,d.length,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nb);
    off+=30+nb.length+d.length;
  });
  const csize=central.reduce((a,b)=>a+b.length,0);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:MIME});
}
const xe=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const BLOCK=new Set(['P','DIV','LI','UL','OL','H1','H2','H3']);
function collectParas(root){
  const out=[];let cur=null;
  const flush=()=>{if(cur&&cur.runs.length)out.push(cur);cur=null};
  const ensure=al=>{if(!cur)cur={runs:[],align:al};return cur};
  function walk(n,st,al){
    n.childNodes.forEach(ch=>{
      if(ch.nodeType===3){ if(ch.nodeValue)ensure(al).runs.push({t:ch.nodeValue,...st}) }
      else if(ch.nodeType===1){
        const tag=ch.tagName;
        if(tag==='BR'){ensure(al).runs.push({br:1})}
        else if(BLOCK.has(tag)){
          flush();
          const a=ch.style.textAlign||al;
          if(tag==='LI'){
            const par=ch.parentElement,idx=[...par.children].indexOf(ch)+1;
            ensure(a).runs.push({t:par.tagName==='OL'?idx+'. ':'• ',...st});
          }
          walk(ch,tag.startsWith('H')?{...st,b:1}:st,a);
          flush();
        }else{
          const ns={...st};
          if(tag==='B'||tag==='STRONG')ns.b=1;
          if(tag==='I'||tag==='EM')ns.i=1;
          if(tag==='U')ns.u=1;
          const fw=ch.style.fontWeight;if(fw==='bold'||+fw>=600)ns.b=1;
          if(ch.style.fontStyle==='italic')ns.i=1;
          if((ch.style.textDecoration||'').includes('underline'))ns.u=1;
          walk(ch,ns,al);
        }
      }
    });
  }
  walk(root,{},'left');flush();
  return out;
}
function buildDocx(){
  const c=cleanClone();
  const fam=xe((paper.style.fontFamily||'Times New Roman').split(',')[0].replace(/["']/g,'').trim());
  const sz=24;
  const AL={center:'center',right:'right',justify:'both',left:'left',start:'left'};
  const body=collectParas(c).map(p=>{
    const runs=p.runs.map(r=>{
      if(r.br)return '<w:r><w:br/></w:r>';
      const rp=`<w:rFonts w:ascii="${fam}" w:hAnsi="${fam}" w:cs="${fam}"/>${r.b?'<w:b/>':''}${r.i?'<w:i/>':''}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/>${r.u?'<w:u w:val="single"/>':''}`;
      return `<w:r><w:rPr>${rp}</w:rPr><w:t xml:space="preserve">${xe(r.t)}</w:t></w:r>`;
    }).join('');
    return `<w:p><w:pPr><w:spacing w:after="200" w:line="360" w:lineRule="auto"/><w:jc w:val="${AL[p.align]||'left'}"/></w:pPr>${runs}</w:p>`;
  }).join('');
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1247" w:right="1247" w:bottom="1247" w:left="1247" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const types=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  return zip([['[Content_Types].xml',types],['_rels/.rels',rels],['word/document.xml',doc]]);
}
function downloadDocx(){
  const blob=buildDocx();
  const name=T[current].t.replace(/[^\w]+/g,'_').replace(/^_|_$/g,'')+'.docx';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
