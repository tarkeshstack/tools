            box-shadow: 0 20px 40px rgba(0,0,0,0.2);

            <!-- Apps will be inserted here by JavaScript -->

        let currentCategory = 'all';

        function createAppCard(app) {
            let downloadLink = app.ios;
            
            if (deviceType === 'android' && app.android) {
                downloadLink = app.android;
            }
            
            return `
                <a href="${downloadLink}" target="_blank" rel="noopener" class="app-card bg-white rounded-2xl p-3 shadow-lg block" data-categories="${app.categories.join(',')}">
                    <div class="flex flex-col items-center text-center h-full">
                        <div class="text-4xl mb-2 app-icon bg-gradient-to-br from-purple-100 to-pink-100 w-14 h-14 flex items-center justify-center">
                            ${app.icon}
                        </div>
                        <h3 class="font-bold text-gray-800 mb-1 text-sm leading-tight">${app.name}</h3>
                        <p class="text-xs text-gray-600 mb-2 line-clamp-2">${app.description}</p>
                    </div>
                </a>
            `;
        }

        function renderApps(filteredApps) {
            const grid = document.getElementById('appsGrid');
            const noResults = document.getElementById('noResults');
            
            if (filteredApps.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                grid.innerHTML = filteredApps.map(createAppCard).join('');
            }
        }

        function filterApps() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = apps.filter(app => {
                const matchesSearch = app.name.toLowerCase().includes(searchTerm) || 
                                    app.description.toLowerCase().includes(searchTerm);
                const matchesCategory = currentCategory === 'all' || app.categories.includes(currentCategory);
                return matchesSearch && matchesCategory;
            });
            
            renderApps(filtered);
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', filterApps);

        // Category filter
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                currentCategory = this.dataset.category;
                
                // Update button styles
                document.querySelectorAll('.category-btn').forEach(b => {
                    b.classList.remove('bg-white/90');
                    b.classList.add('bg-white/70');
                });
                this.classList.remove('bg-white/70');
                this.classList.add('bg-white/90');
                
                filterApps();
            });
        });

        // Initial render
        renderApps(apps);
