 ["“क्या मुझे नई तारीख़ मिल सकती है? मैं शुक्रवार तक पूरा कर दूँगा/दूँगी।”",[["नहीं। मुझे आज ही चाहिए।","बिना वजह की अकड़; ग़लतियाँ हो सकती हैं।"],["ठीक है, शुक्रवार। बुधवार को मुझे एक छोटा अपडेट भेज देना ताकि हम ट्रैक पर रहें।","वाजिब तारीख़ और चेक-इन।"],["ठीक है, जो भी।","अस्पष्ट और थोड़ा ठंडा।"]],["“ठीक है…” (जल्दबाज़ी में ख़राब रिपोर्ट बनाता है)","“शुक्रिया…”","“शुक्रिया। मैं बुधवार को अपडेट भेज दूँगा/दूँगी।”"]]]],
maid:["आपकी घरेलू सहायिका लगातार तीन दिन देर से आई है।",[
 ["“माफ़ कीजिए, मुझे देर हो गई।”",[["तुम हमेशा लेट होती हो! मैं किसी और को रख लूँगा/लूँगी!","सुने बिना धमकी।"],["सब ठीक है ना? मैंने कुछ दिन से नोट किया है। चलो देखते हैं तुम्हारे लिए कौन-सा समय ठीक है।","पहले चिंता, फिर हल।"],["ठीक है, बस देर मत करना।","साफ़ है, पर वजह की बात नहीं करता।"]],["(चुप, घबराई हुई) “माफ़ कीजिए…”","“जी, कोशिश करूँगी।”","“मेरा बच्चा बीमार है। क्या मैं कुछ दिन 9 बजे आ सकती हूँ?”"]],
 ["“क्या मैं अगले हफ़्ते दो दिन की छुट्टी ले सकती हूँ?”",[["फिर से?! तुम बहुत छुट्टियाँ लेती हो।","टालने वाला; निष्पक्षता मायने रखती है।"],["बिल्कुल। पहले बताने के लिए शुक्रिया। मुझे ठीक-ठीक दिन बता दो, मैं इंतज़ाम कर लूँगा/लूँगी।","अनुरोध का सम्मान करता है और पहले से योजना बनाता है।"],["मैं सोचकर बताता/बताती हूँ।","उन्हें बिना जवाब के घबराहट में छोड़ देता है।"]],["“माफ़ कीजिए…” (अगली छुट्टी छुपाएगी)","“ठीक है…”","“शुक्रिया! मैं सोमवार को बता दूँगी।”"]]]],
driver:["आपकी फ़्लाइट छूटने वाली है और कैब वाला लंबा रास्ता ले रहा है।",[
 ["“आज ट्रैफ़िक बहुत ज़्यादा है।”",[["क्या आप मुझे ठग रहे हैं?! तेज़ चलाओ!","इल्ज़ाम बात बढ़ाता है और सुरक्षा पर असर डालता है।"],["मैं समझता/समझती हूँ। मेरी 6 बजे की फ़्लाइट है। क्या कोई तेज़ रास्ता आप सुझाएँगे?","ज़रूरत बताता है और उनके अनुभव से पूछता है।"],["बस जल्दी करो।","जल्दी साफ़ है, पर साथ मिलकर नहीं।"]],["“मैं पूरी कोशिश कर रहा हूँ!”","“ठीक है।”","“एक फ़्लाईओवर है। उससे चलते हैं; 10 मिनट बच जाएँगे।”"]],
 ["“फ़्लाईओवर के टोल की वजह से ये एक्स्ट्रा लगेगा।”",[["ये स्कैम है!","बिना जाँचे इल्ज़ाम।"],["क्या आप टोल की रसीद दिखा सकते हैं? अगर यही रक़म है तो मैं दे दूँगा/दूँगी।","शांति से वेरिफ़ाई करता है।"],["ठीक है, ले लो।","जल्दी, पर आपने वेरिफ़ाई नहीं किया।"]],["“मैं ईमानदार ड्राइवर हूँ!”","“शुक्रिया।”","“ये रही रसीद। समझने के लिए शुक्रिया।”"]]]],
delivery:["आपका खाने का ऑर्डर 30 मिनट लेट है और डिलीवरी वाला आता है।",[
 ["“माफ़ कीजिए, ट्रैफ़िक और बारिश बहुत थी।”",[["आप बहुत लेट हैं! मैं एक स्टार दूँगा/दूँगी!","उन्हें उनके बस से बाहर की बात की सज़ा देता है।"],["इस मौसम में लाने के लिए शुक्रिया। उम्मीद है आप सुरक्षित रहेंगे।","दयालु और कद्र करने वाला।"],["ठीक है, बैग दो।","तटस्थ, पर छोटा-सा शुक्रिया मायने रखता है।"]],["(नीचे देखते हैं) “माफ़ कीजिए…”","“शुक्रिया।”","(मुस्कुराते हैं) “शुक्रिया! खाना एन्जॉय कीजिए।”"]],
 ["“पैकेट थोड़ा दबा हुआ लग रहा है। ये मेरी तरफ़ से नहीं हुआ।”",[["ये आपकी ग़लती है! वापस ले जाओ!","ग़लत इंसान को दोष देता है।"],["मैं समझता/समझती हूँ, बताने के लिए शुक्रिया। मैं ऐप से रिपोर्ट कर दूँगा/दूँगी। आपकी मेहनत की कद्र है।","निष्पक्ष, ईमानदार, रचनात्मक।"],["उफ़, ठीक है।","ठीक है, पर अगला कदम नहीं देता।"]],["“प्लीज़ मेरी शिकायत मत कीजिए…”","“ठीक है…”","“समझने के लिए शुक्रिया।”"]]]],
shopkeeper:["आप एक मार्केट स्टॉल पर अपने बजट में एक अच्छा बैग ख़रीदना चाहते हैं।",[
 ["“ये बैग? बेस्ट क्वालिटी। सिर्फ़ 800!”",[["ये तो कबाड़ है! ज़्यादा से ज़्यादा 200 का होगा!","बेइज़्ज़ती से डील बिगड़ती है।"],["अच्छा लग रहा है। मेरा बजट 500 के आसपास है। क्या आप बेहतर भाव दे सकते हैं?","दोस्ताना, ईमानदार और ख़ास।"],["बहुत महँगा है। चलता हूँ।","सीधा, पर बातचीत ख़त्म कर देता है।"]],["“तो कहीं और जाइए!”","“ठीक है, 700 आख़िरी।”","“600 में ले जाइए, आप इज़्ज़त से बात करते हैं। मैं एक स्ट्रैप फ़्री दे दूँगा।”"]],
 ["“लेना है? आख़िरी भाव 600।”",[["तुम ठग हो! 400 करो!","मोल-भाव को बेइज़्ज़ती में बदलता है।"],["शुक्रिया, ये ठीक है। क्या आप 550 कर सकते हैं? मैं अभी ले लूँगा/लूँगी।","इज़्ज़त भरा जवाबी ऑफ़र और साफ़ इरादा।"],["ठीक है, दे दो।","ठीक है; बिना जवाबी ऑफ़र के आप ज़्यादा दे सकते हैं।"]],["“बकवास, छोड़ो!”","“ठीक है, ये लो।”","“डील! 550। शुक्रिया, फिर आइएगा।”"]]]],
tradesperson:["आपके किचन का नल टपक रहा है और प्लंबर आता है।",[
 ["“क्या प्रॉब्लम है?”",[["जल्दी से ठीक कर दो, सब तरफ़ पानी बह रहा है।","अस्पष्ट; पहचानना या दाम बताना मुश्किल।"],["चालू करने पर नल टपकता है। क्या आप चेक करके शुरू करने से पहले ख़र्च बता सकते हैं?","साफ़ लक्षण और पहले से तय दाम।"],["आप ही बताइए। आप प्लंबर हैं।","सारा काम उन पर डाल देता है।"]],["“ठीक है… देखता हूँ।” (बाद में ज़्यादा लेगा)","“देखता हूँ।”","“वॉशर घिस गया है। पार्ट और काम के लगभग 300।”"]],
 ["“हो गया। 600 हुए।”",[["आपने 300 कहा था! ठग!","जाँचे बिना इल्ज़ाम।"],["एस्टिमेट 300 का था। क्या आप बता सकते हैं क्या बदला?","शांत और तथ्यात्मक।"],["ठीक है, ले लो।","टकराव से बचता है पर फ़र्क को जाने देता है।"]],["“आपको मुझ पर शक है?”","“ठीक है।”","“मैंने एक और पार्ट बदला। पहले बताना चाहिए था, सॉरी। मैं 400 कर देता हूँ।”"]]]],
guard:["आप कार्ड भूल गए हैं और गार्ड आपको गेट पर रोककर आई-डी माँगता है।",[
 ["“सर/मैम, मुझे आपका आई-डी देखना होगा।”",[["क्या आप मुझे जानते नहीं? मैं यहीं रहता/रहती हूँ!","उन्हें उनका काम करने पर चुनौती देता है।"],["बिल्कुल, सावधान रहने के लिए शुक्रिया। मैं कार्ड भूल गया/गई हूँ। क्या आप कन्फ़र्म करने के लिए फ़्लैट 5 में कॉल कर सकते हैं?","सहयोगी और हल की तरफ़।"],["उफ़, रुको।","बेसब्र, कोई हल नहीं।"]],["“नियम तो नियम हैं।”","“कृपया इंतज़ार कीजिए।”","“समझने के लिए शुक्रिया। मैं कॉल करता हूँ, कृपया रुकिए।”"]],
 ["“कृपया अपने मेहमान के लिए विज़िटर रजिस्टर में साइन कीजिए।”",[["इतने नियम क्यों?","ग़लत इंसान से शिकायत।"],["ज़रूर। हमारी सुरक्षा का ध्यान रखने के लिए शुक्रिया। मेरे मेहमान को गेट पर कुछ चाहिए हो तो बताइएगा।","कद्र भरा और सहयोगी।"],["ठीक है।","ठीक है; शुक्रिया कहना मदद करता।"]],["“ये सोसाइटी का नियम है।”","“शुक्रिया।”","“हमेशा मदद के लिए तैयार। शुभ संध्या।”"]]]],
waiter:["एक रेस्टोरेंट में आपका सूप ठंडा आता है।",[
 ["“ये रहा आपका सूप। एन्जॉय कीजिए!”",[["ये ठंडा है! ले जाओ!","रूखा और सबके सामने।"],["शुक्रिया। सूप थोड़ा ठंडा है। क्या आप इसे गरम कर सकते हैं या नया ला सकते हैं?","शिष्ट, ख़ास, हल की तरफ़।"],["(कुछ न कहकर खा लेना)","टकराव से बचता है, पर आप नाख़ुश रहते हैं।"]],["“माफ़ कीजिए…” (घबरा जाता है)","(आपको वो नहीं मिलता जो चाहिए था)","“बिल्कुल, सॉरी! मैं अभी लाता हूँ।”"]],
 ["(बाद में) “सब कैसा रहा?”",[["सर्विस बहुत ख़राब थी!","अस्पष्ट और कठोर।"],["शुक्रिया। खाना अच्छा था। सूप पहले ठंडा था, पर आपने जल्दी ठीक कर दिया। हमें अच्छा लगा।","संतुलित, ख़ास और दयालु।"],["ठीक था।","सुरक्षित, पर काम का फ़ीडबैक नहीं।"]],["“ओह… सॉरी।”","“शुक्रिया।”","“शुक्रिया! मैं किचन को बता दूँगा।”"]]]],
official:["आपको एक सरकारी दफ़्तर में दस्तावेज़ पर मुहर लगवानी है और क्लर्क चिढ़ा हुआ लगता है।",[
 ["“ये कौन-सा फ़ॉर्म है? आपने ठीक से नहीं भरा।”",[["आपका सिस्टम बेकार है! मेरी अभी मदद कीजिए!","दोष और माँग बचाव बढ़ाते हैं।"],["माफ़ कीजिए। क्या आप दिखा सकते हैं कौन-से फ़ील्ड अधूरे हैं? मैं अभी ठीक कर देता/देती हूँ।","विनम्र, ख़ास, तेज़।"],["मैं फिर आऊँगा/आऊँगी।","आपका और उनका समय बर्बाद।"]],["“तो लाइन में लगिए!”","“कल आइए।”","“ये रहे, सेक्शन B और C। ठीक करके मेरे पास आइए।”"]],
 ["“अगले हफ़्ते आइए। हम व्यस्त हैं।”",[["मैं आपके बॉस से शिकायत करूँगा/करूँगी!","धमकी से शायद ही काम जल्दी होता है।"],["मैं समझता/समझती हूँ। मेरे पास एक ज़रूरी वजह है। क्या इसे जल्दी करने का कोई ऑप्शन है, या ऐसा दिन जब भीड़ कम हो?","विनम्र अनुरोध और विकल्प।"],["ठीक है।","बिना विकल्प तलाशे मान लेना।"]],["“जो करना है करो।”","“ठीक है, अगले हफ़्ते।”","“गुरुवार सुबह आइए। मैं इसे निपटाने की कोशिश करूँगा।”"]]]],
motherinlaw:["आपकी सास परिवार के सामने आपके खाना पकाने की आलोचना करती हैं।",[
 ["“मेरे बेटे को ऐसे पसंद नहीं। तुम्हें इस तरह करना चाहिए।”",[["तो आप ख़ुद बना लीजिए!","परिवार के सामने बदला।"],["शुक्रिया, मैं सीखना चाहूँगी/चाहूँगा। क्या आप दिखा सकती हैं आप इसे कैसे बनाती हैं?","आलोचना को इज़्ज़त और सीख में बदलता है।"],["ठीक है।","शांति, पर नाराज़गी पनप सकती है।"]],["“कितनी बदतमीज़!”","“हम्म।”","(नरम पड़ते हुए) “आओ, मैं राज़ बताती हूँ।”"]],
 ["“तुम हमसे मिलने ज़्यादा क्यों नहीं आतीं?”",[["मैं व्यस्त हूँ। आप कभी नहीं समझतीं।","बचाव वाला और टालने वाला।"],["मैं आपके साथ समय बिताना चाहूँगी/चाहूँगा। चलिए हर महीने एक रविवार तय कर लेते हैं।","गर्मजोशी भरा, ख़ास, और एक पैटर्न बनाता है।"],["मैं कोशिश करूँगी/करूँगा।","अस्पष्ट वादे मुद्दे को दोहराते हैं।"]],["“हुँह।”","“देखेंगे।”","“इससे मुझे बहुत ख़ुशी होगी।”"]]]],
fatherinlaw:["आपके ससुर आपके पैसों के बारे में सलाह देते हैं जिससे आप सहमत नहीं हैं।",[
 ["“तुम्हें शेयर में नहीं, ज़मीन में पैसा लगाना चाहिए। मुझे बेहतर पता है।”",[["ये पुराना हो गया है।","उनके तजुर्बे को टालता है।"],["सलाह के लिए शुक्रिया। क्या आप बता सकते हैं आप ज़मीन को क्यों पसंद करते हैं? हम सोचकर देखेंगे।","इज़्ज़त भरा और जिज्ञासु, बिना कोई वादा।"],["हम्म, ठीक है।","शिष्ट, पर वे दबाव डालते रह सकते हैं।"]],["“आजकल के लोग सब जानते हैं ऐसा सोचते हैं।”","“मैं तो बस मदद करना चाहता हूँ।”","“मुझे अपने तजुर्बे से बताने दो…”"]],
 ["“तो क्या तुम ये कर रहे हो?”",[["नहीं, हमने तय कर लिया है।","सीधा और अंतिम।"],["हम पति-पत्नी के रूप में बात करेंगे और आपको बता देंगे। हमारे भविष्य की परवाह के लिए शुक्रिया।","उन्हें सम्मान देता है और आपका फ़ैसला बनाए रखता है।"],["शायद।","अस्पष्ट, और झूठी उम्मीद बना सकता है।"]],["“हुँह।”","“तुम मुझे बताओगे?”","“ठीक है। जो तय करो बता देना।”"]]]],
interviewer:["जॉब इंटरव्यू में आपसे पूछा जाता है कि पिछली नौकरी क्यों छोड़ी और किसी चुनौती के बारे में।",[
 ["“आपने पिछली कंपनी क्यों छोड़ी?”",[["मेरा बॉस बहुत ख़राब था और सैलरी कम थी।","बुराई करना आपको नुक़सान पहुँचाता है।"],["मैं ज़्यादा ग्रोथ और ज़िम्मेदारी चाहता/चाहती था/थी, और इस रोल के स्कोप को लेकर उत्साहित हूँ।","सकारात्मक, ईमानदार और आगे देखने वाला।"],["बस बदलाव चाहिए था।","अस्पष्ट; तैयार नहीं लगता।"]],["“हम्म, नोट किया।”","“क्या और बता सकते हैं?”","“अच्छा। बताइए आप किसमें बढ़ना चाहते हैं।”"]],
 ["“किसी चुनौती का वक़्त बताइए जब आपने सामना किया।”",[["मेरे सामने ज़्यादा चुनौतियाँ नहीं आईं।","बिना सोचे-समझे जैसा लगता है।"],["हमारी डेडलाइन आधी कर दी गई थी। मैंने काम बाँटा, रोज़ चेक-इन किए और समय पर डिलीवर किया। मैंने रिस्क जल्दी बताना सीखा।","स्थिति, एक्शन, नतीजा और सीख।"],["मैं मेहनत करता/करती हूँ और कुछ भी संभाल लेता/लेती हूँ।","सबूत के बिना आम दावा।"]],["“ठीक है…”","“क्या आप कोई उदाहरण दे सकते हैं?”","“हमें इसी तरह की ओनरशिप चाहिए।”"]]]]
});
const O = [
{id:"hike",em:"💰",name:"Asking for a raise",tag:"Facts, timing and calm",
 why:"Money talks feel awkward, so people avoid them or sound demanding. Your manager has budgets and approvals to deal with too.",
 steps:[["Gather evidence","List your results, extra responsibilities and market pay for your role."],["Pick the moment","After a win or at review time, not in the middle of a crisis."],["Make a clear ask","Name a number or range and tie it to your value."],["Discuss and follow up","Listen to constraints, ask what would make it possible, and confirm next steps in writing."]],
 script:["“Could we discuss my compensation? I’d like to share what I’ve delivered this year.”","“In the last 12 months I… (results). Based on my responsibilities and market research, I’m looking at X–Y.”","“What would help us get there, and when can we review it again?”"],
 dos:["Prepare 3 specific achievements","Stay calm and curious if the answer is “not now”","Ask for a timeline or a plan"],
 donts:["Don’t compare yourself with colleagues’ salaries","Don’t threaten to quit unless you mean it","Don’t make it personal (“I need money for…”)"],
 emp:"Show you understand their constraints. People help those who make it easy to say yes."},
{id:"promotion",em:"🚀",name:"Asking for a promotion",tag:"Show the next-level you",
 why:"Managers promote people who already work at the next level. You need to make that visible without bragging.",
 steps:[["Know the next-level expectations","Ask what the role needs and compare it with what you already do."],["Collect proof","Examples of ownership, leadership and impact beyond your current role."],["Ask for a proper conversation","Request dedicated time to discuss growth, not a hallway chat."],["Agree a path","If not now, agree the gaps, the support and a review date."]],
 script:["“I’m aiming for the X role. Could we talk about what it would take?”","“Over the last six months I led… and handled… which are part of that role.”","“If I’m not there yet, which skills should I build, and when can we review?”"],
 dos:["Ask for feedback on gaps","Show impact on the team and the business","Say thanks even if the answer is “not yet”"],
 donts:["Don’t argue “I deserve it because of my years”","Don’t go over your manager’s head first","Don’t stop performing if the answer is “later”"],
 emp:"Make your manager your ally: ask for their advice, not only their approval."},
{id:"leave",em:"🏖️",name:"Asking for leave",tag:"Early, clear, covered",
 why:"Leave affects workload and planning. Managers worry less when they see you’ve thought about the team.",
 steps:[["Ask early","Give as much notice as you can, especially for long leave or busy seasons."],["Be specific","State the dates, and a short reason only if you want to share it."],["Offer cover","Say who can handle urgent tasks and what you’ll finish before leaving."],["Confirm in writing","Send a short mail and update the shared calendar."]],
 script:["“I’d like to take leave from X to Y. Does that work with the team’s plans?”","“I’ll finish A and B before I go and hand over C to Riya with notes.”","“I’ll be reachable only for emergencies.”"],
 dos:["Check the team calendar first","Offer a handover","For an emergency, call first, then follow up in writing"],
 donts:["Don’t announce leave at the last minute","Don’t assume approval","Don’t over-explain or make up reasons"],
 emp:"Ask “How does this look from your side?” It shows you care about the team, not only your plans."},
{id:"resign",em:"🚪",name:"Resigning gracefully",tag:"Leave well, stay respected",
 why:"People remember how you left. A smooth exit protects your reputation and your references.",
 steps:[["Decide and prepare","Have your offer, notice period and handover plan ready."],["Tell your manager first","Face to face or by call, before anyone else hears."],["Be brief and grateful","Say you’ve decided, thank them, and avoid blame."],["Hand over well","Document your work, train your successor, finish key tasks."],["Send a formal letter","Short, polite, with your last working day."]],
 script:["“I wanted you to hear this from me first. I’ve decided to move on.”","“I’m grateful for the opportunities and learning here.”","“My last day will be X. I’ll make the handover smooth.”"],
 dos:["Stay professional until the last day","Keep the reason short","Thank people individually"],
 donts:["Don’t badmouth the company","Don’t slack off","Don’t tell colleagues before your manager"],
 emp:"Expect surprise or disappointment. Give them space and stay kind."},
{id:"negotiate",em:"🤝",name:"Negotiating (price, deal, terms)",tag:"Win–win, prepared, calm",
 why:"Negotiation feels like confrontation, but it is a joint search for a fair deal. Preparation gives you confidence.",
 steps:[["Know your goal and limit","Your ideal, your fair target and your walk-away point."],["Understand their needs","Ask what matters to them besides price."],["Make a reasoned offer","Explain the value and start at a sensible number."],["Trade, don’t just give","If you concede something, ask for something in return."],["Confirm the deal","Summarise and put it in writing."]],
 script:["“What matters most to you in this deal?”","“Based on X and Y, I’d like to propose Z.”","“I can do that if we can extend the timeline.”","“To confirm, we’ve agreed…”"],
 dos:["Stay calm and polite","Use silence","Be ready to walk away"],
 donts:["Don’t bluff about what you can’t back up","Don’t take it personally","Don’t accept the first offer without thinking"],
 emp:"The best deals leave the other side feeling respected too, so they honour them."},
{id:"feedback",em:"🗣️",name:"Giving feedback",tag:"Specific, kind, useful",
 why:"People fear feedback because it feels like judgement. Done well, it shows you believe they can grow.",
 steps:[["Ask permission","“Can I share something I noticed?”"],["Describe the behaviour","What you saw or heard, not who they are."],["Explain the impact","How it affected the work or you."],["Agree the next step","Ask their view and agree what to try."]],
 script:["“Can I share some feedback on the presentation?”","“On the cost slide the numbers weren’t explained, so the client looked confused.”","“Next time, could you add one example for each number?”","“How did it feel from your side?”"],
 dos:["Be timely and private","Mention what’s working too","Give specific examples"],
 donts:["Don’t attack the person","Don’t pile on old issues","Don’t give feedback when angry"],
 emp:"Imagine how you would like to hear it, then say it that way."},
{id:"criticism",em:"🛡️",name:"Receiving criticism",tag:"Listen, learn, don’t defend",
 why:"Criticism triggers defence. If you can pause, you can separate the useful information from the sting.",
 steps:[["Breathe and listen","Don’t interrupt or defend yet."],["Clarify","Ask for examples so you understand."],["Thank them","For their time and honesty, even if it hurts."],["Decide later","Take time, then pick what to act on."]],
 script:["“Thanks for telling me. Can you give me an example?”","“What would you like me to do differently?”","“Let me think about it and come back to you.”"],
 dos:["Take notes","Look for the part that is true","Follow up with what you changed"],
 donts:["Don’t argue instantly","Don’t treat it as a verdict on your worth","Don’t sulk or retaliate"],
 emp:"Assume they are trying to help, even when it’s clumsy. You can still disagree later."},
{id:"hostmeet",em:"🪑",name:"Hosting a meeting",tag:"Purpose, agenda, decisions",
 why:"Meetings waste time when there’s no goal. As host you set the tone and make sure people leave with clarity.",
 steps:[["Set the purpose and agenda","Share the goal, topics and timing in advance."],["Invite the right people","Only those who decide or contribute."],["Open on time","Welcome, restate the goal, agree ground rules."],["Facilitate","Hear everyone, keep to time, park side topics."],["Close with actions","Summarise decisions, owners and deadlines, and send notes."]],
 script:["“Thanks for joining. By the end we want to decide X.”","“Let’s hear from each person for two minutes.”","“Good point. Let’s park that and come back to it at the end.”","“To summarise: Sam will do A by Tuesday, Priya will do B by Friday.”"],
 dos:["Send the agenda early","Start and end on time","Share notes within 24 hours"],
 donts:["Don’t let one person dominate","Don’t end without decisions","Don’t invite everyone “just in case”"],
 emp:"Invite quieter people directly: “Meera, what’s your view on this?” It makes the room safer."},
{id:"attendmeet",em:"📝",name:"Attending a meeting",tag:"Prepared, present, positive",
 why:"People attend meetings without preparing or contributing, then complain about them. Your presence is a chance to be seen and be useful.",
 steps:[["Prepare","Read the agenda and any documents, and note your points."],["Arrive on time","Join early, camera on if remote, phone away."],["Listen actively","Take notes, don’t multitask, let others finish."],["Contribute briefly","Make one clear point, ask relevant questions, build on others’ ideas."],["Follow up","Do your action items and send a short recap if you own something."]],
 script:["“Before we move on, can I add one point?”","“Building on what Dev said, I suggest…”","“Just to confirm: I own X by Friday, right?”","“Could you share what ‘done’ looks like?”"],
 dos:["Speak early in the meeting","Agree owners and dates","Disagree respectfully, with data"],
 donts:["Don’t check your phone","Don’t interrupt","Don’t stay silent and then disagree later"],
 emp:"Credit others’ ideas by name. People remember who made them feel heard."},
{id:"anchor",em:"🎙️",name:"Anchoring a discussion or event",tag:"Be the glue, not the star",
 why:"An anchor keeps the group on track, gives everyone a voice and makes the audience comfortable. It’s a service role, not a performance.",
 steps:[["Prepare the flow","Know the agenda, names, timings and the key message."],["Open warmly","Welcome everyone, set the purpose and explain how the session runs."],["Guide and connect","Introduce speakers, ask questions, summarise and link topics."],["Manage time and voices","Gently handle long speakers and invite quiet ones."],["Close well","Recap, thank everyone and state next steps."]],
 script:["“Good evening everyone, and welcome. Today we’ll explore…”","“Thank you, Anita. That connects to what Raj mentioned. Raj, what do you think?”","“We have five minutes left, so let’s take one last question.”","“Thank you all. To recap, we decided…”"],
 dos:["Learn names and pronunciations beforehand","Use short, simple sentences","Stay neutral during disagreements"],
 donts:["Don’t talk more than the speakers","Don’t interrupt rudely","Don’t joke at someone’s expense"],
 emp:"Watch faces. If someone looks lost or left out, bring them in with a friendly question."},
{id:"presentation",em:"📊",name:"Giving a presentation",tag:"Clear message, calm delivery",
 why:"Nervousness makes people rush or read their slides. Your audience wants one clear message and a human voice.",
 steps:[["Know your one message","What should they remember or do?"],["Structure it simply","Opening, three points, close."],["Practise aloud","Time it and rehearse the first minute until it’s smooth."],["Connect with the audience","Eye contact, pauses, simple words, a story or example."],["Handle questions","Listen, repeat the question, answer briefly, or say “I’ll find out.”"]],
 script:["“By the end of this talk, I’d like you to see how we can cut delays by 20%.”","“There are three ideas. First…”","“That’s a good question. Let me make sure I understood it…”","“To close, the key takeaway is…”"],
 dos:["Breathe and pause","Use fewer slides and fewer words","Speak to people, not the screen"],
 donts:["Don’t read your slides","Don’t apologise for nerves","Don’t rush the ending"],
 emp:"Imagine the audience as people who want you to do well. Most of them do."},
{id:"speech",em:"🎂",name:"Speech or toast",tag:"Short, warm, personal",
 why:"At weddings, farewells and birthdays people want warmth, not a long speech. A short personal story beats a list of praise.",
 steps:[["Know the occasion and audience","Keep the tone right for the room."],["Start with a hook or a story","A short moment that shows who the person is."],["Add one or two points","Qualities or wishes, not a CV."],["End with a toast","A clear closing line, then raise the glass."]],
 script:["“For those who don’t know me, I’m Ravi, Meera’s friend since school.”","“I remember when she… and that’s who she is.”","“So please raise your glasses: to Meera and Arjun, to love and laughter!”"],
 dos:["Keep it to 2–3 minutes","Practise out loud","Use humour that is kind"],
 donts:["Don’t embarrass anyone","Don’t mention exes or stories that sting","Don’t drink before you speak"],
 emp:"Speak about the person, not about yourself."},
{id:"intro",em:"👋",name:"Introducing yourself / networking",tag:"Warm, short, curious",
 why:"Many people dread networking. It is simply curious conversation, where being interested beats being impressive.",
 steps:[["Smile and greet","Make eye contact and say your name."],["Share a short intro","Who you are and one interesting detail."],["Ask open questions","About them, their work or interests."],["Listen and connect","Find common ground and offer something useful."],["Close and follow up","Exchange contacts and message within two days."]],
 script:["“Hi, I’m Asha. I work in data. What brings you here?”","“That’s interesting. How did you get into that?”","“I’d love to stay in touch. Could I message you on LinkedIn?”"],
 dos:["Prepare a 15-second intro","Remember names","Offer help before asking for it"],
 donts:["Don’t pitch immediately","Don’t scan the room while talking","Don’t monopolise the conversation"],
 emp:"People remember how you made them feel more than what you said."},
{id:"proposal",em:"💍",name:"Marriage proposal",tag:"Sincere, ready for any answer",
 why:"A proposal is a vulnerable moment: you are asking for a lifetime commitment. Pressure, an audience or a surprise can take away the other person’s freedom to answer honestly.",
 steps:[["Be sure of the timing","Talk about the future together first, so the question isn’t a shock."],["Choose a private, comfortable place","Somewhere meaningful to them, not a public stage that makes “no” hard."],["Speak from the heart","Share specific things you love and the life you imagine, in your own words."],["Ask clearly, then listen","Ask the question, give them space and accept any answer with grace."]],
 script:["“These years with you have taught me what home feels like.”","“I love how you… and I want to build a life with you.”","“Will you marry me?”","If they need time: “Take all the time you need. I’m not going anywhere.”"],
 dos:["Respect their family’s culture and wishes if it matters to them","Keep it personal, not a performance","Have a calm response ready for “I need time”"],
 donts:["Don’t propose in public to pressure a “yes”","Don’t read from a long script","Don’t sulk or argue if the answer isn’t yes"],
 emp:"Think about how they will feel, not how it will look. A comfortable “yes” matters more than a spectacular one."},
{id:"apology",em:"🙏",name:"Saying sorry",tag:"Own it, repair it",
 why:"A weak apology (“sorry you feel that way”) adds hurt. A real one acknowledges the impact and shows change.",
 steps:[["Own it","Name what you did, without a “but”."],["Acknowledge the impact","Show you understand how they felt."],["Make it right","Offer to repair the damage, if you can."],["Commit to change","Say what you’ll do differently, then do it."]],
 script:["“I’m sorry I spoke over you in the meeting. That was disrespectful.”","“I can see it made you feel unheard.”","“I’d like to fix it by correcting it with the team.”","“From now on, I’ll let you finish.”"],
 dos:["Apologise soon","Keep it simple and sincere","Let them respond, even with anger"],
 donts:["Don’t say “sorry, but…”","Don’t expect instant forgiveness","Don’t over-explain to excuse yourself"],
 emp:"An apology is for them, not to relieve your own guilt."},
{id:"condolence",em:"🕯️",name:"Offering condolences",tag:"Presence over perfect words",
 why:"We fear saying the wrong thing, so we say nothing. Simple, sincere words and your presence matter most.",
 steps:[["Reach out soon","A short message or visit now beats a perfect one later."],["Say a simple line","Acknowledge the loss and your care."],["Listen","Let them talk or be silent. Don’t try to fix."],["Offer specific help","Meals, errands, calls – and follow up weeks later."]],
 script:["“I’m so sorry for your loss. I’m thinking of you.”","“He was a wonderful person. I remember when…”","“I’m here. If you want to talk, or if you’d rather not, that’s okay.”","“Can I bring dinner on Thursday?”"],
 dos:["Use their loved one’s name","Share a good memory if you have one","Check in after the funeral"],
 donts:["Don’t say “they’re in a better place” unless you know it fits","Don’t compare griefs","Don’t say “let me know if you need anything” and leave it there"],
 emp:"You don’t have to make them feel better. You only have to not leave them alone."},
{id:"thanks",em:"💛",name:"Appreciating & thanking",tag:"Specific and sincere",
 why:"A generic “thanks” is easy to forget. Specific appreciation makes people feel seen and willing to help again.",
 steps:[["Be specific","Name what they did."],["Share the impact","How it helped you or the team."],["Say it soon","Within a day or two."],["Use the right channel","In person, a note, or in front of others if they like that."]],
 script:["“Thank you for staying late to fix the report. It saved our launch.”","“I really appreciated how you explained it without making me feel small.”"],
 dos:["Praise effort and qualities","Copy their manager when suitable","Be genuine"],
 donts:["Don’t add a request in the same breath","Don’t exaggerate","Don’t thank only the leaders"],
 emp:"Appreciation costs little. Do it more often than feels necessary."},
{id:"no",em:"🙅",name:"Politely saying no",tag:"Kind, clear, brief",
 why:"We say yes to avoid guilt and then resent it. A clear, kind no protects your time and the relationship.",
 steps:[["Pause","“Let me check and get back to you” buys you time."],["Appreciate","Thank them for thinking of you."],["Say no clearly","One short reason, or none, without apologising again and again."],["Offer an alternative","If you genuinely can: another time, smaller help, or another person."]],
 script:["“Thank you for asking. I can’t take this on right now.”","“I’m at capacity this week, so I won’t be able to do it well.”","“I can help next month, or suggest someone else.”"],
 dos:["Be firm and warm","Say “I can’t” rather than a long excuse","Stick to your answer when pushed"],
 donts:["Don’t give a long justification","Don’t make up excuses that can be checked","Don’t say “maybe” when you mean no"],
 emp:"A no to the request is not a no to the person. Let your tone say that."},
{id:"conflict",em:"⚖️",name:"Managing conflict",tag:"Cool the heat, solve the problem",
 why:"Conflict feels like a threat, so people attack or avoid. The goal is to protect the relationship while solving the problem.",
 steps:[["Cool down","Pause until you can speak calmly. Say when you’ll talk."],["Listen first","Let them finish, then repeat what you heard."],["State your side with “I”","Describe facts and your feelings without blame."],["Find a shared goal","Ask what both want and brainstorm options together."],["Agree and follow up","Write down who does what by when."]],
 script:["“I want to sort this out. Can we talk after lunch?”","“What I’m hearing is… did I get that right?”","“I felt worried when… I’d like us to…”","“What would work for both of us?”"],
 dos:["Separate the people from the problem","Take a break if emotions rise","Look for a win–win"],
 donts:["Don’t use “always” and “never”","Don’t bring in past issues","Don’t recruit others to take sides"],
 emp:"Ask what the other person is protecting. Often it’s respect, fairness or safety."},
{id:"badnews",em:"⚠️",name:"Giving bad news",tag:"Honest, early, supportive",

function LS(pid){
  const s=S[pid], h=isHi()&&HS[pid]?HS[pid]:null;
  return {
    setup:h?h[0]:s.setup,
    q:r=>h?h[1][r][0]:s.rounds[r].q,
    ot:(r,i)=>h?h[1][r][1][i][0]:s.rounds[r].o[i][0],
    of:(r,i)=>h?h[1][r][1][i][1]:s.rounds[r].o[i][2],
    rep:(r,sc)=>h?h[1][r][2][sc]:s.rounds[r].r[sc]
  };
}

  try{ navigator.clipboard.writeText(_script).then(done,()=>fallbackCopy(done)); }catch(e){ fallbackCopy(done); }
}
function fallbackCopy(done){ try{ const t=document.createElement("textarea"); t.value=_script; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); done(); }catch(e){} }

/* ---------- VIEWS ---------- */
function occList(){
  return `<h2 class="sm">${u("occH")}</h2><p class="sub sm">${u("occSub")}</p>`+OGROUPS.map((g,gi)=>`<h3>${ogname(gi)}</h3><div class="grid">${g[1].map(id=>LO(oById[id])).map(o=>`<button class="pc" onclick="go('occ','${o.id}')"><div class="em">${o.em}</div><strong>${o.name}</strong><small>${o.tag}</small></button>`).join("")}</div>`).join("");
}
function occDetail(o0){
  const o=LO(o0); _script=o.script.join("\n");
  return `<button class="back" onclick="go('occ')">${u("allOcc")}</button>
  <h2>${o.em} ${o.name}</h2><p class="sub">${o.tag}</p>
  <div class="card mind"><strong>${u("oWhy")}</strong><p>${o.why}</p></div>
  <h3>${u("oSteps")}</h3>
  ${o.steps.map((s,i)=>`<div class="step"><b class="l">${i+1}</b><div><strong>${s[0]}</strong><br>${s[1]}</div></div>`).join("")}
  <h3>${u("oScript")}</h3>
  <div class="card">${li(o.script.map(x=>`<span class="quote">${x}</span>`))}</div>
  <button class="btn alt" onclick="copyScript(this)">${u("copy")}</button>
  <div class="cols"><div class="card do"><h3>${u("sDo")}</h3>${li(o.dos)}</div><div class="card dont"><h3>${u("sDont")}</h3>${li(o.donts)}</div></div>
  <div class="card mind"><strong>${u("oEmp")}</strong><p>${o.emp}</p></div>`;
}
function groupedGrid(tab,withTag){
  return GROUPS.map((g,gi)=>`<h3>${gname(gi)}</h3><div class="grid">${g[1].map(id=>LP(byId[id])).map(p=>`<button class="pc" onclick="go('${tab}','${p.id}')"><div class="em">${p.em}</div><strong>${p.name}</strong>${withTag?`<small>${p.tag}</small>`:""}</button>`).join("")}</div>`).join("");
}
function peopleList(){
  return `<h2 class="sm">${u("whoH")}</h2>
  ${groupedGrid("people",true)}
  <div class="card mind"><strong>${u("golden")}</strong><p>${u("goldenTxt")}</p></div>`;
}
function personDetail(p0){
  const p=LP(p0);
  return `<button class="back" onclick="go('people')">${u("allPeople")}</button>
  <h2>${p.em} ${p.name}</h2>
  <div class="card mind"><strong>${u("sMind")}</strong><p>${p.mind}</p></div>
  <div class="card"><strong>${u("sNeeds")}</strong>${li(p.needs)}</div>
  <div class="cols"><div class="card do"><h3>${u("sDo")}</h3>${li(p.dos)}</div><div class="card dont"><h3>${u("sDont")}</h3>${li(p.donts)}</div></div>
  <h3>${u("sSay")}</h3>
  ${p.swaps.map(s=>`<div class="swap"><div class="x">${s[0]}</div><div class="y">${s[1]}</div></div>`).join("")}
  <h3>${u("sOpen")}</h3>
  <div class="card">${li(p.openers.map(o=>`<span class="quote">“${o}”</span>`))}</div>
  <h3>${u("sHard")}</h3>
  ${p.hard.map(h=>`<div class="card"><strong>${h[0]}</strong><p>${h[1]}</p></div>`).join("")}
  <div class="card"><strong>${u("sTone")}</strong><p>${p.tone}</p></div>
  <button class="btn" onclick="go('practice','${p0.id}')">${u("bPractice")}</button>
  <button class="btn alt" onclick="go('read')">${u("bRead")}</button>`;
}

function startPractice(pid){ state.pr={pid,r:0,score:0,picked:null,order:shuffle([0,1,2])}; }
function practiceHome(){
  return `<h2 class="sm">${u("prH")}</h2><p class="sub sm">${u("prSub")}</p>
  ${groupedGrid("practice",false)}`;
}
function practiceRun(){
  const pr=state.pr, p=LP(byId[pr.pid]), sc=S[pr.pid], L=LS(pr.pid);
  if(pr.r>=sc.rounds.length){
    const max=sc.rounds.length*2, pct=Math.round(pr.score/max*100);
    const msg = pct>=100?u("msg3"):pct>=60?u("msg2"):u("msg1");
    return `<div class="big">${pct>=100?"🌟":pct>=60?"👍":"🌱"}</div><h2 style="text-align:center">${u("score")}: ${pct}%</h2>
    <div class="meter"><i style="width:${pct}%"></i></div><p class="sub" style="text-align:center;margin-top:10px">${msg}</p>
    <div class="card"><strong>${u("remember")} ${p.name}</strong>${li(p.dos.slice(0,3))}</div>
    <button class="btn" onclick="go('practice','${pr.pid}')">${u("again")}</button>
    <button class="btn alt" onclick="go('practice')">${u("another")}</button>
    <button class="btn alt" onclick="go('people','${pr.pid}')">${u("guide")}</button>`;
  }
  const rd=sc.rounds[pr.r], max=sc.rounds.length*2;
  let h=`<button class="back" onclick="go('practice')">${u("back")}</button>
  <h2>${p.em} ${p.name}</h2><p class="sub">${L.setup}</p>
  <div class="meter"><i style="width:${pr.score/max*100}%"></i></div><p class="sub">${u("meter")} ${pr.r+1} ${u("of")} ${sc.rounds.length}</p>
  <div class="bubble">${L.q(pr.r)}</div>`;
  const picked=pr.picked;
  pr.order.forEach(i=>{
    const o=rd.o[i];
    h+=`<button class="opt ${picked===i?"s"+o[1]:""}" ${picked!==null?"disabled":""} onclick="pick(${i})">${L.ot(pr.r,i)}</button>`;
    if(picked===i) h+=`<div class="fb">${["❌","🟡","✅"][o[1]]} ${L.of(pr.r,i)}</div>`;
  });
  if(picked!==null){
    const s=rd.o[picked][1];
    h+=`<div class="bubble">${L.rep(pr.r,s)}</div>`;
    if(s<2){ const bi=rd.o.findIndex(o=>o[1]===2); h+=`<div class="card mind"><strong>${u("stronger")}</strong><p class="quote">“${L.ot(pr.r,bi)}”</p></div>`; }
    h+=`<button class="btn" onclick="nextRound()">${pr.r+1>=sc.rounds.length?u("seeScore"):u("next")}</button>`;
  }
  return h;
}
function pick(i){ const pr=state.pr; if(pr.picked!==null) return; pr.picked=i; pr.score+=S[pr.pid].rounds[pr.r].o[i][1]; render(); }
function nextRound(){ const pr=state.pr; pr.r++; pr.picked=null; pr.order=shuffle([0,1,2]); render(); window.scrollTo(0,0); }

function readThem(){
  const st=STYLES.find(x=>x.id===state.style), md=MOODS.find(x=>x.id===state.mood), rl=byId[state.rel];
  const S1=st&&lst(st), M1=md&&lmd(md), R1=rl&&LP(rl);
  let h=`<h2>${u("rdH")}</h2><p class="sub">${u("rdSub")}</p>
  <h3>${u("rdWho")}</h3>${P.map(LP).map(p=>`<button class="chip ${state.rel===p.id?"on":""}" onclick="setSel('rel','${p.id}')">${p.em} ${p.name}</button>`).join("")}
  <h3>${u("rdStyle")}</h3>${STYLES.map(lst).map(s=>`<button class="chip ${state.style===s.id?"on":""}" onclick="setSel('style','${s.id}')">${s.em} ${s.name}</button>`).join("")}
  <h3>${u("rdMood")}</h3>${MOODS.map(lmd).map(m=>`<button class="chip ${state.mood===m.id?"on":""}" onclick="setSel('mood','${m.id}')">${m.em} ${m.name}</button>`).join("")}`;
  if(st||md||rl){
    h+=`<h2>${u("rdApproach")}</h2>`;
    if(M1) h+=`<div class="card mind"><strong>${u("rdStart")}</strong><p class="quote">“${M1.open}”</p></div>`;
    if(R1) h+=`<div class="card"><span class="tag">${R1.em} ${R1.name}</span><p style="margin-top:6px">${R1.needs.slice(0,2).join(" · ")}</p><p class="sub">${u("tone")} ${R1.tone}</p></div>`;
    if(M1) h+=`<div class="card"><strong>${M1.em} ${u("moodWhen")}${isHi()?M1.name:M1.name.toLowerCase()}</strong>${li(M1.tips)}<p class="sub">${u("avoid")} ${M1.avoid}</p></div>`;
    if(S1) h+=`<div class="card"><strong>${S1.em} ${S1.name}${u("styleSfx")}</strong>${li(S1.tips)}<p class="sub">${u("avoid")} ${S1.avoid}</p></div>`;
    if(R1) h+=`<button class="btn alt" onclick="go('people','${R1.id}')">${u("fullGuide")}${R1.name}</button>`;
  }
  h+=`<h3>${u("know")}</h3><p class="sub">${u("knowSub")}</p><div class="card">${li(knowList())}</div>`;
  return h;
}
function setSel(k,v){ state[k]=state[k]===v?null:v; render(); }

function tools(){
  return `<h2>${u("tlH")}</h2>
  <div class="card mind"><strong>${u("empVs")}</strong><p>${u("empVsTxt")}</p></div>
  <h3>${u("hear")}</h3>
  <div class="step"><b class="l">H</b><div><strong>${u("hT")}</strong><br>${u("hD")}</div></div>
  <div class="step"><b class="l">E</b><div><strong>${u("eT")}</strong><br>${u("eD")}</div></div>
  <div class="step"><b class="l">A</b><div><strong>${u("aT")}</strong><br>${u("aD")}</div></div>
  <div class="step"><b class="l">R</b><div><strong>${u("rT")}</strong><br>${u("rD")}</div></div>
  <h3>${u("feelH")}</h3><p class="sub">${u("feelSub")}</p>
  <div class="feel">${feelList().map(f=>`<span>${f}</span>`).join("")}</div>
  <h3>${u("swapH")}</h3>
  ${swapList().map(s=>`<div class="swap"><div class="x">${s[0]}</div><div class="y">${s[1]}</div></div>`).join("")}
  <h3>${u("notesH")}</h3>
  <p class="sub">${u("notesSub")}</p>
  <textarea id="notes" placeholder="${u("notesPh").replace(/"/g,"&quot;")}"></textarea>`;
}

function render(){
  renderChrome();
  if(state.tab==="people") view.innerHTML = state.pid?personDetail(byId[state.pid]):peopleList();
  else if(state.tab==="occ") view.innerHTML = state.oid?occDetail(oById[state.oid]):occList();
  else if(state.tab==="practice") view.innerHTML = state.pr?practiceRun():practiceHome();
  else if(state.tab==="read") view.innerHTML = readThem();
  else { view.innerHTML = tools(); const n=$("#notes"); n.value=store.get("h2h-notes",""); n.addEventListener("input",()=>store.set("h2h-notes",n.value)); }
}
render();
</script>
</body>
</html>
