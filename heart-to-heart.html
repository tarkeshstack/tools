<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="h2h-lang" content="en">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heart to Heart – Talk to Anyone with Empathy</title>
<style>
:root{--bg:#fbf7f2;--card:#fff;--ink:#2b2a33;--mute:#6b6877;--line:#ece4da;--acc:#e0685a;--acc2:#3f7f86;--soft:#fdeceb;--soft2:#e6f2f3;--good:#2e8b57;--ok:#c58a1a;--bad:#c0392b;--r:16px}
@media(prefers-color-scheme:dark){:root{--bg:#17161b;--card:#222128;--ink:#f1eee9;--mute:#a8a4b3;--line:#34323d;--acc:#f08a7c;--acc2:#6fb7be;--soft:#3a2523;--soft2:#1f3235;--good:#5cc98a;--ok:#e4b04a;--bad:#ee7a6c}}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari","Nirmala UI",Mangal,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding-bottom:24px}
header{padding:14px 18px 6px;max-width:820px;margin:auto;position:relative;text-align:center}
header h1{font-size:1.85rem;letter-spacing:-.02em}
header h1 span{color:var(--acc)}
main{max-width:820px;margin:auto;padding:10px 16px 30px}
nav{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.05);display:flex;justify-content:center;gap:2px;padding:6px;z-index:9}
nav button{flex:1;max-width:200px;border:0;background:none;color:var(--mute);font:inherit;font-size:.72rem;padding:6px 2px;border-radius:12px;cursor:pointer}
nav button b{display:block;font-size:1.3rem;font-weight:400}
nav button.on{color:var(--acc);background:var(--soft);font-weight:600}
h2{font-size:1.25rem;margin:14px 0 6px}
h2.sm{font-size:1rem;margin:10px 0 3px}
p.sm{font-size:.8rem;margin-bottom:8px}
h3{font-size:1rem;margin:16px 0 6px}
.sub{color:var(--mute);font-size:.92rem;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:.15s}
.pc:hover{transform:translateY(-2px);border-color:var(--acc)}
.pc .em{font-size:1.9rem}
.pc strong{display:block;margin-top:4px;font-size:.98rem}
.pc small{color:var(--mute);font-size:.8rem;line-height:1.3;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:10px 0}
.card.mind{background:var(--soft2);border-color:transparent}
ul{padding-left:20px}li{margin:4px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.cols{grid-template-columns:1fr}}
.do h3{color:var(--good)}.dont h3{color:var(--bad)}
.do,.dont{margin:0}
.swap{border-left:4px solid var(--acc);padding:6px 12px;margin:8px 0;background:var(--card);border-radius:0 12px 12px 0}
.swap .x{color:var(--bad);text-decoration:line-through;text-decoration-color:rgba(192,57,43,.5);font-size:.92rem}
.swap .y{color:var(--good);font-weight:600;font-size:.95rem}
.btn{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;margin:8px 8px 0 0}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.back{background:none;border:0;color:var(--acc2);font:inherit;cursor:pointer;padding:6px 0;font-weight:600}
.chip{display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;margin:4px 6px 4px 0;cursor:pointer;font:inherit;font-size:.9rem}
.chip.on{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.bubble{background:var(--card);border:1px solid var(--line);padding:12px 14px;border-radius:4px 16px 16px 16px;margin:10px 0;max-width:92%}
.bubble.me{margin-left:auto;background:var(--soft);border-radius:16px 4px 16px 16px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;font:inherit;color:inherit;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--acc)}
.opt.s2{border-color:var(--good);background:rgba(46,139,87,.1)}
.opt.s1{border-color:var(--ok);background:rgba(197,138,26,.1)}
.opt.s0{border-color:var(--bad);background:rgba(192,57,43,.08)}
.fb{font-size:.9rem;margin:2px 0 6px 6px}
.meter{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--good));transition:width .5s}
.big{font-size:2.6rem;text-align:center}
.tag{display:inline-block;font-size:.75rem;background:var(--soft);color:var(--acc);padding:2px 10px;border-radius:99px;margin-right:6px}
.feel{display:flex;flex-wrap:wrap;gap:6px}
.feel span{background:var(--soft2);padding:4px 12px;border-radius:99px;font-size:.88rem}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;background:var(--card);color:var(--ink)}
.step{display:flex;gap:12px;align-items:flex-start;margin:8px 0}
.step b.l{flex:none;width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:1.1rem}
.quote{font-style:italic}
#h-sub{color:var(--mute);font-size:.74rem;margin-top:1px}
.lang{position:absolute;top:19px;right:10px;display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:none;color:var(--mute);font:inherit;font-size:.6rem;padding:4px 7px;cursor:pointer}
.lang button.on{background:var(--acc);color:#fff;font-weight:600}
body.hi{line-height:1.7}
footer#foot{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);color:var(--mute);font-size:.66rem;line-height:1.3;text-align:center;padding:6px 12px calc(6px + env(safe-area-inset-bottom));z-index:8}
body{padding-bottom:46px!important}
.note{font-size:.8rem;color:var(--mute);margin-top:18px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Heart <span>to</span> Heart</h1>
  <p id="h-sub"></p><div class="lang" id="lang"></div>
</header>

<main id="view"></main>

<footer id="foot"></footer>
<script>
/* ---------- DATA ---------- */
const P = [
{id:"boss",em:"👔",name:"Senior / Boss",tag:"Clear, brief, no surprises",
 mind:"Carries accountability for results and people above them. Time is short; they want clarity, ownership and early warning.",
 needs:["Brief, structured updates","Solutions, not only problems","Early warning on risks","Respect for their time"],
 dos:["Lead with the point, then the detail","Bring one recommendation with every problem","Say “I’ll update you by Thursday” – and do it","Ask for feedback and thank them for it"],
 donts:["Don’t vent without a proposal","Don’t hide bad news – it grows","Don’t go over their head without telling them","Don’t say “that’s not my job”"],
 swaps:[["I can’t do this by Friday.","I can deliver X by Friday, or everything by Tuesday. Which matters more?"],["You never told me.","Can we agree on how priorities reach me? I want to catch these early."],["It’s not my fault.","Here’s what happened and what I’ll change."]],
 openers:["Do you have 5 minutes? I need one decision from you.","I want to flag a risk early, and I have a suggestion."],
 hard:[["You disagree with a decision","Ask for the goal first, then voice your concern as a risk to that goal: “I want this to succeed, and I’m worried about X. Could we try Y?”"],["You need to say no to extra work","Show your current load and let them choose: “To take this on, what should I drop?”"]],
 tone:"Calm, concise, confident. Steady pace, eye contact."},
{id:"junior",em:"🌱",name:"Junior / New joiner",tag:"Safe to ask, safe to grow",
 mind:"Worried about looking incompetent, so may stay silent rather than ask. Watching closely how you react to mistakes.",
 needs:["Clear context and expectations","Safety to ask questions","Specific feedback","Visible trust and growth"],
 dos:["Explain the why, not just the task","Ask “which part feels unclear?” instead of “got it?”","Praise specific effort in public, correct in private","Share your own early mistakes"],
 donts:["Don’t say “it’s easy”","Don’t take over the moment they struggle","Don’t compare them with others","Don’t give feedback only when something is wrong"],
 swaps:[["It’s simple, just do it.","This part has tricks. Let’s walk through it once, then you try."],["Why didn’t you ask?","I’d rather hear a question than fix a surprise. What would make asking easier?"],["Any questions?","Which part would you like me to explain again?"]],
 openers:["How is the work feeling this week? Anything you’d like to go through?","You did X well. Let’s also look at one thing to grow."],
 hard:[["They made a serious mistake","Fix the problem first, then the learning: “What happened? What would you do differently? How can I help?” Separate the person from the error."],["Their work is below standard","Show a good example, name the gap specifically, agree one next step and a check-in date."]],
 tone:"Warm, patient, steady. Smile before you critique."},
{id:"elder",em:"👵",name:"Grandparents / Elders",tag:"Dignity, patience, stories",
 mind:"May feel their usefulness and independence shrinking. They value being heard, respected and asked for wisdom more than being “fixed”.",
 needs:["Patience and time","Dignity – no talking down","Connection and routine","Being asked for their wisdom"],
 dos:["Face them; speak slowly and clearly, not loudly","Ask about their stories and listen fully","Offer choices instead of orders","Teach tech or medical steps one at a time, and write them down"],
 donts:["Don’t use baby talk","Don’t finish their sentences","Don’t say “I already told you”","Don’t decide for them without asking"],
 swaps:[["I told you this yesterday!","No problem, let me show you again. We’ll write it down together."],["You can’t do that anymore.","Let’s find a way you can do it safely. What would help?"],["Give me the phone, I’ll do it.","Shall I show you? You press here and I’ll watch."]],
 openers:["Tell me about the time when you…","I was thinking of you. How was your day?"],
 hard:[["They repeat the same story","Listen as if it’s new – the telling is the connection. Add a fresh question: “What happened next?”"],["They resist help (doctor, medicine)","Ask what worries them, honour it, then offer a choice: “Morning or evening visit? I’ll come with you.”"]],
 tone:"Slow, warm, at eye level. Gentle touch if welcome."},
{id:"teacher",em:"📚",name:"Teachers / Mentors",tag:"Effort, curiosity, humility",
 mind:"Invest time in your growth. Appreciate effort, curiosity and honesty; tire of excuses and passivity.",
 needs:["Effort and preparation","Respectful questions","Openness to feedback","Updates on your progress"],
 dos:["Come with specific questions and what you tried","Admit what you don’t understand","Thank them and share outcomes","Ask “What would you do in my place?”"],
 donts:["Don’t make excuses","Don’t contact them only when in trouble","Don’t argue publicly","Don’t ask them to do your thinking"],
 swaps:[["I didn’t get it.","I understood A and B, but I’m stuck at C. Could you explain it another way?"],["Why did I get low marks?","Could you show me where I lost marks so I can improve?"],["Sorry, I forgot.","I missed it. Here’s what I’ll do now and how I’ll avoid it next time."]],
 openers:["May I ask a doubt? I already tried X.","Your advice helped – here’s what happened."],
 hard:[["You disagree with a grade","Ask privately to review it together, bring your reasoning, and be ready to listen."],["You need an extension","Ask early, give the reason briefly, propose a new date."]],
 tone:"Respectful, curious, humble but not afraid."},
{id:"partner",em:"💞",name:"Partner / Spouse",tag:"Feel chosen, heard, safe",
 mind:"Wants to feel understood before being advised. Because the bond matters so much, criticism cuts deeper.",
 needs:["Understanding before fixing","Daily appreciation","Shared responsibility","Undivided attention"],
 dos:["Use “I feel… when… I need…”","Repeat back what you heard before replying","If heated, take a break and say when you’ll return","Express appreciation every day"],
 donts:["Don’t say “always” or “never”","Don’t bring up old fights","Don’t use silence as punishment","Don’t compare with others"],
 swaps:[["You never listen!","I feel unheard when the phone is out while I talk. Can we have 10 minutes of full attention?"],["You’re overreacting.","I can see this really hurt. Tell me more."],["Fine. Whatever.","I’m upset and need 20 minutes. Let’s talk at 8."]],
 openers:["Is now a good time? I want to understand you better.","There’s something I appreciate about you…"],
 hard:[["A recurring fight","Name the pattern, not the person: “We keep getting stuck on chores. Let’s solve it together.”"],["They are venting","Don’t fix. Say “That sounds exhausting,” then ask “Do you want advice or just company?”"]],
 tone:"Soft, slow, close. Phones away."},
{id:"friend",em:"🤝",name:"Friend",tag:"Seen without being judged",
 mind:"Friendship runs on feeling accepted. Distance usually grows from silence, not from fights.",
 needs:["Honest, non-judgmental company","Reliability","Someone to celebrate wins","Presence in bad times"],
 dos:["Reach out first, sometimes","Ask “advice or support?”","Be honest, kindly","Remember what matters to them"],
 donts:["Don’t one-up their story","Don’t share their secrets","Don’t vanish, then return only for favours","Don’t start with “at least…”"],
 swaps:[["At least it’s not worse.","That’s really hard. I’m here."],["I told you so.","What do you want to do next? I’ll help."],["You’ve changed.","I miss you. Can we catch up properly?"]],
 openers:["Been thinking of you. How are you, really?","No agenda, just wanted to hear your voice."],
 hard:[["A friend has gone distant","Reach out without blame: “I miss us. No pressure, I’m around.”"],["You need to say something hard","Ask permission, then be kind and specific: “Can I share something I’ve noticed? It’s because I care.”"]],
 tone:"Relaxed, genuine, humour when welcome."},
{id:"teen",em:"🎧",name:"Teenager / Child",tag:"Respect, not lectures",
 mind:"Building identity and independence. Hears lectures as distrust. Behind attitude there is often stress, fear or embarrassment. (Younger children: use simple words and get down to their eye level.)",
 needs:["Listening without lecturing","Trust and some autonomy","Consistent, explained boundaries","Feeling accepted"],
 dos:["Talk side by side (car, walk, cooking) rather than face to face","Name the feeling: “That sounds frustrating”","Ask permission before giving advice","Keep rules few, clear and explained"],
 donts:["Don’t mock their interests","Don’t read their messages secretly","Don’t compare siblings","Don’t shame them in front of friends"],
 swaps:[["Because I said so.","Here’s my worry. Help me find something that works for both of us."],["What is wrong with you?","You seem down. I’m here whenever you want to talk."],["When I was your age…","That sounds tough. What do you think you’ll do?"]],
 openers:["Want to grab a snack and chat? No lecture, promise.","I noticed you were quiet today. I’m around."],
 hard:[["They shut down","Don’t chase. Stay available: “I’m here when you’re ready.” Try again in a low-pressure moment."],["Grades or screen time","Start with their view, set the limit together, link it to something they care about."]],
 tone:"Casual, calm, respectful. Short sentences."},
{id:"relative",em:"🧑‍🤝‍🧑",name:"Relatives & In-laws",tag:"Face-saving warmth",
 mind:"Family roles and expectations carry history. Advice is often how they show belonging; comments can feel personal but are rarely meant to hurt.",
 needs:["Respect for their position","Inclusion in occasions","Face-saving – no public conflict","Courtesy and warmth"],
 dos:["Greet and ask about them first","Answer intrusive questions with a smile and a pivot","Thank them for advice; decide privately","Keep one ally and keep communication open"],
 donts:["Don’t argue at gatherings","Don’t carry stories between relatives","Don’t take sides in old feuds","Don’t reply to jibes with sarcasm"],
 swaps:[["Mind your own business.","Thank you for caring. We’re comfortable with our plan."],["That’s not how we do it.","That’s a nice idea. We’ll try our way this time."],["You always criticise.","I know you mean well. It helps me more when you say it privately."]],
 openers:["How have you been? It’s been too long!","Could I get your advice on something?"],
 hard:[["Intrusive questions (salary, marriage, kids)","Smile, answer lightly, redirect: “We’ll share when there’s news. How is your…?”"],["Disagreement with in-laws","Speak privately, begin with shared goals, and make your partner part of the team."]],
 tone:"Courteous, warm, patient, a touch of humour."},
{id:"colleague",em:"💼",name:"Colleague / Peer",tag:"Fair, direct, credit-sharing",
 mind:"Shares your pressure but not your priorities. Wants fairness, credit and not being blindsided.",
 needs:["Credit for their work","Clear handoffs","Reliability","Respect for boundaries"],
 dos:["Assume good intent first","Clarify who owns what","Give credit in public","Ask “What would help you?”"],
 donts:["Don’t email-fight – call","Don’t complain to others first","Don’t take credit","Don’t ignore messages"],
 swaps:[["You didn’t do your part.","I’m missing X for my part. What’s blocking you? How can I help?"],["That’s your problem.","I can’t take this on today, but let’s find who can."],["As I said in my email…","Let me summarise quickly so we’re aligned."]],
 openers:["Got a minute? I want to align on something.","Thanks for your help on X – it made a difference."],
 hard:[["Someone takes credit for your idea","Speak privately, stick to facts, state what you want: “I’d like us to credit each other’s work in updates.”"],["Clash of work styles","Talk about the outcome you both want, then agree how you’ll work."]],
 tone:"Friendly, direct, fair."},
{id:"mother",em:"🤱",name:"Mother",tag:"Love shown through care",
 mind:"Often the emotional centre of the family. Shows love through food, worry and sacrifice, and rarely asks for anything for herself.",
 needs:["Feeling appreciated, not taken for granted","Time and attention, not only gifts","Knowing you are safe","Her own wishes being noticed"],
 dos:["Thank her for the small daily things","Call just to chat, without needing anything","Help before being asked","Ask “How are you? What would you like?”"],
 donts:["Don’t snap when she repeats advice","Don’t say “you’re too emotional”","Don’t hide big news and explain later","Don’t make her the go-between in family fights"],
 swaps:[["Stop nagging me!","I know you ask because you care. Can I tell you my plan so you worry less?"],["I’ll eat outside.","Thanks for cooking. Let me help, and next time let’s cook together."],["You don’t know anything about this.","You’ve seen a lot of life. I’d like your view, then I’ll share mine."]],
 openers:["I was thinking of you. Have you eaten? Tell me about your day.","Thank you for… I don’t say it enough."],
 hard:[["She is overprotective","Reassure first, then set the boundary: “I’ll message when I reach. I need to make this decision myself.”"],["She compares you with others","Stay calm: “I know you want the best for me. Comparison hurts; I’m doing my best.”"]],
 tone:"Gentle, appreciative, patient. A hug helps if welcome."},
{id:"father",em:"👨",name:"Father",tag:"Respect, facts, quiet connection",
 mind:"Often shows love by providing and protecting. May find it hard to talk about feelings, and can hide worry behind strictness or silence.",
 needs:["Respect for his effort","Being kept informed of big decisions","A chance to advise","Quiet, genuine connection"],
 dos:["Ask for his advice, even if you may not follow it","Do an activity together – a drive, cricket, a repair","Present plans with facts and a safety net","Tell him directly that you appreciate him"],
 donts:["Don’t start with accusations","Don’t interrupt or raise your voice","Don’t contact him only for money","Don’t mock his old-fashioned ways"],
 swaps:[["You never understood me!","I wish we understood each other better. May I explain what matters to me?"],["Your generation is outdated.","Your experience helps me. Here’s what’s different now."],["I don’t need your money.","Thank you for offering. I’d like to manage this myself, and I’ll come to you if I need help."]],
 openers:["I need your advice on something.","Can we have tea together? I’d like to talk."],
 hard:[["He is strict or critical","Look for the worry underneath: “I think you’re worried about my future. Here’s my plan.”"],["He is emotionally distant","Connect through shared activity and small gestures. One sincere “thank you” can open a lot."]],
 tone:"Respectful, calm, factual, warm. Pick a quiet moment."},
{id:"sibling",em:"👫",name:"Siblings",tag:"Old rivalry, deep bond",
 mind:"Shared history means shared wounds, old rivalries and unspoken competition. Underneath, they usually want fairness and to be seen as an individual.",
 needs:["Fair treatment","Not being compared","Loyalty and privacy","Being seen as an equal adult"],
 dos:["Talk about today’s issue, not old scores","Ask how they’re really doing","Celebrate their wins without comparing","Offer help without taking over"],
 donts:["Don’t tease with painful childhood nicknames","Don’t pass on their secrets to parents","Don’t compete in front of family","Don’t say “you were always the favourite”"],
 swaps:[["You always get the attention!","I sometimes feel left out. Can we talk about it?"],["That’s your problem.","I can’t fix it, but I’m with you. What do you need?"],["Grow up!","I’m frustrated, and I’d like us to talk it through calmly."]],
 openers:["Hey, how are you doing – really?","I miss how we used to talk. Can we catch up?"],
 hard:[["Conflict about money or caring for parents","Agree on facts and a fair split, write it down, and act as partners, not rivals."],["Old resentment resurfaces","Name it once without blame: “That time hurt me. I’d like us to move forward.”"]],
 tone:"Honest, light, equal-to-equal. Humour helps if kind."},
{id:"neighbour",em:"🏘️",name:"Neighbour",tag:"Small issues, early and kind",
 mind:"Shares your space but not your routines. Small irritations (noise, parking, garbage) grow when left unspoken.",
 needs:["Courtesy and predictability","To be approached early, not at boiling point","Respect for peace and privacy","Community goodwill"],
 dos:["Introduce yourself and say hello","Raise issues early, in person and kindly","Suggest a solution","Say thanks when they help"],
 donts:["Don’t leave angry notes","Don’t complain to everyone except them","Don’t open with threats","Don’t gossip"],
 swaps:[["Your noise is unbearable!","I’m having trouble sleeping around 11. Could we find a quieter time?"],["Move your car!","Could we work out the parking so we’re both comfortable?"],["I’ll report you.","I’d prefer to sort this between us first."]],
 openers:["Hi, I’m your neighbour from number 12. I wanted to say hello.","Could I ask a small favour?"],
 hard:[["Repeated noise or rule-breaking","Speak in person, calmly, describe the effect on you, agree a fix, and involve the society or authority only if it persists."]],
 tone:"Friendly, calm, matter-of-fact."},
{id:"stranger",em:"🚶",name:"Stranger / New person",tag:"Warm, polite, safe",
 mind:"Doesn’t know you, so they read tone, eyes and words quickly for safety. A little warmth goes a long way; so does respecting a “no”.",
 needs:["Politeness and clarity","Personal space","No pressure","A sense of safety"],
 dos:["Smile and use a calm, clear voice","Introduce yourself with context","Respect a “no” at once","Use small talk to find common ground"],
 donts:["Don’t ask personal questions early","Don’t touch or crowd","Don’t assume their situation","Don’t overshare your own details"],
 swaps:[["Hey you, help me.","Excuse me, sorry to bother you. Could you help me with directions?"],["Why are you staring?","Sorry, did you need something?"],["Where are you from?","Lovely weather today, isn’t it?"]],
 openers:["Hello, I’m new here. Is this the right place for…?","Excuse me, may I sit here?"],
 hard:[["Someone seems lost or upset","Keep a respectful distance and ask: “Are you okay? Can I help?” Accept their answer."],["A stranger is too pushy","Be polite but firm: “No, thank you.” Move to a busy, public place."]],
 tone:"Calm, friendly, relaxed posture, open hands."},
{id:"manipulator",em:"🎭",name:"Manipulator",tag:"Kind, but not controlled",
 mind:"Uses guilt, flattery, pressure or silence to get their way, often because direct asking never worked for them. You can stay kind and still refuse to be controlled.",
 needs:["Your guilt or fear","Your quick “yes”","You to explain and justify yourself","You to chase them when they go silent"],
 dos:["Pause: “Let me think and get back to you”","Name the behaviour calmly, not their character","Say no briefly, without a long justification","Keep notes if it is serious or repeated"],
 donts:["Don’t argue every point","Don’t decide while pressured or guilty","Don’t retaliate with the same tactics","Don’t expect to change them"],
 swaps:[["Okay, fine, I’ll do it… (resentfully)","I can’t do that. I can help with X instead."],["How dare you say that!","I see it differently, and my answer is still no."],["I’m sorry, I’m a terrible person…","I’m not judging you. My decision stays the same."]],
 openers:["I hear you. I need time before I decide.","I’m not comfortable with that, and I’ll leave it there."],
 hard:[["Guilt trips (“after all I’ve done for you”)","Acknowledge the care, hold the line: “I’m grateful. And I still can’t do this.”"],["Silent treatment or anger to pressure you","Don’t chase or appease: “I’ll be glad to talk when we can both be calm.” If this is constant, or you feel afraid or controlled, talk to someone you trust or a counsellor."]],
 tone:"Calm, slow, steady. Boring is powerful – don’t take the bait."},
{id:"scammer",em:"🚨",name:"Scammer / Fraudster",tag:"Slow down, verify, hang up",
 mind:"Not someone to empathise with in the moment. They create urgency, fear or excitement so you act before thinking. Your protection is to slow down and verify through official channels.",

 {q:"“I didn’t want to bother you with questions.”",o:[["You should ask – that’s how you learn.",1,"True, but may sound like a lecture."],["Questions are never a bother. I’d rather hear one now than fix a surprise later. What would make asking easier?",2,"Reassures and invites a solution."],["Next time just figure it out first.",0,"Teaches them never to ask."]],r:["“Okay…”","“I’ll try to ask next time.”","“Maybe a quick chat at 11 each day?”"]}]},
elder:{setup:"Your grandfather asks, for the fifth time today, how to use his phone.",rounds:[
 {q:"“How do I call your cousin? I forgot.”",o:[["I already showed you this morning.",0,"Makes them feel like a burden."],["Here, give me the phone.",1,"Quick, but takes away independence."],["Of course! Shall we write the steps on a card so you can do it yourself? Press here first.",2,"Patient, empowering, a lasting fix."]],r:["“I’m just a burden to everyone…”","(hands over the phone, sighs)","“Wonderful! Now I can call whenever I like.”"]},
 {q:"“In my time we didn’t need all this.”",o:[["Times change, Grandpa.",0,"True but dismissive."],["Tell me how you used to stay in touch.",2,"Invites their story and honours their experience."],["Yes, it was simpler.",1,"Agreeable, but misses a chance to connect."]],r:["“Hmph.”","“Yes… letters took weeks.”","(smiles) “Let me tell you about the letters I wrote your grandmother…”"]}]},
teacher:{setup:"You scored low and want your teacher to re-check your paper.",rounds:[
 {q:"“Yes? What is it?”",o:[["You marked me unfairly!",0,"Accusing closes the door."],["Sir/Ma’am, could you help me understand where I lost marks in Q3 and Q5? I want to improve.",2,"Specific, humble, growth-focused."],["Can you just increase my marks?",1,"Focuses on marks, not learning."]],r:["“I don’t appreciate that tone.”","“Marks follow the rubric.”","“Of course. Sit down, let’s go through them.”"]},
 {q:"“Did you revise before the test?”",o:[["Yes, a lot, but it was too hard.",1,"May be true, but sounds like an excuse."],["Not enough – I studied only the last day. I’ll start earlier. May I show you my plan?",2,"Honest ownership shows maturity."],["Everyone found it hard.",0,"Deflecting reduces your credibility."]],r:["“Excuses won’t help.”","“Then work on time management.”","“Honesty is appreciated. Bring it on Monday.”"]}]},
partner:{setup:"Your partner comes home upset and starts venting about work.",rounds:[
 {q:"“My boss humiliated me in the meeting today.”",o:[["Just quit then.",0,"Jumps to solutions before they feel heard."],["That sounds humiliating, I’m sorry. Do you want to vent or want ideas?",2,"Validates and asks what they need."],["Don’t take it personally.",1,"Well-meant but minimises the hurt."]],r:["“You never understand me.”","(sighs) “I guess…”","“Just listen first. Thank you.”"]},
 {q:"“And you’re on your phone while I talk!”",o:[["I was listening!",0,"Defensive; the focus shifts to being right."],["You’re right, sorry. Phone away – tell me the rest.",2,"Acknowledges and repairs immediately."],["Sorry, go on.",1,"Okay, but show it with an action (put the phone down)."]],r:["“Forget it.”","“Hmm… okay.”","“Thanks, it means a lot.”"]}]},
friend:{setup:"Your close friend failed an important exam.",rounds:[
 {q:"“I messed everything up.”",o:[["At least you tried. Others failed too.",1,"Meant to console, but “at least” can feel small."],["I told you to study more.",0,"Judgement while they’re hurting."],["That’s really tough. I’m here. Want to talk or take a walk?",2,"Presence and choice, without fixing."]],r:["“Don’t cheer me up.”","“I guess…”","(exhales) “Let’s walk. Thank you.”"]},
 {q:"“Maybe I’m not good enough.”",o:[["Don’t say that. You’re brilliant!",1,"Kind, but can dismiss the feeling."],["It hurts a lot right now. One result doesn’t decide who you are. What do you need from me?",2,"Validates the pain and offers support."],["Well, maybe try something else.",0,"Gives up on them too fast."]],r:["“You also think so.”","“Thanks…”","“Just stay with me for a while.”"]}]},
teen:{setup:"Your teenager is on the phone late at night and snaps at you.",rounds:[
 {q:"“Leave me alone!”",o:[["Don’t talk to me like that! Phone off now!",0,"Escalates into a power struggle."],["Okay. Something seems heavy. I’m here when you want to talk.",2,"Respects space and stays available."],["Fine, but sleep by 11.",1,"The boundary is fine, but the feeling is missed."]],r:["(slams door)","(mumbles) “Whatever.”","(later) “Can we talk? I had a bad day.”"]},
 {q:"“Everyone has a phone at night. You don’t get it.”",o:[["I don’t care what everyone does.",0,"Dismissal ends the conversation."],["It sounds like staying connected with friends matters. Let’s find a rule that works for both of us.",2,"Hears them, then co-creates."],["Fine, but just for an hour.",1,"A compromise, but they weren’t included."]],r:["“You always control me!”","“Whatever.”","“Okay. How about off at 11 on school days?”"]}]},
relative:{setup:"At a family gathering, an uncle asks intrusive questions.",rounds:[
 {q:"“So, when are you getting married? What salary do you make?”",o:[["That is none of your business!",0,"Creates conflict in public."],["(Smile) Thank you for caring! We’ll share good news when there is any. How is your business going?",2,"Polite, warm and redirects."],["Hmm… soon.",1,"Avoids it, but invites more questions."]],r:["“Such disrespect these days!”","“Soon when? Soon?”","“Ha, business is good! Let me tell you…”"]},
 {q:"“Your cousin did so much better. You should learn from him.”",o:[["Then go be with your favourite cousin.",0,"Sarcasm hurts relationships."],["He’s doing well, I’m happy for him. I’m following my own path and I’d love your blessings.",2,"Gracious and boundary-setting."],["Okay, okay.",1,"Peaceful, but you may feel unheard."]],r:["“How rude!”","“Hmph, listen to elders.”","“Of course, you have my blessings.”"]}]},
colleague:{setup:"A colleague presented your idea as their own in a meeting.",rounds:[
 {q:"You catch them after the meeting. They say: “Hey! What’s up?”",o:[["You stole my idea! I’ll tell everyone.",0,"Accusation and threat escalate things."],["Do you have a minute? In the meeting I felt my part wasn’t mentioned. I’d like us to credit each other. Can we agree on that?",2,"Fact, feeling, request."],["Never mind. It’s fine.",1,"Silence leaves resentment and repeats the pattern."]],r:["“You’re being dramatic.”","“Okay then.”","“Fair. Sorry, I should have said it was a joint idea.”"]},
 {q:"“I assumed it was general knowledge.”",o:[["Don’t lie.",0,"Calling them a liar closes the door."],["Maybe it looked that way. Going forward, let’s name who contributed. Deal?",2,"A face-saving exit and a forward agreement."],["Whatever.",1,"Avoids it and lets it fade."]],r:["“Fine, ignore me then.”","“…”","“Deal. Thanks for being straightforward.”"]}]},
mother:{setup:"Your mother keeps asking if you’ve eaten, and you’re tired and short-tempered.",rounds:[
 {q:"“Have you eaten? You look so thin. You work too much.”",o:[["Mom, stop nagging!",0,"She hears rejection of her love."],["Yes, yes, I’m fine.",1,"Ends the moment but she may feel brushed off."],["Thanks for caring about me, Mom. I had a snack. What did you cook today?",2,"Receives her love and redirects warmly."]],r:["“I only ask because I care…”","“Hmm, you never listen.”","“Dal and your favourite potatoes! Come, I’ll serve you.”"]},
 {q:"“You don’t call me anymore. Everyone’s busy with their own life.”",o:[["I’m busy, Mom, you know that.",0,"True, but ignores the loneliness underneath."],["I’m sorry, I’ve been distracted. Let’s fix a time – 10 minutes every evening?",2,"Hears the need and offers a concrete habit."],["I’ll call soon.",1,"Vague promises often repeat the hurt."]],r:["“Of course. Nobody has time for me.”","“Hmm, okay.”","“That would make me so happy.”"]}]},
father:{setup:"You want your father’s support for a big decision, but he is stern and quiet.",rounds:[
 {q:"(Reading the newspaper) “What is it?”",o:[["You never support me, so I’ll do it anyway.",0,"Starts with an accusation."],["Papa, I value your advice. I’m thinking of X. Can I explain my plan and then hear what you think?",2,"Respect, clarity and an invitation."],["Nothing.",1,"Avoids the talk, so the issue stays."]],r:["“Then do what you like.”","“Hmm. Then why did you come?”","“Sit. Tell me everything. I’ll listen.”"]},
 {q:"“Have you thought about the risks? Money doesn’t grow on trees.”",o:[["You always think negatively!",0,"Attacks instead of answering the worry."],["Yes, I’ve thought about it. Here’s my savings buffer and a fallback plan.",2,"Facts answer his worry, which is how his care shows."],["I’ll manage.",1,"Short; doesn’t reassure."]],r:["“Fine, but don’t come to me later.”","“We’ll see.”","“That’s a sensible plan. I’ll support you.”"]}]},
sibling:{setup:"Your brother or sister is upset that you got more attention at a family event.",rounds:[
 {q:"“It’s always about you. Nobody asks about me.”",o:[["That’s not true, stop being dramatic.",0,"Dismisses their feeling."],["I didn’t realise you felt left out. I’m sorry. What would you have liked?",2,"Validates and asks."],["Sorry. Let’s drop it.",1,"Ends the talk without resolving it."]],r:["“See, you never listen!”","“Whatever.”","“I wanted someone to ask about my new job.”"]},
 {q:"“Remember when you got the bigger room? It’s always been like this.”",o:[["That was 15 years ago!",0,"Dismisses an old hurt."],["That sounds like it still stings. I’d like us to feel equal now. What can we change?",2,"Acknowledges history and moves forward."],["I guess life isn’t fair.",1,"True, but cold."]],r:["“You don’t care.”","“Hmm.”","“Maybe we can share things more fairly, like the holiday plans.”"]}]},
neighbour:{setup:"Your neighbour plays loud music at midnight again.",rounds:[
 {q:"You meet them in the corridor. They say: “Oh, hi.”",o:[["Your music is horrible! I’ll complain to the society!",0,"A threat triggers defensiveness."],["Hi! I wanted to mention the music at night is keeping me awake. Could we keep it down after 10?",2,"Friendly, specific, solution-oriented."],["Nothing, just hello.",1,"Avoiding it lets resentment grow."]],r:["“Mind your own business!”","“Okay… bye.” (nothing changes)","“Oh, sorry, I had no idea. I’ll lower it.”"]},
 {q:"“It’s only a few nights. Don’t be so sensitive.”",o:[["You’re inconsiderate!",0,"Labelling escalates the conflict."],["I understand you enjoy it. For me, sleep matters because of early work. Can we agree on 10 pm on weekdays?",2,"Empathy plus a clear proposal."],["Fine, whatever.",1,"You give up your own need."]],r:["“Do what you want.”","“Hmm.”","“Fair enough. 10 on weekdays, deal.”"]}]},
stranger:{setup:"On a train, an unknown person seems upset and keeps looking at you.",rounds:[
 {q:"“Sorry… I… I’m a bit lost.”",o:[["Don’t talk to me.",0,"Cold, when this may be a simple, honest need."],["No problem. Where are you trying to go? I can show you on the map.",2,"Helpful, polite, no personal questions."],["Ask the conductor.",1,"Fine, but a little warmth costs nothing."]],r:["(looks hurt) “Sorry.”","“Okay, thanks.”","“Oh, thank you. I need to reach the north station.”"]},
 {q:"“Can I borrow your phone? And where do you live? Maybe I can come with you.”",o:[["Sure, here’s my phone and I live at…",0,"Never hand a stranger your phone or private details."],["I can’t lend my phone or share personal details, but I can help you ask the station staff.",2,"Kind and safe, with a clear boundary."],["Hmm, no.",1,"Safe, but a kind alternative would help."]],r:["“Great, thanks. Which area exactly?”","“Oh, okay.”","“That’s fine. Thank you for helping.”"]}]},
manipulator:{setup:"A relative uses guilt to ask for a big favour you can’t do.",rounds:[
 {q:"“After everything I’ve done for you, you can’t even help me once?”",o:[["Fine, I’ll do it.",0,"Caving under guilt teaches that guilt works."],["I’m grateful for what you’ve done. And I can’t do this one. Can I help in another way?",2,"Acknowledges, holds the boundary, offers a limit."],["You’re emotionally blackmailing me!",1,"May be true, but starts a fight and you lose the point."]],r:["“Good. I knew you’d come around.” (next time the ask is bigger)","“How dare you! I’m your elder!”","“Hmm… fine. I’ll manage another way.”"]},
 {q:"(After days of silence) “I’m fine. Don’t worry about me.”",o:[["I’m sorry! I’ll do it, please talk to me.",0,"Appeasing rewards the silence."],["I’m here when you want to talk. My answer hasn’t changed.",2,"Kind, firm, and not chasing."],["Okay then, stay silent.",1,"Cold, and risks escalation."]],r:["“See, I knew you’d change your mind.”","“Unbelievable.”","(after a while) “Alright, let’s talk.”"]}]},
scammer:{setup:"You get a call: “This is your bank. Your account will be blocked in 10 minutes.”",rounds:[
 {q:"“There is suspicious activity. Share the OTP now to stop it.”",o:[["Oh no! The OTP is…",0,"No real bank asks for your OTP. This is how accounts get emptied."],["I’ll hang up and call my bank’s official number.",2,"Exactly right: slow down and verify."],["Why do you need it?",1,"Engaging gives them room to pressure you."]],r:["“Thank you. Transaction done.” (your money is gone)","“Because it’s urgent, hurry!”","(the call ends)"]},
 {q:"Another call: “I’m from the police. Don’t tell anyone about this.”",o:[["Okay, I won’t tell anyone.",0,"Secrecy is a classic scam tactic."],["I’m going to talk to my family and visit the police station myself.",2,"Breaking the secrecy protects you."],["Which police station are you from?",1,"They will invent an answer. Just hang up."]],r:["“Good. Now transfer the money to this account.”","“Station 5. Hurry up.”","(they hang up)"]}]},
bully:{setup:"A colleague shouts at you in front of others and mocks your work.",rounds:[
 {q:"“This is trash! Did a child do this? Everyone look!”",o:[["You’re a loser! Look at your own work!",0,"Escalates and gives them an audience."],["(Calmly) Please stop. I’m happy to discuss my work, but not like this.",2,"Calm, firm boundary with an offer of respectful talk."],["(Silence, look down)",1,"Understandable, but may invite more."]],r:["“Ha! Touchy, aren’t we?”","“Cat got your tongue?”","“…Fine. Let’s talk later.”"]},
 {q:"Later: “Why are you complaining about me? Can’t you take a joke?”",o:[["I’ll get you back.",0,"Revenge puts you at risk."],["It wasn’t a joke to me. I’ve noted what happened and told my manager. I’d like us to work respectfully.",2,"Calm, factual, protects you."],["Never mind, forget it.",1,"Avoids conflict, but nothing changes."]],r:["“Try me.”","“Good, don’t make a big deal.”","“Okay. I’ll tone it down.”"]}]},
customer:{setup:"A client asks for a delivery date you aren’t sure you can meet.",rounds:[
 {q:"“Can you deliver by Monday? Yes or no?”",o:[["Yes, definitely!",0,"Over-promising to close breaks trust later."],["I want to give you a reliable date. Let me check with the team and call you by 4 pm today.",2,"Honest, with a clear commitment."],["Maybe, I don’t know.",1,"Honest, but gives no next step."]],r:["“Great.” (on Monday: “Where is my order?”)","“Hmm, I need an answer today.”","“Thanks, I appreciate that. I’ll wait for your call.”"]},
 {q:"“Your competitor said they could do it by Friday.”",o:[["Then go with them.",0,"Gives up and sounds hurt."],["I understand the time matters. I can do part by Friday and everything by Monday. Which suits you better?",2,"Understands the need and offers options."],["They’re not as good as us.",1,"Criticising others rarely persuades."]],r:["“Okay, I will.”","“Hmm. Prove it.”","“Part on Friday works. Thank you.”"]}]},
angrycustomer:{setup:"A customer shouts that their order arrived damaged.",rounds:[
 {q:"“This is ridiculous! Third time this happens! I want a refund NOW!”",o:[["Sir, please calm down.",0,"This usually raises the temperature."],["I’m so sorry. That’s frustrating, especially the third time. Let me fix it right now. Can you tell me what happened?",2,"Acknowledge, apologise and take ownership."],["That’s not what our policy allows.",1,"Policy before empathy sounds cold."]],r:["“Don’t tell me to calm down!”","“I don’t care about your policy!”","“Thank you. The box was crushed and the item was broken.”"]},
 {q:"“Why should I trust you again?”",o:[["Because we are the best.",0,"A claim, not a solution."],["You’re right to ask. I’ll send a replacement with tracked delivery today and call you tomorrow to confirm it arrived.",2,"A specific action and a follow-up."],["I can’t promise anything.",1,"Honest, but leaves them with nothing."]],r:["“Hmm, I doubt it.”","“Then why should I stay?”","“Okay. I’ll give you one more chance.”"]}]},
ex:{setup:"Your ex messages about sharing belongings, then brings up old arguments.",rounds:[
 {q:"“Fine, come and pick up your stuff Saturday. Typical of you to wait this long.”",o:[["Typical?! You were the one who…",0,"Takes the bait and reopens the fight."],["Saturday at 2 works. I’ll keep it quick.",2,"Short, practical, neutral."],["Whatever. I’ll come when I want.",1,"Sarcasm invites more conflict."]],r:["“Here we go again!”","“Don’t bother then.”","“Okay. See you then.”"]},
 {q:"“Do you ever think about us?”",o:[["Every day. Can we talk tonight?",0,"Mixed signals when you’re unsure can hurt both of you."],["I don’t think that’s a good topic for now. I’d like to keep our messages to practical things.",2,"Kind, clear and consistent."],["Don’t ask me that.",1,"Short and cold; may feel rejecting."]],r:["“So you do still care…”","“Wow. Okay.”","“Okay. I understand.”"]}]},
landlord:{setup:"The ceiling in your rented flat is leaking and the landlord is slow to respond.",rounds:[
 {q:"“I’ve been busy. It’s not urgent, is it?”",o:[["You’re a terrible landlord!",0,"Attacks and shuts down cooperation."],["I understand you’re busy. The leak is spreading and could damage your property. Could someone come on Thursday? I’ll send photos and confirm in writing.",2,"Understands them, explains the stakes and documents it."],["Okay, let me know when you can.",1,"Polite, but no deadline or paper trail."]],r:["“Then find another flat.”","“Will do.” (weeks pass)","“Oh, that looks bad. I’ll send a plumber Thursday.”"]},
 {q:"“Also, I’m planning to raise the rent next month.”",o:[["That’s greedy! I’ll leave!",0,"Threatens instead of negotiating."],["Thank you for telling me. Could you share how the increase was decided? I’d like to find something fair for both of us.",2,"Asks for reasons and invites negotiation."],["Okay.",1,"Accepting without discussion may cost you."]],r:["“Then leave.”","“Good. It’ll be 10% more.”","“Costs have gone up. Maybe we can phase it in.”"]}]},
doctor:{setup:"At a short appointment you’re worried, and the doctor is moving quickly.",rounds:[
 {q:"“So, what brings you in today?”",o:[["Oh, probably nothing, just a bit tired.",0,"Playing it down hides the real concern."],["My main concern is chest tightness for three weeks, mostly at night. I wrote down my questions too.",2,"Clear, specific and prepared."],["I’ve been feeling a lot of things.",1,"Too vague for a short visit."]],r:["“Alright, get some rest.”","“Can you be more specific?”","“Thanks. Let’s go through that carefully.”"]},
 {q:"“Take this twice daily and come back in two weeks. Any questions?”",o:[["No, thanks.",0,"Leaving confused is risky."],["Could I repeat the plan to check I have it right? And what should I watch for before then?",2,"Confirms understanding and warning signs."],["Is it expensive?",1,"Good to ask, but add the other questions too."]],r:["“Alright, next patient.”","“Please, go ahead.”","“Yes, exactly. And call us if you notice X.”"]}]},
roommate:{setup:"Dishes pile up and your roommate keeps forgetting bills.",rounds:[
 {q:"(You raise it.) “Ugh, here we go. I do my share.”",o:[["You’re so messy and lazy!",0,"Labels the person."],["I’m not blaming you. The dishes pile up and it stresses me. Could we make a simple schedule?",2,"“I” language and a solution."],["Never mind.",1,"Resentment will grow."]],r:["“Wow. Rude.”","“Okay then.”","“Fair. Let’s do alternate days.”"]},
 {q:"“I forgot the electricity bill again. I’ll pay soon.”",o:[["You always forget!",0,"“Always” triggers defensiveness."],["Thanks. Could you pay by Friday? Let’s set a reminder in the house chat.",2,"A clear date and a system."],["Fine, I’ll pay it.",1,"Fixes today, not the pattern."]],r:["“Stop nagging.”","“Thanks, you’re the best.” (it happens again)","“Friday works. Setting a reminder.”"]}]},
staff:{setup:"A team member missed a deadline and looks anxious.",rounds:[
 {q:"(hesitant) “I know I’m late with the report…”",o:[["This is unacceptable! You always do this!",0,"Shaming and “always” shut down honesty."],["It’s fine, I’ll just do it.",1,"Relieves today but doesn’t fix the cause."],["Thanks for telling me. What got in the way, and how can I help?",2,"Appreciates honesty and looks for the cause."]],r:["“I’m sorry… I’ll try harder.” (and hides problems next time)","“Okay… thank you.”","“I was unsure about the data and was waiting for it.”"]},
 {q:"“Can I get a new date? I can finish by Friday.”",o:[["No. I need it today.",0,"Rigid without reason; may cause errors."],["Okay, Friday it is. Send me a quick update on Wednesday so we stay on track.",2,"A realistic date plus a check-in."],["Fine, whatever.",1,"Unclear and a bit cold."]],r:["“Okay…” (rushes a poor report)","“Thanks…”","“Thank you. I’ll send the update on Wednesday.”"]}]},
maid:{setup:"Your domestic helper has come late three days in a row.",rounds:[
 {q:"“Sorry, I was late.”",o:[["You’re always late! I’ll find someone else!",0,"A threat without listening."],["Is everything okay? I’ve noticed it a few days. Let’s see what time works for you.",2,"Concern first, then a solution."],["Okay, just don’t be late.",1,"Clear, but ignores the cause."]],r:["(silent, anxious) “Sorry…”","“Yes, I’ll try.”","“My child has been unwell. Could I come at 9 for a few days?”"]},
 {q:"“Can I take two days off next week?”",o:[["Again?! You take too many days off.",0,"Dismissive; fairness matters."],["Of course. Thanks for telling me ahead. Let me know the exact days and I’ll arrange.",2,"Respects the request and plans ahead."],["I’ll think about it.",1,"Leaves them anxious with no answer."]],r:["“Sorry…” (hides the next absence)","“Okay…”","“Thank you! I’ll tell you on Monday.”"]}]},
driver:{setup:"You’re running late for a flight and the cab takes a longer route.",rounds:[
 {q:"“Traffic is heavy today.”",o:[["Are you cheating me?! Go faster!",0,"Accusing escalates things and affects safety."],["I understand. I have a flight at 6. Is there a quicker route you’d suggest?",2,"Shares the need and asks for their expertise."],["Just hurry.",1,"Clear urgency, but no teamwork."]],r:["“I’m doing my best!”","“Okay.”","“There’s a flyover. We’ll take it; it should save 10 minutes.”"]},
 {q:"“That will be extra because of the flyover toll.”",o:[["That’s a scam!",0,"An unchecked accusation."],["Could you show me the toll receipt? If that’s the amount, I’ll pay it.",2,"Verifies calmly."],["Fine, take it.",1,"Quick, but you didn’t verify."]],r:["“I’m an honest driver!”","“Thank you.”","“Here’s the receipt. Thanks for understanding.”"]}]},
delivery:{setup:"Your food order is 30 minutes late and the delivery person arrives.",rounds:[
 {q:"“Sorry, there was a lot of traffic and rain.”",o:[["You’re very late! I’ll give you one star!",0,"Penalises them for things beyond their control."],["Thanks for bringing it in this weather. I hope you stay safe.",2,"Kind and appreciative."],["Okay, give me the bag.",1,"Neutral, but a small thanks matters."]],r:["(looks down) “Sorry…”","“Thanks.”","(smiles) “Thank you! Enjoy your meal.”"]},
 {q:"“The packet looks a bit damaged. It’s not from my side.”",o:[["It’s your fault! Take it back!",0,"Blames the wrong person."],["I understand, thank you for telling me. I’ll report it through the app. I appreciate your effort.",2,"Fair, honest, constructive."],["Ugh, fine.",1,"Okay, but gives no next step."]],r:["“Please don’t complain about me…”","“Okay…”","“Thank you for understanding.”"]}]},
shopkeeper:{setup:"You want to buy a good bag at a market stall, within your budget.",rounds:[
 {q:"“This bag? Best quality. 800 only!”",o:[["That’s junk! Worth 200 at best!",0,"Insulting kills the deal."],["It looks nice. My budget is around 500. Could you do a better price?",2,"Friendly, honest and specific."],["Too expensive. Bye.",1,"Direct, but ends the conversation."]],r:["“Then go elsewhere!”","“Okay, 700 last price.”","“600 for you, since you’re polite. I’ll add a free strap.”"]},
 {q:"“Do you want it? Last price 600.”",o:[["You’re a cheat! Make it 400!",0,"Escalates haggling into insult."],["Thanks, that’s fair. Could you do 550? I’ll take it right now.",2,"A respectful counter-offer with clear intent."],["Okay, give it.",1,"Fine; you may overpay without a counter."]],r:["“Nonsense, forget it!”","“Okay, here.”","“Deal! 550. Thank you, come again.”"]}]},
tradesperson:{setup:"Your kitchen tap leaks and the plumber arrives.",rounds:[
 {q:"“What’s the problem?”",o:[["Just fix it quickly, it’s leaking everywhere.",0,"Vague; hard to diagnose or price."],["The tap drips when it’s on. Could you check and tell me the cost before starting?",2,"A clear symptom plus agreed pricing."],["You tell me. You’re the plumber.",1,"Puts all the work on them."]],r:["“Okay… I’ll see.” (charges more later)","“Let me look.”","“The washer is worn. About 300 for the part and work.”"]},
 {q:"“It’s done. That’s 600.”",o:[["You said 300! Cheat!",0,"Accuses before checking."],["The estimate was 300. Could you explain what changed?",2,"Calm and factual."],["Fine, take it.",1,"Avoids conflict but lets a mismatch pass."]],r:["“Do you doubt me?”","“OK.”","“I replaced one more part. I should have told you first, sorry. I’ll make it 400.”"]}]},
guard:{setup:"A guard stops you at the gate and asks for ID after you forgot your card.",rounds:[
 {q:"“I need to see your ID, please.”",o:[["Don’t you know me? I live here!",0,"Challenges them for doing their job."],["Of course, thank you for being careful. I forgot my card. Could you call flat 5 to confirm?",2,"Cooperative and solution-oriented."],["Ugh, hold on.",1,"Impatient, with no solution."]],r:["“Rules are rules.”","“Please wait.”","“Thank you for understanding. Please wait while I call.”"]},
 {q:"“Please sign the visitor register for your guest.”",o:[["Why so many rules?",0,"Complaining to the wrong person."],["Sure. Thanks for keeping us safe. Please let me know if my guest needs anything at the gate.",2,"Appreciative and cooperative."],["Okay.",1,"Fine; a thank-you would help."]],r:["“It’s the society’s rule.”","“Thanks.”","“Always happy to help. Have a good evening.”"]}]},
waiter:{setup:"Your soup arrives cold at a restaurant.",rounds:[
 {q:"“Here’s your soup. Enjoy!”",o:[["This is cold! Take it away!",0,"Blunt and public."],["Thank you. The soup is a bit cold. Could you please warm it or bring a fresh one?",2,"Polite, specific, solution-oriented."],["(Say nothing and eat)",1,"Avoids conflict, but you stay unhappy."]],r:["“Sorry…” (flustered)","(you never get what you wanted)","“Of course, sorry! I’ll bring it right away.”"]},

 ["“प्रोजेक्ट B लेट क्यों है?”",[["क्योंकि दूसरी टीम ने इनपुट नहीं भेजे।","दूसरों पर दोष डालना बचाव जैसा लगता है, चाहे सच ही हो।"],["सॉरी, मेरी ग़लती है।","ज़िम्मेदारी लेना अच्छा है – साथ में ये भी बताइए कि आगे क्या करेंगे।"],["इनपुट देर से आए। मैंने उनके साथ नई तारीख़ तय कर ली है और शुक्रवार को आपको अपडेट दूँगा/दूँगी।","फ़ैक्ट्स, हल की ज़िम्मेदारी और साफ़ फ़ॉलो-अप।"]],["“मुझे बहाने नहीं चाहिए।”","“ठीक है। प्लान क्या है?”","“शुक्रिया, मुझे यही अपडेट चाहिए था।”"]]]],
junior:["एक नए जॉइनर ने ग़लतियों वाला काम जमा किया है और वो घबराया हुआ लग रहा है।",[
 ["(नीचे देखते हुए) “मुझे लगता है मैंने सही किया है…”",[["कई ग़लतियाँ हैं। दोबारा करो।","सहारे के बिना सीधी बात घबराए हुए सीखने वाले को जमा देती है।"],["कोई बात नहीं, मैं खुद ठीक कर लेता/लेती हूँ।","आज के लिए अच्छा, पर उनके सीखने का मौक़ा छिन जाता है।"],["इसे पूरा करने के लिए शुक्रिया। चलो साथ में देखते हैं – तुम्हें किस बारे में सबसे कम यक़ीन है?","तारीफ़ के साथ न्योता डर कम करता है।"]],["“सॉरी… मैं और कोशिश करूँगा/करूँगी।”","(धीरे से) “ठीक है…”","“मुझे फ़ॉर्मूले पर यक़ीन नहीं था। क्या आप दिखा सकते हैं?”"]],
 ["“मैं आपको सवालों से परेशान नहीं करना चाहता/चाहती थी।”",[["तुम्हें पूछना चाहिए – इसी से सीखते हैं।","सच है, पर भाषण जैसा लग सकता है।"],["सवाल कभी परेशानी नहीं होते। मैं बाद में गड़बड़ ठीक करने से बेहतर अभी सवाल सुनना चाहता/चाहती हूँ। पूछना आसान कैसे हो?","तसल्ली देता है और हल का न्योता देता है।"],["अगली बार पहले ख़ुद समझने की कोशिश करो।","उन्हें कभी न पूछना सिखा देता है।"]],["“ठीक है…”","“अगली बार पूछने की कोशिश करूँगा/करूँगी।”","“शायद रोज़ 11 बजे एक छोटी चैट?”"]]]],
elder:["आपके दादाजी आज पाँचवीं बार पूछ रहे हैं कि फ़ोन कैसे चलाएँ।",[
 ["“तुम्हारे भाई को कॉल कैसे करूँ? भूल गया।”",[["मैंने आपको आज सुबह ही दिखाया था।","उन्हें बोझ जैसा महसूस होता है।"],["लीजिए, फ़ोन मुझे दीजिए।","जल्दी हो जाता है, पर उनकी आज़ादी छिन जाती है।"],["बिल्कुल! क्या हम स्टेप्स एक कार्ड पर लिख लें ताकि आप ख़ुद कर सकें? पहले यहाँ दबाइए।","धैर्यवान, सशक्त करने वाला, और टिकाऊ हल।"]],["“मैं तो सबके लिए बोझ हूँ…”","(फ़ोन थमाते हुए आह भरते हैं)","“वाह! अब मैं जब चाहूँ कॉल कर सकता हूँ।”"]],
 ["“हमारे ज़माने में इस सबकी ज़रूरत नहीं थी।”",[["ज़माना बदल गया है, दादाजी।","सच है पर बात को टाल देता है।"],["बताइए आप पहले कैसे संपर्क में रहते थे।","उनकी कहानी का न्योता और उनके तजुर्बे का सम्मान।"],["हाँ, तब सब कुछ आसान था।","हामी भरना ठीक है, पर जुड़ने का मौक़ा चूक जाता है।"]],["“हुँह।”","“हाँ… चिट्ठियों में हफ़्ते लग जाते थे।”","(मुस्कुराते हुए) “मैं बताता हूँ मैंने तुम्हारी दादी को कितनी चिट्ठियाँ लिखी थीं…”"]]]],
teacher:["आपके मार्क्स कम आए हैं और आप चाहते हैं कि टीचर आपका पेपर दोबारा देखें।",[
 ["“हाँ? क्या बात है?”",[["आपने मुझे ग़लत नंबर दिए!","इल्ज़ाम से दरवाज़ा बंद हो जाता है।"],["सर/मैम, क्या आप समझा सकते हैं कि मैंने Q3 और Q5 में कहाँ मार्क्स खोए? मैं सुधार करना चाहता/चाहती हूँ।","ख़ास, विनम्र और ग्रोथ पर ध्यान वाला।"],["क्या आप बस मेरे मार्क्स बढ़ा सकते हैं?","ध्यान मार्क्स पर है, सीखने पर नहीं।"]],["“मुझे आपका लहजा पसंद नहीं आया।”","“मार्क्स रूब्रिक के हिसाब से मिलते हैं।”","“बिल्कुल। बैठो, साथ में देखते हैं।”"]],
 ["“क्या तुमने टेस्ट से पहले रिवीज़न किया था?”",[["हाँ, बहुत किया था, पर वो बहुत मुश्किल था।","शायद सच हो, पर बहाने जैसा लगता है।"],["ज़्यादा नहीं – मैंने सिर्फ़ आख़िरी दिन पढ़ा। मैं जल्दी शुरू करूँगा/करूँगी। क्या मैं अपना प्लान दिखा सकता/सकती हूँ?","ईमानदारी से ज़िम्मेदारी लेना परिपक्वता दिखाता है।"],["सबको मुश्किल लगा।","टालने से आपकी साख घटती है।"]],["“बहानों से कुछ नहीं होगा।”","“तो टाइम मैनेजमेंट पर काम करो।”","“ईमानदारी की कद्र है। सोमवार को लेकर आओ।”"]]]],
partner:["आपका पार्टनर परेशान होकर घर आता है और काम के बारे में भड़ास निकालने लगता है।",[
 ["“मेरे बॉस ने आज मीटिंग में मेरी बेइज़्ज़ती की।”",[["तो छोड़ दो नौकरी।","उन्हें सुने जाने का एहसास होने से पहले ही हल पर कूद जाना।"],["ये तो बहुत अपमानजनक लगता है, मुझे दुख है। तुम भड़ास निकालना चाहते हो या आइडिया चाहिए?","मान्यता देता है और पूछता है उन्हें क्या चाहिए।"],["इसे दिल पर मत लो।","नेक इरादे से, पर चोट को कम आँकता है।"]],["“तुम मुझे कभी नहीं समझते।”","(आह भरते हुए) “शायद…”","“बस पहले सुन लो। शुक्रिया।”"]],
 ["“और तुम मेरे बोलते वक़्त फ़ोन पर हो!”",[["मैं तो सुन रहा/रही था/थी!","बचाव वाला; ध्यान सही साबित होने पर चला जाता है।"],["तुम सही हो, सॉरी। फ़ोन दूर – बाक़ी बताओ।","तुरंत मानता है और सुधार करता है।"],["सॉरी, आगे बोलो।","ठीक है, पर काम से दिखाइए (फ़ोन नीचे रखिए)।"]],["“छोड़ो, कोई बात नहीं।”","“हम्म… ठीक है।”","“शुक्रिया, मेरे लिए बहुत मायने रखता है।”"]]]],
friend:["आपके क़रीबी दोस्त का एक ज़रूरी इम्तिहान में रिज़ल्ट ख़राब आया।",[
 ["“मैंने सब बर्बाद कर दिया।”",[["कम से कम कोशिश तो की। और भी लोग फ़ेल हुए।","तसल्ली देने के लिए, पर “कम से कम” छोटा लग सकता है।"],["मैंने कहा था ज़्यादा पढ़ो।","जब वे आहत हैं तब जजमेंट।"],["ये सच में मुश्किल है। मैं यहीं हूँ। बात करना चाहोगे या थोड़ा टहलें?","साथ और चुनाव, बिना हल थोपे।"]],["“मुझे हँसाने की कोशिश मत करो।”","“शायद…”","(साँस छोड़ते हुए) “चलो टहलते हैं। शुक्रिया।”"]],
 ["“शायद मैं काफ़ी अच्छा नहीं हूँ।”",[["ऐसा मत बोलो। तुम तो ब्रिलियंट हो!","दयालु है, पर भावना को टाल सकता है।"],["अभी बहुत दर्द हो रहा है। एक नतीजा ये तय नहीं करता कि तुम कौन हो। मुझसे तुम्हें क्या चाहिए?","दर्द को मानता है और सहारा देता है।"],["तो शायद कुछ और आज़माओ।","उन्हें बहुत जल्दी छोड़ देना।"]],["“तुम भी यही सोचते हो।”","“शुक्रिया…”","“बस थोड़ी देर मेरे साथ बैठे रहो।”"]]]],
teen:["आपका टीनएजर देर रात फ़ोन पर है और आप पर झल्ला पड़ता है।",[
 ["“मुझे अकेला छोड़ दो!”",[["मुझसे ऐसे बात मत करो! अभी फ़ोन बंद!","पावर-स्ट्रगल में बदल जाता है।"],["ठीक है। कुछ भारी लग रहा है। जब बात करना चाहो, मैं यहीं हूँ।","उनकी जगह की इज़्ज़त करता है और उपलब्ध रहता है।"],["ठीक है, पर 11 बजे तक सो जाना।","सीमा सही है, पर भावना छूट गई।"]],["(दरवाज़ा पटक देता है)","(बुदबुदाते हुए) “जो भी।”","(बाद में) “क्या हम बात कर सकते हैं? आज का दिन बुरा था।”"]],
 ["“सबके पास रात को फ़ोन होता है। आप समझते नहीं।”",[["मुझे फ़र्क नहीं पड़ता सब क्या करते हैं।","नकारना बातचीत ख़त्म कर देता है।"],["लगता है दोस्तों से जुड़े रहना तुम्हारे लिए मायने रखता है। चलो ऐसा नियम बनाएँ जो हम दोनों के लिए ठीक हो।","उन्हें सुनता है, फिर मिलकर हल बनाता है।"],["ठीक है, पर सिर्फ़ एक घंटा।","समझौता है, पर उन्हें शामिल नहीं किया गया।"]],["“आप हमेशा कंट्रोल करते हो!”","“जो भी।”","“ठीक है। स्कूल के दिनों में 11 बजे बंद कैसा रहेगा?”"]]]],
relative:["परिवार के एक गेट-टुगेदर में एक अंकल बेमतलब के सवाल पूछ रहे हैं।",[
 ["“तो शादी कब कर रहे हो? सैलरी कितनी है?”",[["ये आपका मामला नहीं है!","सबके सामने टकराव पैदा करता है।"],["(मुस्कुराकर) परवाह के लिए शुक्रिया! जब कोई अच्छी ख़बर होगी तो बताएँगे। आपका बिज़नेस कैसा चल रहा है?","शिष्ट, गर्मजोशी भरा और बात बदल देता है।"],["हम्म… जल्दी ही।","बात टल जाती है पर और सवाल बुलाती है।"]],["“आजकल कितनी बेअदबी है!”","“जल्दी कब? कब?”","“हा, बिज़नेस अच्छा है! सुनो तो…”"]],
 ["“तुम्हारा कज़िन तो बहुत आगे निकल गया। तुम्हें उससे सीखना चाहिए।”",[["तो आप अपने चहेते कज़िन के पास ही रहिए।","व्यंग्य रिश्ते बिगाड़ता है।"],["वो अच्छा कर रहा है, मुझे ख़ुशी है। मैं अपने रास्ते पर हूँ और आपके आशीर्वाद चाहूँगा/चाहूँगी।","शालीन और सीमा तय करने वाला।"],["अच्छा, अच्छा।","शांति रहती है, पर आप अनसुना महसूस कर सकते हैं।"]],["“कितना बदतमीज़!”","“हुँह, बड़ों की सुनो।”","“बेशक, आशीर्वाद है तुम्हारे साथ।”"]]]],
colleague:["एक कलीग ने मीटिंग में आपका आइडिया अपना बनाकर पेश कर दिया।",[
 ["मीटिंग के बाद आप उन्हें पकड़ते हैं। वे कहते हैं: “अरे! क्या हाल?”",[["तुमने मेरा आइडिया चुराया! मैं सबको बता दूँगा/दूँगी।","इल्ज़ाम और धमकी बात को बढ़ाते हैं।"],["क्या एक मिनट है? मीटिंग में मुझे लगा मेरे हिस्से का ज़िक्र नहीं हुआ। मैं चाहता/चाहती हूँ हम एक-दूसरे को क्रेडिट दें। क्या हम इस पर सहमत हो सकते हैं?","तथ्य, भावना, अनुरोध।"],["छोड़ो। कोई बात नहीं।","चुप्पी नाराज़गी छोड़ देती है और पैटर्न दोहराता है।"]],["“तुम ड्रामा कर रहे हो।”","“ठीक है फिर।”","“ठीक कहा। सॉरी, मुझे कहना चाहिए था कि ये साझा आइडिया था।”"]],

mother:["आपकी माँ बार-बार पूछ रही हैं कि खाना खाया या नहीं, और आप थके और चिड़चिड़े हैं।",[

father:["आप एक बड़े फ़ैसले के लिए पिताजी का साथ चाहते हैं, पर वे सख़्त और चुप रहते हैं।",[
