<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Kya Kahenge Chaar Log</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;background:#FFFDF8;font-family:'Times New Roman',Times,serif;color:#2a2a2a;font-size:17px;}
.wrap{max-width:700px;margin:0 auto;padding:32px 18px;}

.hdr{text-align:center;margin-bottom:28px;}
.hdr h1{font-size:clamp(1.5rem,5vw,2.3rem);color:#c0392b;border-bottom:2px solid #c0392b;display:inline-block;padding-bottom:5px;font-weight:bold;}
.hdr p{margin-top:8px;font-size:.88rem;color:#bbb;letter-spacing:1px;}

.card{background:#fff;border:1px solid #e8d8c8;border-radius:12px;padding:22px 24px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.lbl{font-size:.68rem;letter-spacing:2px;text-transform:uppercase;color:#bbb;display:block;margin-bottom:11px;}

textarea{
  width:100%;border:1px solid #d8ccbe;border-radius:8px;
  padding:12px 15px;font-family:inherit;font-size:1.05rem;
  background:#FFFDF8;outline:none;color:#2a2a2a;
  transition:border-color .2s;min-height:110px;resize:vertical;line-height:1.7;
}
textarea::placeholder{color:#bbb;}
textarea:focus{border-color:#c0392b;}

.btn{font-family:inherit;font-size:.98rem;letter-spacing:1px;border:1px solid #c0392b;border-radius:8px;cursor:pointer;color:#fff;background:#c0392b;padding:12px 22px;transition:background .15s;}
.btn:hover{background:#a93226;}
.btn:disabled{background:#ccc;border-color:#ccc;cursor:not-allowed;}
.btn-gen{display:block;width:100%;margin-top:12px;font-size:1.05rem;padding:14px;}

.err{color:#c0392b;font-size:.85rem;margin-top:7px;}

#loading{display:none;text-align:center;padding:30px;font-size:.95rem;color:#bbb;letter-spacing:1px;}

#rlist{display:none;}
.rtitle{text-align:center;font-size:.68rem;letter-spacing:2px;text-transform:uppercase;color:#ccc;margin-bottom:14px;}

.rrow{
  display:flex;align-items:center;gap:0;
  margin-bottom:14px;animation:si .35s ease-out both;
}
.rrow:nth-child(1){animation-delay:.04s}
.rrow:nth-child(2){animation-delay:.13s}
.rrow:nth-child(3){animation-delay:.22s}
.rrow:nth-child(4){animation-delay:.31s}

.ccol{
  display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:108px;
  background:#fff;border:1px solid #e8d8c8;border-right:none;
  border-radius:12px 0 0 12px;padding:16px 8px 12px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);align-self:stretch;justify-content:center;
}
.cname{margin-top:7px;font-size:.7rem;letter-spacing:1px;text-transform:uppercase;color:#aaa;text-align:center;}
.cbadge{margin-top:4px;font-size:.62rem;letter-spacing:.8px;padding:2px 8px;border-radius:20px;color:#fff;text-align:center;opacity:.88;}

.bcol{
  flex:1;background:#fff;border:1px solid #e8d8c8;border-radius:0 12px 12px 0;
  padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,.04);
  align-self:stretch;display:flex;flex-direction:column;justify-content:center;position:relative;
}
.bcol::before{content:'';position:absolute;left:-13px;top:50%;transform:translateY(-50%);border:8px solid transparent;border-right:13px solid #e8d8c8;}
.bcol::after{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);border:6px solid transparent;border-right:10px solid #fff;}
.sfxtag{font-size:.75rem;color:#c0392b;letter-spacing:.5px;margin-bottom:5px;display:block;}
.dialogue{font-size:1.07rem;line-height:1.65;color:#2a2a2a;}

@keyframes si{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}

@media(max-width:480px){
  .rrow{flex-direction:column;}
  .ccol{border-radius:12px 12px 0 0;border-right:1px solid #e8d8c8;border-bottom:none;width:100%;flex-direction:row;gap:12px;justify-content:flex-start;padding:12px 16px;}
  .bcol{border-radius:0 0 12px 12px;}
  .bcol::before,.bcol::after{display:none;}
}
</style>
</head>

async function go(){
  const input=document.getElementById('txt').value.trim();
  if(!input)return;

  if(WORKER_URL==="WORKER_URL_HERE"){
    document.getElementById('genErr').textContent='⚠️ Please set up the Cloudflare Worker first and update WORKER_URL in this file.';
    return;
  }

  document.getElementById('rlist').style.display='none';
  document.getElementById('loading').style.display='block';
  document.getElementById('genBtn').disabled=true;
  document.getElementById('genBtn').textContent='Soch rahe hain...';
  document.getElementById('genErr').textContent='';

  const prompt=`You are writing a comedy sketch. Someone just announced: "${input}"

Write 4 DIFFERENT funny Hinglish reactions. Each must be SPECIFIC to this exact situation.

Characters:
- Sharma Ji: nosy uncle. Jealous, ALWAYS brings up Sharma ji ka beta. Log kya kahenge.
- Aunty Ji: gossip queen. Already told 5 people. Says Suno suno or Haaye. Mentions her own daughter.
- Bade Papa: strict elder. Khandaan ki izzat. Says hamare zamane mein. Lectures and sulks.
- College Dost: Gen Z bestie. Hypes or roasts. Says bhai/yaar/bro. Short punchy lines.

Rules:
- Each dialogue MUST reference something specific from the situation
- Vary emotions (Jealous, Smug, Devastated, Confused, Proud, Suspicious, Relieved, Hyped, etc.)
- Vary sfx (Ram Ram!, Haaye!, Tobah!, Wah wah!, Arre!, Bas karo!, BHAI!, Matlab?!, etc.)
- Max 28 words each. Be creative and funny.

Respond ONLY with a JSON array, zero explanation:
[{"character":"Sharma Ji","emotion":"word","sfx":"sound!","dialogue":"hinglish"},{"character":"Aunty Ji","emotion":"word","sfx":"sound!","dialogue":"hinglish"},{"character":"Bade Papa","emotion":"word","sfx":"sound!","dialogue":"hinglish"},{"character":"College Dost","emotion":"word","sfx":"sound!","dialogue":"hinglish"}]`;

  let panels=null;
  try{
    const res=await fetch(WORKER_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-haiku-4-5-20251001",
        max_tokens:800,
        temperature:1,
        messages:[{role:"user",content:prompt}]
      })
    });
    const d=await res.json();
    if(d.error)throw new Error(d.error.message||'API error');
    const t=(d.content||[]).map(c=>c.text||'').join('');
    const clean=t.replace(/```json|```/g,'').trim();
    const m=clean.match(/\[[\s\S]*\]/);
    if(!m)throw new Error('Could not parse response');
    const p=JSON.parse(m[0]);
    if(Array.isArray(p)&&p.length>=4)panels=p.slice(0,4);
    else throw new Error('Incomplete response');
  }catch(e){
    document.getElementById('genErr').textContent='Error: '+e.message+' — please try again.';
  }

  document.getElementById('loading').style.display='none';
  document.getElementById('genBtn').disabled=false;
  document.getElementById('genBtn').textContent='Kya Kahenge Chaar Log →';
  if(panels)render(panels);
}

function render(panels){
  const rows=document.getElementById('rows');
  rows.innerHTML='';
  panels.forEach((r,i)=>{
    const ch=C[r.character]||Object.values(C)[i];
    const d=document.createElement('div');
    d.className='rrow';
    d.innerHTML=`
      <div class="ccol">
        ${ch.svg}
        <div class="cname">${r.character}</div>
        <div class="cbadge" style="background:${ch.ac}">${r.emotion}</div>
      </div>
      <div class="bcol">
        <span class="sfxtag">${r.sfx}</span>
        <span class="dialogue">${r.dialogue}</span>
      </div>`;
    rows.appendChild(d);
  });
  const rl=document.getElementById('rlist');
  rl.style.display='block';
  rl.scrollIntoView({behavior:'smooth',block:'start'});
}

document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter')go();});
</script>
