<title>Digital Product Marketplaces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: phone-style app column. Sticky top bar with search and filters, tappable list rows, bottom tab bar, detail sheets that slide up. */
:root {
  --bg: #EEF1F6;
  --surface: #FFFFFF;
  --ink: #141A23;
  --muted: #5B6575;
  --line: #DCE1EA;
  --accent: #2540D9;
  --accent-ink: #FFFFFF;
  --tint: #E4E9FA;
  --av-s: 70%; --av-l: 91%; --av-tl: 30%; --rl: 42%; --hd-bg: #2540D9; --hd-ink: #FFFFFF;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1218; --surface: #171C25; --ink: #E8ECF2; --muted: #9BA5B3;
    --line: #272E3A; --accent: #93A5FF; --accent-ink: #0E1218; --tint: #232B47;
    --av-s: 35%; --av-l: 24%; --av-tl: 82%; --rl: 70%; --hd-bg: #1C2552; --hd-ink: #E8ECF2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1218; --surface: #171C25; --ink: #E8ECF2; --muted: #9BA5B3;
  --line: #272E3A; --accent: #93A5FF; --accent-ink: #0E1218; --tint: #232B47;
  --av-s: 35%; --av-l: 24%; --av-tl: 82%; --rl: 70%; --hd-bg: #1C2552; --hd-ink: #E8ECF2;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-block: 0 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--hd-bg);
}
body.lock { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.shell { max-width: 640px; margin: 0 auto; }

/* Top bar */
.top {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-off, 0px)); z-index: 20;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
}
.bar { background: var(--hd-bg); color: var(--hd-ink); padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
.home { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-align: left; color: inherit; }
.logo { flex: none; width: 36px; height: 36px; border-radius: 10px; }
.bt { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; letter-spacing: -.01em; line-height: 1.1; }
.hb { position: relative; flex: none; width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: rgba(255, 255, 255, .16); color: var(--hd-ink); }
.hb svg { width: 22px; height: 22px; }
.hb.on { background: #fff; color: var(--hd-bg); }
.mdot, .scount { position: absolute; top: 6px; right: 6px; }
.mdot { width: 9px; height: 9px; border-radius: 50%; background: #FFC857; }
.scount { min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: #FFC857; color: #1a1a1a; font: 700 10px/16px var(--f-mono); text-align: center; }
.sbox { background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.sbox-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
.sbox input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; height: 44px; }
.sx { flex: none; width: 44px; height: 44px; border-radius: 12px; color: var(--muted); display: grid; place-items: center; font-size: 16px; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; letter-spacing: -.01em; line-height: 1.1; margin: 0; }
.search input {
  width: 100%; font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 46px;
}
.search input::placeholder { color: var(--muted); }
/* App icons: real site icon on top, drawn glyph underneath as fallback */
.ico {
  position: relative; flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 13px; overflow: hidden;
  background: hsl(var(--h) var(--av-s) var(--av-l)); color: hsl(var(--h) 55% var(--av-tl));
}
.ico .gl { width: 74%; height: 74%; }
.ico img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 3%; background: transparent; opacity: 0; transition: opacity .15s; }
.ico.ok img { opacity: 1; }
.ico.ok { background: transparent; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0 2px 8px; }
.vt { display: inline-flex; gap: 4px; }
.vt button { font-family: var(--f-body); font-size: 12.5px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.vt button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.count { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 16px 6px; padding-top: 8px; }
.app-wrap { position: relative; }
.app { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; display: grid; justify-items: center; gap: 7px; text-decoration: none; text-align: center; padding: 4px 2px; }
.view .apps .ico { width: 56px; height: 56px; border-radius: 14px; }
.an { font-size: 12px; font-weight: 500; line-height: 1.2; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.ib { position: absolute; top: -2px; right: 4px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.ib svg { width: 14px; height: 14px; }

/* Fixed left rail: stays in view while the list scrolls */
.split { display: flex; gap: 10px; align-items: flex-start; }
.list { flex: 1; min-width: 0; }
.rail {
  flex: none; width: 70px; display: grid; gap: 4px; padding: 6px 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-off, 0px) + var(--bar-h, 112px) + 6px);
  max-height: calc(100vh - var(--bar-h, 112px) - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto; scrollbar-width: none;
}
.rail::-webkit-scrollbar { display: none; }
.rb { width: 100%; display: grid; justify-items: center; gap: 3px; padding: 9px 2px; min-height: 58px; border-radius: 12px; font-size: 11.5px; font-weight: 500; line-height: 1.15; text-align: center; }
.rb .n { display: none; font-family: var(--f-mono); font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ri { color: hsl(var(--h, 220) 72% var(--rl, 42%)); }
.ri svg { display: block; width: 26px; height: 26px; }
.rb[aria-pressed="true"] { background: hsl(var(--h, 220) var(--av-s) var(--av-l)); font-weight: 600; }
.rb[aria-pressed="true"] .n { color: var(--ink); }
.split .ico { width: 38px; height: 38px; border-radius: 11px; }
.split .row-main { padding-left: 10px; gap: 10px; }
.split .avl { margin-left: 10px; }
.rb .l { display: none; }
.split .save { width: 42px; }

/* Content */
.view { padding-top: 14px; }
.view-head { margin: 10px 2px 12px; }
.view-head h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; line-height: 1.1; margin: 0 0 4px; }
.view-head p { margin: 0; color: var(--muted); font-size: 14.5px; }
.count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin: 6px 2px 8px; font-variant-numeric: tabular-nums; }
.info {
  background: var(--tint); border-radius: 14px; padding: 14px 16px; font-size: 14.5px; margin-bottom: 12px;
}
.info { text-align: left; }
.info a { color: var(--accent); font-weight: 600; }
.group { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.row { display: flex; align-items: stretch; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 12px 4px 12px 12px; min-height: 68px; }
.avl { flex: none; align-self: center; margin-left: 14px; display: block; text-decoration: none; }

}

document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-place],[data-kit],[data-save],[data-tab],[data-cat],[data-tip],[data-close],[data-menu],[data-view]");
  if (!el) { if (e.target.id === "scrim") closeSheet(); return; }
  if (el.hasAttribute("data-close")) return closeSheet();
  if (el.hasAttribute("data-view")) { state.view = el.getAttribute("data-view"); renderExplore(); return; }
  if (el.hasAttribute("data-tab")) { closeSheet(); state.tab = el.getAttribute("data-tab"); render(); window.scrollTo(0, 0); return; }
  if (el.hasAttribute("data-cat")) {
    var r = document.querySelector(".rail"), st = r ? r.scrollTop : 0;
    var cc = el.getAttribute("data-cat"); state.cat = state.cat === cc ? "all" : cc; renderExplore();
    r = document.querySelector(".rail"); if (r) r.scrollTop = st;
    window.scrollTo(0, 0); return;
  }
  if (el.hasAttribute("data-tip")) {
    var t = TIPS[+el.getAttribute("data-tip")][0], p = done.indexOf(t);
    if (p > -1) done.splice(p, 1); else done.push(t);
    store("dpm-done", done); renderTips(); return;
  }
  if (el.hasAttribute("data-save")) {
    var i = +el.getAttribute("data-save");
    toggleSave(i);
    if (openSheet) placeSheet(i);
    render();
    return;
  }
  if (el.hasAttribute("data-place")) { var pi = +el.getAttribute("data-place"); if (pi > -1) placeSheet(pi); return; }
  if (el.hasAttribute("data-kit")) { kitSheet(+el.getAttribute("data-kit")); return; }
});
document.addEventListener("contextmenu", function (e) {
  var a = e.target.closest ? e.target.closest(".app") : null;
  if (!a) return;
  e.preventDefault();
  placeSheet(+a.getAttribute("data-i"));
});
document.addEventListener("keydown", function (e) {
  if (e.key !== "Escape") return;
  if (openSheet) closeSheet(); else if (!$("sbox").hidden) closeSearch(true);
});
$("q").addEventListener("input", function (e) { state.q = e.target.value; renderExplore(); });
function updateMdot() { $("mdot").hidden = !($("sbox").hidden && state.q.trim()); }
function openSearch() { $("sbox").hidden = false; $("mg").setAttribute("aria-expanded", "true"); updateMdot(); fitBar(); $("q").focus(); }
function closeSearch(clear) {
  if (clear) { $("q").value = ""; state.q = ""; if (state.tab === "explore") renderExplore(); }
  $("sbox").hidden = true; $("mg").setAttribute("aria-expanded", "false"); updateMdot(); fitBar();
}
$("mg").addEventListener("click", openSearch);
$("sx").addEventListener("click", function () { closeSearch(true); });
$("q").addEventListener("blur", function () { if (!state.q.trim()) closeSearch(false); });
window.addEventListener("resize", fitBar);
$("sv").addEventListener("click", function () { closeSheet(); state.tab = state.tab === "saved" ? "explore" : "saved"; render(); window.scrollTo(0, 0); });
$("home").addEventListener("click", function () { closeSheet(); state.tab = "explore"; render(); window.scrollTo(0, 0); });

render();
</script></body></html>
